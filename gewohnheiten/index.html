<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEWOHNHEITEN</title>
<meta name="description" content="Gewohnheits-Tracker mit Streak-Flammen und Heatmap. Nichts mit Trading oder Geld zu tun, läuft rein lokal im Browser.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%231a0d08%27/%3E%3Cpath%20d%3D%27M32%2010c6%2010-8%2014-4%2024%204%208%2014%208%2018%200%204%2010-6%2020-14%2020s-16-8-16-18c0-8%206-12%2010-16%202-4%204-8%206-10z%27%20fill%3D%27%23ff6a3d%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d0805;
  --panel:#171009;
  --line:#2e1d10;
  --text:#f7ede2;
  --muted:#9c8873;
  --flame:#ff6a3d;
  --amber:#ffb454;
  --gold:#ffd166;
  --green:#5be8a8;
  --rose:#ff5f7a;
}
*{box-sizing:border-box}
html{overflow-x:hidden;}
body{
  margin:0; overflow-x:hidden; min-height:100vh;
  background:radial-gradient(circle at 50% -10%,#2a160a 0,transparent 45%), var(--bg);
  color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}

.topbar{
  height:66px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; position:sticky; top:0; z-index:50; background:rgba(13,8,5,.88); backdrop-filter:blur(18px);
}
.brand{display:flex; gap:11px; align-items:center; font-weight:900; letter-spacing:1px;}
.logo{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--flame),var(--gold));
  color:#2a0f02; display:grid; place-items:center; font-weight:1000; font-size:16px;
  box-shadow:0 0 20px rgba(255,106,61,.45); animation:logo-puls 2.4s ease-in-out infinite;}
@keyframes logo-puls{0%,100%{box-shadow:0 0 14px rgba(255,106,61,.3); transform:scale(1);} 50%{box-shadow:0 0 26px rgba(255,106,61,.65); transform:scale(1.05);}}
.back-link{color:var(--muted); text-decoration:none; font-size:12px; border:1px solid var(--line); padding:7px 12px; border-radius:8px; transition:border-color .15s,color .15s;}
.back-link:hover{color:var(--text); border-color:var(--flame);}
@media (prefers-reduced-motion:reduce){.logo{animation:none;}}

.main{padding:28px; max-width:980px; width:100%; margin:0 auto;}
.hero{margin-bottom:24px; position:relative;}
.hero::before{content:''; position:absolute; top:-50px; left:-30px; width:380px; height:200px; z-index:-1;
  background:radial-gradient(circle,rgba(255,106,61,.16),transparent 70%); pointer-events:none; animation:hero-glow 4s ease-in-out infinite;}
@keyframes hero-glow{0%,100%{opacity:.5;} 50%{opacity:1;}}
.kicker{color:var(--flame); font-size:11px; letter-spacing:2px; font-weight:800; text-shadow:0 0 12px rgba(255,106,61,.5);}
h1{font-size:32px; margin:7px 0; letter-spacing:-1px;
  background:linear-gradient(120deg,#fff 10%,var(--flame) 40%,var(--gold) 65%,#fff 95%);
  background-size:250% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:title-shine 7s linear infinite;}
@keyframes title-shine{to{background-position:250% center;}}
.subtitle{color:var(--muted); font-size:13px; max-width:560px;}
@media (prefers-reduced-motion:reduce){h1{animation:none;} .hero::before{animation:none;}}

/* SUMMARY */
.summary{display:flex; align-items:center; gap:22px; background:linear-gradient(145deg,#1d1108,#120a05); border:1px solid var(--line);
  border-radius:16px; padding:20px; margin-bottom:22px; flex-wrap:wrap; position:relative; overflow:hidden;}
.summary::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--flame),var(--gold),var(--rose));}
.ring{width:78px; height:78px; border-radius:50%; display:grid; place-items:center; font-size:16px; font-weight:950; flex-shrink:0; position:relative;}
.ring b{position:relative; z-index:1;}
.summary-text b{font-size:20px;}
.summary-text{font-size:13px; color:var(--muted);}
.summary-text b{color:var(--text); display:block; font-size:16px; margin-bottom:2px;}

/* FORM */
.form-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.form-row input[type="text"]{flex:1; min-width:160px; background:#130c07; border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:9px; font-size:13px; transition:border-color .15s,box-shadow .15s;}
.form-row input:focus{outline:none; border-color:var(--flame); box-shadow:0 0 0 3px rgba(255,106,61,.15);}
.emoji-picker{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
.emoji-btn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:#130c07; font-size:16px; display:grid; place-items:center; transition:border-color .15s,transform .12s;}
.emoji-btn.sel, .emoji-btn:hover{border-color:var(--flame); transform:translateY(-1px);}
.btn{border:1px solid var(--line); background:#1a110a; color:var(--text); padding:11px 18px; border-radius:9px; font-size:12px; font-weight:800; transition:border-color .15s,box-shadow .15s,transform .12s;}
.btn:hover{border-color:var(--flame); transform:translateY(-1px); box-shadow:0 6px 18px -8px rgba(255,106,61,.45);}
.btn.primary{background:linear-gradient(135deg,rgba(255,106,61,.18),rgba(255,209,102,.1)); border-color:#5a3418; color:var(--gold);}
.btn.primary:hover{box-shadow:0 6px 20px -8px rgba(255,209,102,.5);}

/* HABIT CARD */
.habit-list{display:flex; flex-direction:column; gap:14px;}
.habit{background:linear-gradient(145deg,#170f08,#0f0a05); border:1px solid var(--line); border-radius:16px; padding:18px;
  position:relative; overflow:hidden; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.habit::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--flame),var(--gold)); opacity:0; transition:opacity .18s ease;}
.habit:hover{transform:translateY(-3px); border-color:#4a2c14; box-shadow:0 14px 32px -16px rgba(255,106,61,.28);}
.habit:hover::before{opacity:1;}
.habit-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
.habit-emoji{font-size:26px; flex-shrink:0;}
.habit-name{font-weight:800; font-size:15px; flex:1; min-width:100px;}
.streak-badge{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:900; color:var(--flame); flex-shrink:0;}
.streak-badge .flame-emoji{font-size:15px; filter:drop-shadow(0 0 6px rgba(255,106,61,.7));}
.streak-badge.cold{color:var(--muted);}
.best-streak{font-size:10.5px; color:var(--muted); flex-shrink:0;}
.habit-today{border:1px solid var(--line); background:#130c07; color:var(--muted); padding:8px 14px; border-radius:9px; font-size:12px; font-weight:800; flex-shrink:0; transition:all .15s;}
.habit-today.done{background:linear-gradient(135deg,rgba(91,232,168,.16),rgba(91,232,168,.06)); border-color:rgba(91,232,168,.4); color:var(--green); box-shadow:0 0 16px rgba(91,232,168,.15);}
.habit-del{background:none; border:none; color:var(--muted); font-size:15px; padding:2px 6px; border-radius:6px; flex-shrink:0;}
.habit-del:hover{color:var(--rose); background:rgba(255,95,122,.08);}

/* HEATMAP */
.heatmap{display:flex; gap:3px; overflow-x:auto; padding-bottom:2px;}
.heatmap-week{display:flex; flex-direction:column; gap:3px;}
.heatmap-day{width:12px; height:12px; border-radius:3px; background:#1c130a; border:1px solid #241809; cursor:pointer; transition:transform .1s,box-shadow .1s; flex-shrink:0;}
.heatmap-day:hover{transform:scale(1.25);}
.heatmap-day.done{background:var(--flame); border-color:var(--flame); box-shadow:0 0 6px rgba(255,106,61,.5);}
.heatmap-day.today{box-shadow:0 0 0 1.5px var(--gold);}
.heatmap-day.future{cursor:default; opacity:.25;}
.empty{color:#4a3a2c; font-size:12px; padding:20px 4px; text-align:center;}

::-webkit-scrollbar{width:10px; height:8px;}
::-webkit-scrollbar-thumb{background:#2e1d10; border-radius:6px;}

@media(max-width:480px){
  .habit-head{gap:8px;}
  .habit-name{flex-basis:100%; order:1;}
  .heatmap{gap:2px;}
  .heatmap-day{width:10px; height:10px;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">🔥</div>GEWOHNHEITEN</div>
  <a class="back-link" href="../persoenlicher-assistent/">← Alltag-Assistent</a>
</div>

<div class="main">
  <div class="hero">
    <div class="kicker">STREAKS · KEIN GELD · KEIN TRADING</div>
    <h1>Dranbleiben zählt</h1>
    <div class="subtitle">Gewohnheiten täglich abhaken, Streaks aufbauen, nicht abreißen lassen. Alles bleibt nur in diesem Browser gespeichert.</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="form-row">
    <input type="text" id="habitInput" placeholder="Neue Gewohnheit, z.B. 'Sport' oder 'Lesen'...">
  </div>
  <div class="form-row">
    <div class="emoji-picker" id="emojiPicker"></div>
    <button class="btn primary" id="habitAdd">+ Gewohnheit starten</button>
  </div>

  <div class="habit-list" id="habitList"></div>
</div>

<script>
(function(){
  const LS_KEY = 'gw_habits';
  const EMOJIS = ['💪','📖','🧘','💧','🏃','🥗','😴','✍️','🎯','🚭','🎨','🧹'];
  let gewaehltesEmoji = EMOJIS[0];

  function load() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : []; } catch (err) { return []; } }
  function save(habits) { localStorage.setItem(LS_KEY, JSON.stringify(habits)); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function dstr(d) { return d.toISOString().slice(0, 10); }
  function heute() { return dstr(new Date()); }

  let habits = load();

  // ---- EMOJI-PICKER ----
  function renderEmojiPicker() {
    document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e =>
      `<button type="button" class="emoji-btn ${e === gewaehltesEmoji ? 'sel' : ''}" data-emoji="${e}">${e}</button>`
    ).join('');
    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => { gewaehltesEmoji = btn.dataset.emoji; renderEmojiPicker(); });
    });
  }
  renderEmojiPicker();

  // ---- STREAK-BERECHNUNG ----
  function streaks(tage) {
    const setTage = new Set(Object.keys(tage).filter(d => tage[d]));
    // aktueller Streak: von heute (oder gestern, falls heute noch offen) rückwärts zählen
    let cursor = new Date();
    if (!setTage.has(heute())) cursor.setDate(cursor.getDate() - 1);
    let aktuell = 0;
    while (setTage.has(dstr(cursor))) { aktuell++; cursor.setDate(cursor.getDate() - 1); }
    // bester Streak: längste zusammenhängende Kette in den gespeicherten Tagen
    const sortiert = [...setTage].sort();
    let bester = 0, lauf = 0, vorher = null;
    for (const d of sortiert) {
      const cur = new Date(d);
      if (vorher) {
        const diffTage = Math.round((cur - vorher) / 86400000);
        lauf = diffTage === 1 ? lauf + 1 : 1;
      } else { lauf = 1; }
      bester = Math.max(bester, lauf);
      vorher = cur;
    }
    return { aktuell, bester: Math.max(bester, aktuell) };
  }

  // ---- HEATMAP (letzte 63 Tage, 9 Wochen) ----
  function heatmapHtml(habitId, tage) {
    const heuteD = new Date();
    heuteD.setHours(0, 0, 0, 0);
    const tageGesamt = 63;
    // auf Sonntag der aktuellen Woche ausrichten, damit Wochen sauber untereinander stehen
    const start = new Date(heuteD);
    start.setDate(start.getDate() - tageGesamt + 1 - start.getDay());
    const wochen = [];
    let woche = [];
    for (let i = 0; i < tageGesamt + 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dstr(d);
      const istZukunft = d > heuteD;
      const istHeute = key === heute();
      const istDone = !!tage[key];
      woche.push(`<div class="heatmap-day ${istDone ? 'done' : ''} ${istHeute ? 'today' : ''} ${istZukunft ? 'future' : ''}" data-habit="${habitId}" data-datum="${key}" title="${key}"></div>`);
      if (woche.length === 7) { wochen.push(`<div class="heatmap-week">${woche.join('')}</div>`); woche = []; }
    }
    return `<div class="heatmap">${wochen.join('')}</div>`;
  }

  // ---- RENDER ----
  function renderSummary() {
    const wrap = document.getElementById('summary');
    if (!habits.length) { wrap.innerHTML = '<div class="empty">Noch keine Gewohnheiten - leg unten die erste an.</div>'; return; }
    const heuteStr = heute();
    const erledigt = habits.filter(h => h.tage[heuteStr]).length;
    const pct = Math.round((erledigt / habits.length) * 100);
    const farbe = pct === 100 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--flame)';
    const besterGesamt = Math.max(0, ...habits.map(h => streaks(h.tage).aktuell));
    wrap.innerHTML = `
      <div class="ring" style="background:conic-gradient(${farbe} ${pct * 3.6}deg, #241809 0deg);">
        <div style="position:absolute; inset:6px; border-radius:50%; background:var(--panel);"></div>
        <b>${pct}%</b>
      </div>
      <div class="summary-text"><b>${erledigt} / ${habits.length} heute erledigt</b>Höchster laufender Streak: ${besterGesamt} Tag${besterGesamt === 1 ? '' : 'e'} 🔥</div>
    `;
  }

  function renderHabits() {
    const wrap = document.getElementById('habitList');
    if (!habits.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = habits.map(h => {
      const s = streaks(h.tage);
      const heuteDone = !!h.tage[heute()];
      return `
      <div class="habit" data-id="${h.id}">
        <div class="habit-head">
          <div class="habit-emoji">${h.emoji}</div>
          <div class="habit-name">${escapeHtml(h.name)}</div>
          <div class="streak-badge ${s.aktuell === 0 ? 'cold' : ''}"><span class="flame-emoji">🔥</span>${s.aktuell}</div>
          <div class="best-streak">Beste: ${s.bester}</div>
          <button class="habit-today ${heuteDone ? 'done' : ''}" data-action="toggle-heute">${heuteDone ? '✓ Heute erledigt' : 'Heute abhaken'}</button>
          <button class="habit-del" data-action="del">✕</button>
        </div>
        ${heatmapHtml(h.id, h.tage)}
      </div>`;
    }).join('');

    wrap.querySelectorAll('.habit').forEach(el => {
      const id = el.dataset.id;
      const habit = habits.find(h => h.id === id);
      el.querySelector('[data-action="toggle-heute"]').addEventListener('click', () => {
        const k = heute();
        habit.tage[k] = !habit.tage[k];
        save(habits); renderAll();
      });
      el.querySelector('[data-action="del"]').addEventListener('click', () => {
        habits = habits.filter(h => h.id !== id); save(habits); renderAll();
      });
      el.querySelectorAll('.heatmap-day:not(.future)').forEach(cell => {
        cell.addEventListener('click', () => {
          const k = cell.dataset.datum;
          habit.tage[k] = !habit.tage[k];
          save(habits); renderAll();
        });
      });
    });
  }

  function renderAll() { renderSummary(); renderHabits(); }
  renderAll();

  document.getElementById('habitAdd').addEventListener('click', () => {
    const inp = document.getElementById('habitInput');
    const name = inp.value.trim();
    if (!name) return;
    habits.push({ id: 'h' + Date.now() + Math.random().toString(36).slice(2, 7), name, emoji: gewaehltesEmoji, tage: {} });
    save(habits);
    inp.value = '';
    renderAll();
  });
  document.getElementById('habitInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('habitAdd').click(); });
})();
</script>
</body>
</html>

name: diag-mcp-quellen
on:
  push:
    branches: [feat/mcp-mehr-quellen]
    paths: [.github/workflows/diag-mcp-quellen.yml, automations/lib/mcpQuellen2.mjs]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module -e "
          import * as q from './automations/lib/mcpQuellen2.mjs';
          for (const n of ['smithery', 'huggingface', 'dockerhub', 'nuget', 'maven', 'codeberg']) {
            const fn = n === 'dockerhub' ? q.dockerHub : q[n];
            const t = Date.now();
            try { const l = await fn(); console.log(n, l.length, Math.round((Date.now() - t) / 1000) + 's', JSON.stringify(l[0] || {}).slice(0, 200)); }
            catch (e) { console.log(n, 'FEHLER', e.message); }
          }"

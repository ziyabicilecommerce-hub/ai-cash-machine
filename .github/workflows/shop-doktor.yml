name: "Shop-Doktor + Produkt-Feeds"

# Täglich 04:40 UTC: prüft beide Live-Shops nur mit öffentlichen Daten (kein Shopify-Schlüssel nötig)
# und baut die Produkt-Feeds für Google Shopping, Facebook/Instagram und Pinterest neu.
# Ergebnis: Zentrale > Shop-Doktor, Feeds unter <GitHub-Pages>/zentrale/feeds/.

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shop-doktor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shops prüfen und Feeds bauen
        run: node automations/shop-doktor.mjs
        env:
          VIDEO_FABRIK_SHOPS: ${{ vars.VIDEO_FABRIK_SHOPS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Speichern und Seite aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zentrale/daten/shop-doktor.json zentrale/feeds automations/state/shop-schnappschuss.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "chore: Shop-Doktor und Produkt-Feeds [skip ci]"
          for versuch in 1 2 3; do git pull -q --rebase --autostash origin "$GITHUB_REF_NAME" && git push -q && break; sleep $((versuch * 5)); done
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi

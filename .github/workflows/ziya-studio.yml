name: "🎬 Ziya Studio (KI-Video aus einer Idee)"

# Kostenloses KI-Video-Studio nach dem Higgsfield-Prinzip: Idee + Kamera-Preset -> mehrere Shots ->
# echte KI-Clips (Wan 2.2 / LTX, optional CogVideoX-Flash) -> Nachbearbeitung -> fertiges 9:16-Video als Artifact.
# Starten: Actions > Ziya Studio > Run workflow.

on:
  workflow_dispatch:
    inputs:
      idee:
        description: 'Deine Video-Idee in einem Satz (am besten Englisch, z. B. "a black hole swallowing a star")'
        required: true
      preset:
        description: 'Kamera-Preset'
        type: choice
        default: dolly-in
        options: [anime-kampf, dolly-in, dolly-out, crash-zoom, orbit, fpv, crane-up, bullet-time, handheld, zeitlupe, grusel]
      shots:
        description: 'Anzahl Shots (1-18, je ~3,4 s - 18 = ~60 s)'
        default: '3'
      sekunden:
        description: 'Sekunden pro Shot (2-5)'
        default: '3.5'
      menschen:
        description: 'Menschen im Bild erlauben?'
        type: boolean
        default: false
      durchgehend:
        description: 'Durchgehende Szene (jeder Shot startet mit dem letzten Bild des vorigen)?'
        type: boolean
        default: true
      loop:
        description: 'Nahtloser Loop (Video endet, wo es anfängt - mehr Wiederholungen auf TikTok)?'
        type: boolean
        default: false
      geschichte:
        description: 'Geschichte/Kurzfilm (eigene Figuren, jede Szene ein anderer Moment, mit Erzähler)?'
        type: boolean
        default: false
      krass:
        description: 'Krass-Modus (Hook am Anfang, Impact-Schnitte, Bass, große Untertitel)?'
        type: boolean
        default: true
      stil:
        description: 'Bild-Stil'
        type: choice
        default: kino
        options: [kino, cartoon, anime]
      text:
        description: 'Sprechertext auf Deutsch (optional, leer = nur Kino-Sound)'
        required: false
        default: ''
      hook:
        description: 'Großer Text in den ersten 2 Sekunden (optional, z. B. "Wer gewinnt?")'
        required: false
        default: ''
  # NACHTWERK-Bots (nachtwerk-bots.yml) rufen das Studio mit denselben Eingaben auf.
  workflow_call:
    inputs:
      idee: { type: string, required: true }
      preset: { type: string, default: dolly-in }
      shots: { type: string, default: '6' }
      sekunden: { type: string, default: '3.5' }
      menschen: { type: boolean, default: false }
      durchgehend: { type: boolean, default: true }
      loop: { type: boolean, default: false }
      geschichte: { type: boolean, default: false }
      stil: { type: string, default: kino }
      krass: { type: boolean, default: true }
      text: { type: string, default: '' }
      hook: { type: string, default: '' }
    outputs:
      run_url:
        value: ${{ jobs.studio.outputs.run_url }}

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    # Mit Kaggle-Turbo wartet der Lauf auf die Kaggle-GPU (mehrere Stunden möglich).
    timeout-minutes: 340
    # Eine Kaggle-GPU für alle: Bestellungen warten aufeinander statt sich gegenseitig zu stören.
    concurrency:
      group: ziya-studio
      cancel-in-progress: false
    outputs:
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      ZIYA_IDEE: ${{ inputs.idee }}
      ZIYA_PRESET: ${{ inputs.preset }}
      ZIYA_SHOTS: ${{ inputs.shots }}
      ZIYA_SEKUNDEN: ${{ inputs.sekunden }}
      ZIYA_MENSCHEN: ${{ inputs.menschen && 'ja' || 'nein' }}
      ZIYA_DURCHGEHEND: ${{ inputs.durchgehend && 'ja' || 'nein' }}
      ZIYA_TEXT: ${{ inputs.text }}
      ZIYA_HOOK: ${{ inputs.hook }}
      ZIYA_GESCHICHTE: ${{ inputs.geschichte && 'ja' || 'nein' }}
      ZIYA_STIL: ${{ inputs.stil }}
      ZIYA_KRASS: ${{ inputs.krass && 'ja' || 'nein' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZIYA_LOOP: ${{ inputs.loop && 'ja' || 'nein' }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      # Optional, kostenlos: mehr KI-Video-Kontingent (huggingface.co) bzw. CogVideoX-Flash (Zhipu AI).
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Optional: echtes Seedance (ByteDance) über BytePlus ModelArk - neue Konten bekommen ein Gratis-Startkontingent.
      BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
      SEEDANCE_MODELL: ${{ vars.SEEDANCE_MODELL }}
      BYTEPLUS_API_BASE: ${{ vars.BYTEPLUS_API_BASE }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      # Optional, kostenlos: Kaggle-Konto (30 GPU-Stunden/Woche) -> jede Szene ein echter KI-Clip ohne Tageslimit.
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      # Kaggle ganz aus: Repo-Variable ZIYA_KAGGLE=aus.
      ZIYA_KAGGLE: ${{ vars.ZIYA_KAGGLE }}
      # Optional: Modal (modal.com, 30 $ Gratis-Guthaben/Monat) - schnellere GPU, 720p direkt. Hat Vorrang vor Kaggle.
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ZIYA_QUALITAET: ${{ vars.ZIYA_QUALITAET || 'kino' }}
      ZHIPU_API_BASE: ${{ vars.ZHIPU_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: ffmpeg, gradio_client, edge-tts und KI-Hochskalierer installieren
        uses: ./.github/actions/video-werkzeug
        with:
          pip: 'gradio_client edge-tts==7.* kaggle modal --extra-index-url https://download.pytorch.org/whl/cpu torch spandrel numpy'
      # Real-ESRGAN-Gewichte (~3 MB) zwischenspeichern.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/real-esrgan
          key: real-esrgan-v1
      - name: Video bauen
        run: node automations/ziya-studio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ziya-video
          path: |
            out/ziya-studio/ziya-*.mp4
            out/ziya-studio/shot*.jpg
            out/ziya-studio/bericht.json
            out/ziya-studio/film.nachtwerk.json
          retention-days: 14

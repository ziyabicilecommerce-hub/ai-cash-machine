name: "91 · MCP-Katalog"

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mcp-katalog
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automations/91-mcp-katalog.mjs
      - name: Katalog committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp-hub/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: MCP-Katalog aktualisiert [skip ci]"
            git push
          fi

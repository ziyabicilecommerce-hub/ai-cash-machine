name: "🤖 NACHTWERK-Bots (Video auf Bestellung)"

# Bot-Netzwerk: Auf https://<user>.github.io/ai-cash-machine/nachtwerk/bots.html einen Bot wählen und die Idee eintippen.
# Die Seite öffnet ein vorausgefülltes Issue (Label video-bot). Dieser Workflow liest den Auftrag, lässt das Ziya Studio
# das Video bauen (inkl. NACHTWERK-Projektdatei zum Weiterschneiden) und antwortet im Issue mit dem Download-Link.
# Nur Issues vom Repo-Besitzer starten einen Lauf (Kaggle- und Gratis-Kontingente schützen).

on:
  issues:
    # Nur "labeled": ein neues Issue mit Label meldet sonst opened UND labeled -> zwei Läufe.
    types: [labeled]

permissions:
  contents: read
  issues: write
  models: read  # GitHub Models: Gratis-Text-KI mit dem eingebauten Token

jobs:
  auftrag:
    if: github.event.label.name == 'video-bot' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.lesen.outputs.ok }}
      bot: ${{ steps.lesen.outputs.bot }}
      idee: ${{ steps.lesen.outputs.idee }}
      preset: ${{ steps.lesen.outputs.preset }}
      stil: ${{ steps.lesen.outputs.stil }}
      shots: ${{ steps.lesen.outputs.shots }}
      sekunden: ${{ steps.lesen.outputs.sekunden }}
      geschichte: ${{ steps.lesen.outputs.geschichte }}
      menschen: ${{ steps.lesen.outputs.menschen }}
      durchgehend: ${{ steps.lesen.outputs.durchgehend }}
      loop: ${{ steps.lesen.outputs.loop }}
      text: ${{ steps.lesen.outputs.text }}
      hook: ${{ steps.lesen.outputs.hook }}
      krass: ${{ steps.lesen.outputs.krass }}
      englisch: ${{ steps.lesen.outputs.englisch }}
      ende: ${{ steps.lesen.outputs.ende }}
      ultimativ: ${{ steps.lesen.outputs.ultimativ }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: lesen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
          KI_GITHUB_MODELS: ${{ vars.KI_GITHUB_MODELS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node automations/nachtwerk-bot-auftrag.mjs
      - name: Rückmeldung
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.lesen.outputs.ok }}
          FEHLER: ${{ steps.lesen.outputs.fehler }}
          ULTIMATIV: ${{ steps.lesen.outputs.ultimativ }}
          BESCHREIBUNG: ${{ steps.lesen.outputs.beschreibung }}
          BESCHREIBUNG_EN: ${{ steps.lesen.outputs.beschreibung_en }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = "true" ] && [ "$ULTIMATIV" = "true" ]; then
            printf '%s\n\n%s\n\n**TikTok-Text zum Kopieren:**\n```\n%s\n```\n\n**🇬🇧 English (für *-en.mp4):**\n```\n%s\n```\n\n_KI-generiert – beim Posten als KI-Inhalt kennzeichnen._\n' "🔥 **ULTIMATIV-Auftrag angenommen** – Geschichte mit Erzähler, echte KI-Animation, 3D-Parallax, Hook, Abspann, Deutsch + Englisch. Dauert 2–5 Stunden." "Fortschritt: $LAUF" "$BESCHREIBUNG" "$BESCHREIBUNG_EN" > antwort.md
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file antwort.md
          elif [ "$OK" = "true" ]; then
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "🤖 Auftrag angenommen – das Video wird gebaut (je nach Länge 1–5 Stunden). Fortschritt: $LAUF"
          else
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "⚠️ Auftrag nicht lesbar: $FEHLER"
          fi

  video:
    needs: auftrag
    if: needs.auftrag.outputs.ok == 'true'
    uses: ./.github/workflows/ziya-studio.yml
    secrets: inherit
    with:
      idee: ${{ needs.auftrag.outputs.idee }}
      preset: ${{ needs.auftrag.outputs.preset }}
      stil: ${{ needs.auftrag.outputs.stil }}
      shots: ${{ needs.auftrag.outputs.shots }}
      sekunden: ${{ needs.auftrag.outputs.sekunden }}
      geschichte: ${{ needs.auftrag.outputs.geschichte == 'true' }}
      menschen: ${{ needs.auftrag.outputs.menschen == 'true' }}
      durchgehend: ${{ needs.auftrag.outputs.durchgehend == 'true' }}
      loop: ${{ needs.auftrag.outputs.loop == 'true' }}
      text: ${{ needs.auftrag.outputs.text }}
      hook: ${{ needs.auftrag.outputs.hook }}
      krass: ${{ needs.auftrag.outputs.krass != 'false' }}
      englisch: ${{ needs.auftrag.outputs.englisch == 'true' }}
      ende: ${{ needs.auftrag.outputs.ende }}

  fertig:
    needs: [auftrag, video]
    if: ${{ !cancelled() && needs.auftrag.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ERGEBNIS: ${{ needs.video.result }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ERGEBNIS" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "✅ Fertig! Download: $LAUF → unten bei **Artifacts** auf **ziya-video**. Drin: das Video (ziya-….mp4) und **film.nachtwerk.json** – die in NACHTWERK über „Projekt öffnen“ laden und von Hand weiterschneiden."
            gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "❌ Das Video ist diesmal nicht fertig geworden ($ERGEBNIS). Protokoll: $LAUF"
          fi

  vorschau:
    needs: [auftrag, video]
    if: needs.video.result == 'success'
    uses: ./.github/workflows/nachtwerk-vorschau.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      run_id: ${{ github.run_id }}
      issue: ${{ github.event.issue.number }}

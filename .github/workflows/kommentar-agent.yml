name: "Kommentar-Agent"

# Stündlich (8-22 Uhr Berlin): beantwortet neue Kommentare unter den eigenen Posts ehrlich (Fragen,
# Kaufinteresse mit Produkt-Link, Lob) und meldet Heikles per Telegram. Speichert nur IDs und Zähler.

on:
  schedule:
    - cron: '23 6-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kommentar-agent
  cancel-in-progress: false

# Kostenlose KI-Schlüssel (optional, machen die KI stabil - siehe Zentrale > 15 Kanäle > KI).
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Eigene KI starten (kostenlos, ohne Schlüssel, ohne Limit)
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL || 'qwen2.5:3b' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kommentare beantworten
        run: node automations/kommentar-agent.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERBINDER_PASSWORT: ${{ secrets.VERBINDER_PASSWORT }}
          VERBINDER_URL: ${{ vars.VERBINDER_URL }}
          POLLINATIONS_MAX_TOKENS_PRO_TAG: ${{ secrets.POLLINATIONS_MAX_TOKENS_PRO_TAG }}
      - name: Community-Chat (Telegram-Gruppe begrüßen und Fragen beantworten)
        continue-on-error: true
        run: node automations/community-chat.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLLINATIONS_MAX_TOKENS_PRO_TAG: ${{ secrets.POLLINATIONS_MAX_TOKENS_PRO_TAG }}
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in automations/state/kommentare.json zentrale/daten/kommentare.json automations/state/community-chat.json zentrale/daten/community-chat.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "chore: Kommentar-Agent [skip ci]"
          for versuch in 1 2 3; do git pull -q --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" && git push -q && exit 0; sleep $((versuch * 5)); done
          exit 1

name: "Leistungs-Sammler + Trend-Radar"

# Täglich vor dem Werbe-Labor (03:50 UTC): holt die echten Zahlen aller Posts der letzten 14 Tage
# und rechnet den Lernstand neu. Labor und Video-Fabrik bauen danach mehr von dem, was wirkt.

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leistung-sammler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zahlen holen und Lernstand rechnen
        run: node automations/leistung-sammler.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      - name: Trend-Radar (Google Trends DE, passend zur Nische)
        run: node automations/trend-radar.mjs
        env:
          TREND_NISCHE: ${{ vars.TREND_NISCHE }}
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in video-feed/posts.json automations/state/lernen.json automations/state/trends.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "chore: Leistungs-Zahlen und Lernstand [skip ci]"
          for versuch in 1 2 3; do git pull -q --rebase --autostash origin "$GITHUB_REF_NAME" && git push -q && exit 0; sleep $((versuch * 5)); done
          exit 1

name: "🤖 NACHTWERK-Tagesbot (jeden Tag ein Video)"

# Jede Nacht ist ein anderer Bot dran (Grusel, Cartoon, Anime, Kino, Welten, Drachen, Tier-Action), erfindet sich eine Idee und baut mit dem
# Ziya Studio ein Video (Krass-Modus, KI-Kennzeichnung im Bericht). Ergebnis + Vorschaubild landen in einem Issue
# (Label tages-video). Gepostet wird nichts automatisch. Von Hand: Actions > NACHTWERK-Tagesbot > Run workflow.

on:
  # Zwei Tagesvideos: nachts und nachmittags (jeweils anderer Bot). GitHub startet geplante Läufe oft Stunden später.
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: 'Bestimmten Bot nehmen (leer = Bot des Tages)'
        type: choice
        default: ''
        options: ['', grusel, cartoon, anime, kino, welt, drache, tier]

permissions:
  contents: read
  issues: write

jobs:
  idee:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.issue.outputs.nummer }}
      idee: ${{ steps.plan.outputs.idee }}
      preset: ${{ steps.plan.outputs.preset }}
      stil: ${{ steps.plan.outputs.stil }}
      shots: ${{ steps.plan.outputs.shots }}
      sekunden: ${{ steps.plan.outputs.sekunden }}
      geschichte: ${{ steps.plan.outputs.geschichte }}
      menschen: ${{ steps.plan.outputs.menschen }}
      durchgehend: ${{ steps.plan.outputs.durchgehend }}
      hook: ${{ steps.plan.outputs.hook }}
      text: ${{ steps.plan.outputs.text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Eigene KI im Lauf (Ollama, Modell im Cache): letztes Netz, wenn die Gratis-Dienste hängen (24.10.: 5 min, dann nichts).
      - name: Eigene KI starten (kostenlos, ohne Schlüssel, ohne Limit)
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL_FABRIK || 'qwen2.5:7b' }}
      - name: Frühere Folgen holen (für die Serie)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list -R "$GITHUB_REPOSITORY" --label tages-video --state all --limit 60 --json title,body > "$RUNNER_TEMP/frueher.json" || echo '[]' > "$RUNNER_TEMP/frueher.json"
      - id: plan
        env:
          TAGES_FRUEHER: ${{ runner.temp }}/frueher.json
          TAGES_BOT: ${{ inputs.bot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: node automations/nachtwerk-tagesbot.mjs
      - id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: ${{ steps.plan.outputs.titel }}
          IDEE: ${{ steps.plan.outputs.idee }}
          BESCHREIBUNG: ${{ steps.plan.outputs.beschreibung }}
          BESCHREIBUNG_EN: ${{ steps.plan.outputs.beschreibung_en }}
          FOLGE: ${{ steps.plan.outputs.folge }}
          QUELLE: ${{ steps.plan.outputs.quelle }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create tages-video -R "$GITHUB_REPOSITORY" --color 9b7cff --description "Tagesvideo eines NACHTWERK-Bots" 2>/dev/null || true
          printf '%s\n\n**Folge:** %s · **Idee-Quelle:** %s\n\n**Idee:** %s\n\n**TikTok-Text zum Kopieren:**\n```\n%s\n```\n\n**🇬🇧 English (für die englische Fassung *-en.mp4):**\n```\n%s\n```\n\nWird gerade gebaut: %s\n\n_KI-generiert – beim Posten als KI-Inhalt kennzeichnen._\n' "🤖 Tagesvideo vom Bot." "$FOLGE" "$QUELLE" "$IDEE" "$BESCHREIBUNG" "$BESCHREIBUNG_EN" "$LAUF" > text.md
          URL=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITEL" --label tages-video --body-file text.md)
          echo "nummer=${URL##*/}" >> "$GITHUB_OUTPUT"

  video:
    needs: idee
    uses: ./.github/workflows/ziya-studio.yml
    secrets: inherit
    with:
      idee: ${{ needs.idee.outputs.idee }}
      preset: ${{ needs.idee.outputs.preset }}
      stil: ${{ needs.idee.outputs.stil }}
      shots: ${{ needs.idee.outputs.shots }}
      sekunden: ${{ needs.idee.outputs.sekunden }}
      geschichte: ${{ needs.idee.outputs.geschichte == 'true' }}
      menschen: ${{ needs.idee.outputs.menschen == 'true' }}
      durchgehend: ${{ needs.idee.outputs.durchgehend == 'true' }}
      krass: true
      hook: ${{ needs.idee.outputs.hook }}
      ende: Fortsetzung folgt...
      englisch: true
      # Zwei Videos am Tag teilen sich die 30 Kaggle-Stunden pro Woche: höchstens 110 min GPU je Video.
      kaggle_min: '110'
      text: ${{ needs.idee.outputs.text }}

  fertig:
    needs: [idee, video]
    if: ${{ !cancelled() && needs.idee.outputs.issue != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ERGEBNIS: ${{ needs.video.result }}
          ISSUE: ${{ needs.idee.outputs.issue }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ERGEBNIS" = "success" ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "✅ Fertig! Download: $LAUF → unten bei **Artifacts** auf **ziya-video** (Video + film.nachtwerk.json zum Weiterschneiden in NACHTWERK)."
          else
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "❌ Heute kein Video ($ERGEBNIS). Protokoll: $LAUF"
          fi

  vorschau:
    needs: [idee, video]
    if: needs.video.result == 'success'
    uses: ./.github/workflows/nachtwerk-vorschau.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      run_id: ${{ github.run_id }}
      issue: ${{ needs.idee.outputs.issue }}

name: "99 · Direkt-Poster"

# Postet stuendlich (08-22 Uhr) je 1 noch nie gepostetes deutsches/sprachfreies Video aus dem
# Video-Feed - jede Plattform nur bis zu ihrem sicheren Tageslimit (z. B. TikTok 4, Instagram 3,
# YouTube 6, Telegram 12; siehe LIMITS in 99-direkt-poster.mjs, per Variable LIMIT_<NAME> aenderbar).
# So kommen je nach Plattform 3-12 Posts pro Tag zusammen, ohne Spam-Strafen. Kostenlos, offizielle APIs.

on:
  schedule:
    - cron: '47 6-20 * * *'
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Wie viele Videos jetzt posten (1-10)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: direkt-poster
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Video aus dem Feed posten
        run: node automations/99-direkt-poster.mjs --aus-feed "${{ inputs.anzahl || '1' }}"
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_SICHTBARKEIT: ${{ vars.YOUTUBE_SICHTBARKEIT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL_ID: ${{ vars.TELEGRAM_KANAL_ID }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DIREKT_POSTER_PLATTFORMEN: ${{ vars.DIREKT_POSTER_PLATTFORMEN }}
          LIMIT_YOUTUBE: ${{ vars.LIMIT_YOUTUBE }}
          LIMIT_TIKTOK: ${{ vars.LIMIT_TIKTOK }}
          LIMIT_INSTAGRAM: ${{ vars.LIMIT_INSTAGRAM }}
          LIMIT_FACEBOOK: ${{ vars.LIMIT_FACEBOOK }}
          LIMIT_THREADS: ${{ vars.LIMIT_THREADS }}
          LIMIT_LINKEDIN: ${{ vars.LIMIT_LINKEDIN }}
          LIMIT_PINTEREST: ${{ vars.LIMIT_PINTEREST }}
          LIMIT_DAILYMOTION: ${{ vars.LIMIT_DAILYMOTION }}
          LIMIT_BLUESKY: ${{ vars.LIMIT_BLUESKY }}
          LIMIT_TELEGRAM: ${{ vars.LIMIT_TELEGRAM }}
          LIMIT_MASTODON: ${{ vars.LIMIT_MASTODON }}
          LIMIT_DISCORD: ${{ vars.LIMIT_DISCORD }}
          LIMIT_REDDIT: ${{ vars.LIMIT_REDDIT }}
          VERBINDER_PASSWORT: ${{ secrets.VERBINDER_PASSWORT }}
          VERBINDER_URL: ${{ vars.VERBINDER_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODUS: ${{ vars.TIKTOK_MODUS }}
          TIKTOK_SICHTBARKEIT: ${{ vars.TIKTOK_SICHTBARKEIT }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ vars.LINKEDIN_PERSON_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT: ${{ vars.REDDIT_SUBREDDIT }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          PINTEREST_API_BASIS: ${{ vars.PINTEREST_API_BASIS }}
          DAILYMOTION_API_KEY: ${{ secrets.DAILYMOTION_API_KEY }}
          DAILYMOTION_API_SECRET: ${{ secrets.DAILYMOTION_API_SECRET }}
          DAILYMOTION_USERNAME: ${{ secrets.DAILYMOTION_USERNAME }}
          DAILYMOTION_PASSWORD: ${{ secrets.DAILYMOTION_PASSWORD }}
      - name: Merken, was gepostet wurde
        run: |
          [ -f video-feed/gepostet.json ] || exit 0
          [ -f video-feed/post-zaehler.json ] || echo '{}' > video-feed/post-zaehler.json
          [ -f video-feed/posts.json ] || echo '[]' > video-feed/posts.json
          scripts/video-feed-veroeffentlichen.sh "https://github.com/${GITHUB_REPOSITORY}/releases" video-feed/gepostet.json video-feed/post-zaehler.json video-feed/posts.json

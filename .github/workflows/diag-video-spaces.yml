name: "Diag · Video-Spaces-Scan"
on:
  push:
    branches: [diag/video-spaces]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in mcp-hub/ mcp-hub/catalog.json mcp-hub/live.json automations-dashboard/; do
            curl -sS -o body -w "$u HTTP %{http_code} %{size_download} Bytes\n" "https://ziyabicilecommerce-hub.github.io/ai-cash-machine/$u?x=$RANDOM"
          done
          grep -o "<title>[^<]*" body; grep -c 'class="num">92' body

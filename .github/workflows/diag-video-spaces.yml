name: "Diag · Video-Spaces-Scan"
on:
  push:
    branches: [diag/video-spaces]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - run: python3 scripts/hf-video-spaces-gentest.py

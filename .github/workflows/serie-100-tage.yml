name: "🎬 Serie: 100 Tage KI-Firma (@futureflowx3 + YouTube, 18:30)"

# 22.11. (Nutzer: "mach das auf TikTok und so mit Buffer, das soll einen Sound haben"): jeden Tag eine Folge der Serie
# "100 Tage KI-Firma". Bildschirmfotos der eigenen Dashboards, Text-Einblendungen, Stimme (edge-tts) + selbst erzeugter Beat.
# Geplant für 18:30 Uhr deutsche Zeit: @futureflowx3 (TikTok) auf Deutsch, giyuuu sama (YouTube) auf Englisch. Folgen: automations/lib/serieFolgen.mjs.
# Jede Folge nur einmal: gepostet = Release "serie-tag-<NN>" existiert. Tag 1 wurde von Hand eingeplant.

on:
  # 23.11.: GitHub hat beide Zeitpläne (14:07 + 15:37 UTC) komplett ausgelassen - bei über 100 Workflows im Repo
  # verwirft GitHub geplante Läufe unter Last. Deshalb 9 Versuche zwischen ~13 und ~17 Uhr Berlin; jeder Lauf
  # prüft zuerst, ob das Release serie-tag-NN schon existiert, und hört dann sofort auf.
  schedule:
    - cron: '11,41 12-15 * * *'
    - cron: '11 16 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag der Serie (leer = heute)'
        required: false
      posten:
        description: 'In Buffer einplanen (aus = nur bauen und als Release ablegen)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: serie-100-tage
  cancel-in-progress: false

jobs:
  folge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      SERIE_TAG: ${{ inputs.tag }}
      # Gewinner der Abstimmung von Tag 6 (Settings -> Variables -> SERIE_PRODUKT), z. B. "Deal-Radar"
      SERIE_PRODUKT: ${{ vars.SERIE_PRODUKT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Folge vorbereiten
        id: folge
        run: node automations/119-serie-tag.mjs --vorbereiten
      - name: Schon gepostet?
        id: neu
        if: steps.folge.outputs.tag != ''
        run: |
          TAG="serie-tag-$(printf '%02d' ${{ steps.folge.outputs.tag }})"
          echo "release=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag ${{ steps.folge.outputs.tag }} ist schon draußen ($TAG) - nichts zu tun." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "weiter=nein" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
          fi
      # Ersatz-Stimme (Piper, offline), falls die Microsoft-Stimme einmal nicht erreichbar ist
      - name: Piper-Stimme aus dem Cache
        if: steps.neu.outputs.weiter == 'ja'
        uses: actions/cache@v4
        with:
          path: ~/piper
          key: piper-de-thorsten-en-ryan-high-v1
      - name: Werkzeuge installieren
        if: steps.neu.outputs.weiter == 'ja'
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q pillow edge-tts piper-tts
          mkdir -p ~/piper && cd ~/piper
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main
          for f in de/de_DE/thorsten/high/de_DE-thorsten-high en/en_US/ryan/high/en_US-ryan-high; do
            for e in onnx onnx.json; do
              n="$(basename "$f").$e"; [ -s "$n" ] || curl -sSL --fail -o "$n" "$B/$f.$e" || echo "Piper-Modell $n fehlt - nur Microsoft-Stimme"
            done
          done
          cd "$GITHUB_WORKSPACE"
          echo "PIPER_MODELL=$HOME/piper/de_DE-thorsten-high.onnx" >> "$GITHUB_ENV"
          echo "PIPER_MODELL_EN=$HOME/piper/en_US-ryan-high.onnx" >> "$GITHUB_ENV"
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Video bauen
        if: steps.neu.outputs.weiter == 'ja'
        run: |
          node automations/serie/screenshots.js out/serie-folge.json out/serie
          python3 automations/serie/render.py out/serie-folge.json out/serie
          mkdir -p out/serie-en && cp out/serie/seite-*.png out/serie-en/ 2>/dev/null || true
          python3 automations/serie/render.py out/serie-folge-en.json out/serie-en
      - name: Als Release ablegen
        if: steps.neu.outputs.weiter == 'ja'
        id: rel
        run: |
          R="${{ steps.neu.outputs.release }}"
          cp out/serie/video.mp4 "out/serie/$R.mp4"
          cp out/serie-en/video.mp4 "out/serie/$R-en.mp4"
          gh release create "$R" "out/serie/$R.mp4" "out/serie/$R-en.mp4" out/serie/cover.jpg -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Serie 100 Tage KI-Firma: Tag ${{ steps.folge.outputs.tag }}" --notes "Automatisch gebaute Folge (automations/119-serie-tag.mjs)."
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$R/$R.mp4" >> "$GITHUB_OUTPUT"
          echo "url_en=https://github.com/$GITHUB_REPOSITORY/releases/download/$R/$R-en.mp4" >> "$GITHUB_OUTPUT"
      - name: In Buffer einplanen
        if: steps.neu.outputs.weiter == 'ja' && (github.event_name == 'schedule' || inputs.posten)
        run: node automations/119-serie-tag.mjs --posten "${{ steps.rel.outputs.url }}" "${{ steps.rel.outputs.url_en }}"

name: "🎬 KI-Video Space-Pool (wöchentlich)"

# Sucht jede Woche alle laufenden Gratis-Video-KIs auf Hugging Face, prüft ihre Schnittstelle und speichert bis zu
# 100 nutzbare in ki-video/spaces.json. Das Ziya Studio nimmt sie als Rückfall, wenn die Stamm-Modelle hängen.

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ki-space-pool
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q gradio_client
      - name: Video-Spaces suchen und prüfen
        run: python3 scripts/space_pool.py ki-video/spaces.json
      - name: Liste speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki-video/spaces.json
          git diff --cached --quiet || git commit -m "chore: KI-Video Space-Pool aktualisiert [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q

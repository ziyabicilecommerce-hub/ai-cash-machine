name: "Zentrale · Autopilot"

# Täglich ~7 Uhr deutscher Zeit: Shopify-Daten holen, Agenten rechnen lassen, Tagesbericht per
# Telegram, Live-Daten verschlüsselt für die Zentrale ablegen und die Seite neu ausliefern.
# Ohne SHOP/SHOPIFY_TOKEN beendet sich der Lauf sofort und erfolgreich.

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: zentrale-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Autopilot ausführen
        run: node automations/zentrale-autopilot.mjs
        env:
          SHOP: ${{ secrets.SHOP }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOP_NAME: ${{ secrets.SHOP_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZENTRALE_SCHLUESSEL: ${{ secrets.ZENTRALE_SCHLUESSEL }}

      - name: Live-Daten veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f zentrale/daten/live.enc.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zentrale/daten/live.enc.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: Zentrale Live-Daten (verschlüsselt) [skip ci]"
          git push
          # Pushes mit GITHUB_TOKEN starten keine anderen Workflows, daher Pages-Deploy direkt anstoßen.
          gh workflow run jarvis-pages.yml --ref "${GITHUB_REF_NAME}"

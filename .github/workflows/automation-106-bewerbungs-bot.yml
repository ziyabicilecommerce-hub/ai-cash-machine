name: "106 · Bewerbungs-Bot"

on:
  schedule:
    # Jeden Tag 06:00 UTC = 08:00 deutsche Sommerzeit / 07:00 Winterzeit
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    uses: ./.github/workflows/_automation-runner.yml
    with:
      script: automations/106-bewerbungs-bot.mjs
    secrets: inherit

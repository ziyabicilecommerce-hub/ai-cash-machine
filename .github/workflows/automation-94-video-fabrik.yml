name: "94 · Video-Fabrik"

# Erzeugt taeglich Videos ohne API-Key (Pollinations-Bilder, edge-tts-Stimme,
# ffmpeg), legt sie als GitHub-Release ab, ergaenzt den Video-Feed und plant
# sie in Metricool ein, sobald die Metricool-Secrets gesetzt sind.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: video-fabrik
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOP: ${{ secrets.SHOP }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      SHOP_URL: ${{ secrets.SHOP_URL }}
      SHOP_NAME: ${{ secrets.SHOP_NAME }}
      SHOP_NISCHE: ${{ secrets.SHOP_NISCHE }}
      SOCIAL_AUTOPILOT_THEMEN: ${{ secrets.SOCIAL_AUTOPILOT_THEMEN }}
      SOCIAL_AUTOPILOT_AUTO_PUBLISH: ${{ secrets.SOCIAL_AUTOPILOT_AUTO_PUBLISH }}
      VIDEO_FABRIK_THEMEN: ${{ vars.VIDEO_FABRIK_THEMEN }}
      VIDEO_FABRIK_ANZAHL: ${{ vars.VIDEO_FABRIK_ANZAHL }}
      VIDEO_FABRIK_LANG_MINUTEN: ${{ vars.VIDEO_FABRIK_LANG_MINUTEN }}
      VIDEO_FABRIK_STIL: ${{ vars.VIDEO_FABRIK_STIL }}
      VIDEO_FABRIK_STIMME: ${{ vars.VIDEO_FABRIK_STIMME }}
      VIDEO_FABRIK_LIFESTYLE: ${{ vars.VIDEO_FABRIK_LIFESTYLE }}
      VIDEO_FABRIK_SHOPS: ${{ vars.VIDEO_FABRIK_SHOPS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg, Schrift und edge-tts installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q "edge-tts==7.*"
      - name: Videos bauen
        run: node automations/94-video-fabrik.mjs
      - name: Als Release veroeffentlichen und Feed ergaenzen
        run: |
          TAG="videos-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/videos/*.mp4 --title "Videos $(date -u +%d.%m.%Y)" --notes "Automatisch erzeugt von Automation #94 (Video-Fabrik)." --latest=false
          echo "BASIS=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_ENV"
          node automations/94-video-fabrik.mjs --feed "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-feed/videos.json
          git commit -m "chore: Video-Feed aktualisiert [skip ci]"
          git pull --rebase --autostash
          git push
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: In Metricool einplanen
        continue-on-error: true
        run: node automations/94-video-fabrik.mjs --metricool "$BASIS"
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_TIMEZONE: ${{ secrets.METRICOOL_TIMEZONE }}
          METRICOOL_PROVIDERS: ${{ secrets.METRICOOL_PROVIDERS }}

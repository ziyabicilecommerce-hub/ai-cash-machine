name: "94 · Video-Fabrik"

# Erzeugt taeglich Videos ohne API-Key (Pollinations-Bilder, edge-tts-Stimme,
# ffmpeg), legt sie als GitHub-Release ab und ergaenzt den Video-Feed. Gepostet wird
# vom eigenen Direkt-Poster (99) - ohne Metricool oder andere Bezahl-Apps.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Anzahl Produkt-Kurzvideos (0-10)'
        required: false
        default: ''
      minuten:
        description: 'Langes Video (Minuten, 0 = keins, max 60)'
        required: false
        default: ''
      thema:
        description: 'Thema fuer das lange Video'
        required: false
        default: ''
      stil:
        description: 'Bildstil (englisch), z. B. psychedelic dreamy art'
        required: false
        default: ''
      sprachen:
        description: 'Zusaetzliche Sprachen fuer Produktvideos, z. B. en,es,tr'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: video-fabrik-${{ inputs.minuten || 'kurz' }}
  cancel-in-progress: false

# Kostenlose KI-Schlüssel (optional, machen die KI stabil - siehe Zentrale > 15 Kanäle > KI).
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SHOP: ${{ secrets.SHOP }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      SHOP_URL: ${{ secrets.SHOP_URL }}
      SHOP_NAME: ${{ secrets.SHOP_NAME }}
      SHOP_NISCHE: ${{ secrets.SHOP_NISCHE }}
      SOCIAL_AUTOPILOT_THEMEN: ${{ secrets.SOCIAL_AUTOPILOT_THEMEN }}
      SOCIAL_AUTOPILOT_AUTO_PUBLISH: ${{ secrets.SOCIAL_AUTOPILOT_AUTO_PUBLISH }}
      VIDEO_FABRIK_THEMEN: ${{ inputs.thema || vars.VIDEO_FABRIK_THEMEN }}
      VIDEO_FABRIK_ANZAHL: ${{ inputs.anzahl || vars.VIDEO_FABRIK_ANZAHL }}
      VIDEO_FABRIK_LANG_MINUTEN: ${{ inputs.minuten || vars.VIDEO_FABRIK_LANG_MINUTEN }}
      VIDEO_FABRIK_STIL: ${{ inputs.stil || vars.VIDEO_FABRIK_STIL }}
      VIDEO_FABRIK_STIMME: ${{ vars.VIDEO_FABRIK_STIMME }}
      VIDEO_FABRIK_LIFESTYLE: ${{ vars.VIDEO_FABRIK_LIFESTYLE }}
      VIDEO_FABRIK_SHOPS: ${{ vars.VIDEO_FABRIK_SHOPS }}
      VIDEO_FABRIK_SPRACHEN: ${{ inputs.sprachen || vars.VIDEO_FABRIK_SPRACHEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Eigene KI starten (kostenlos, ohne Schlüssel, ohne Limit)
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL_FABRIK || 'qwen2.5:7b' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: ffmpeg, Schrift und edge-tts installieren
        uses: ./.github/actions/video-werkzeug
        with:
          pip: 'edge-tts==7.* segno opencv-python-headless'
          rembg: 'true'
      # KI-Moderatorin (Wav2Lip auf CPU): Modelle + Portraets werden zwischengespeichert.
      - uses: actions/cache@v4
        with:
          path: ~/wav2lip
          key: wav2lip-moderatorin-v1
      - uses: actions/cache@v4
        with:
          path: ~/w2l-venv
          key: w2l-venv-py310-torch222-v1
      - name: KI-Moderatorin einrichten
        continue-on-error: true
        run: |
          # venv kommt aus dem Cache - nur beim allerersten Mal wird PyTorch & Co. installiert.
          if [ ! -x ~/w2l-venv/bin/python ] || ! ~/w2l-venv/bin/python -c "import torch, librosa, cv2" 2>/dev/null; then
            rm -rf ~/w2l-venv && python -m venv ~/w2l-venv
            ~/w2l-venv/bin/pip install -q --upgrade pip wheel "setuptools<70"
            ~/w2l-venv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu
            ~/w2l-venv/bin/pip install -q "numpy==1.23.5" "librosa==0.10.1" "opencv-python-headless<4.10" scipy tqdm numba
          fi
          echo "W2L_PY=$HOME/w2l-venv/bin/python" >> "$GITHUB_ENV"
          scripts/moderatorin.sh einrichten
          ls ~/wav2lip/moderatorin-*.jpg >/dev/null && echo "MODERATORIN=${{ vars.MODERATORIN || '0' }}" >> "$GITHUB_ENV"
      - name: Videos bauen
        run: node automations/94-video-fabrik.mjs
      - name: Videos pruefen (reparieren oder aussortieren)
        run: node automations/video-pruefer.mjs
      - name: Als Release veroeffentlichen und Feed ergaenzen
        run: |
          if ! ls out/videos/*.mp4 >/dev/null 2>&1; then
            echo "Keine freigegebenen Videos in diesem Lauf - nur den Pruefbericht speichern."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            cp automations/state/video-pruefung.json /tmp/pruefung.json 2>/dev/null || exit 0
            for versuch in 1 2 3; do
              git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
              mkdir -p automations/state && cp /tmp/pruefung.json automations/state/video-pruefung.json
              git add automations/state/video-pruefung.json
              git commit -qm "chore: Video-Pruefung [skip ci]" || exit 0
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
              sleep $((versuch * 5))
            done
            exit 0
          fi
          TAG="videos-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/videos/* --title "Videos $(date -u +%d.%m.%Y)" --notes "Automatisch erzeugt von Automation #94 (Video-Fabrik)." --latest=false
          echo "BASIS=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_ENV"
          scripts/video-feed-veroeffentlichen.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" automations/state/video-pruefung.json
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}

name: "94 · Video-Fabrik"

# Erzeugt taeglich Videos ohne API-Key (Pollinations-Bilder, edge-tts-Stimme,
# ffmpeg), legt sie als GitHub-Release ab, ergaenzt den Video-Feed und plant
# sie in Metricool ein, sobald die Metricool-Secrets gesetzt sind.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Anzahl Produkt-Kurzvideos (0-10)'
        required: false
        default: ''
      minuten:
        description: 'Langes Video (Minuten, 0 = keins, max 60)'
        required: false
        default: ''
      thema:
        description: 'Thema fuer das lange Video'
        required: false
        default: ''
      stil:
        description: 'Bildstil (englisch), z. B. psychedelic dreamy art'
        required: false
        default: ''
      sprachen:
        description: 'Zusaetzliche Sprachen fuer Produktvideos, z. B. en,es,tr'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: video-fabrik-${{ inputs.minuten || 'kurz' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SHOP: ${{ secrets.SHOP }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      SHOP_URL: ${{ secrets.SHOP_URL }}
      SHOP_NAME: ${{ secrets.SHOP_NAME }}
      SHOP_NISCHE: ${{ secrets.SHOP_NISCHE }}
      SOCIAL_AUTOPILOT_THEMEN: ${{ secrets.SOCIAL_AUTOPILOT_THEMEN }}
      SOCIAL_AUTOPILOT_AUTO_PUBLISH: ${{ secrets.SOCIAL_AUTOPILOT_AUTO_PUBLISH }}
      VIDEO_FABRIK_THEMEN: ${{ inputs.thema || vars.VIDEO_FABRIK_THEMEN }}
      VIDEO_FABRIK_ANZAHL: ${{ inputs.anzahl || vars.VIDEO_FABRIK_ANZAHL }}
      VIDEO_FABRIK_LANG_MINUTEN: ${{ inputs.minuten || vars.VIDEO_FABRIK_LANG_MINUTEN }}
      VIDEO_FABRIK_STIL: ${{ inputs.stil || vars.VIDEO_FABRIK_STIL }}
      VIDEO_FABRIK_STIMME: ${{ vars.VIDEO_FABRIK_STIMME }}
      VIDEO_FABRIK_LIFESTYLE: ${{ vars.VIDEO_FABRIK_LIFESTYLE }}
      VIDEO_FABRIK_SHOPS: ${{ vars.VIDEO_FABRIK_SHOPS }}
      VIDEO_FABRIK_SPRACHEN: ${{ inputs.sprachen || vars.VIDEO_FABRIK_SPRACHEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg, Schrift und edge-tts installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q "edge-tts==7.*"
      - name: Videos bauen
        run: node automations/94-video-fabrik.mjs
      - name: Als Release veroeffentlichen und Feed ergaenzen
        run: |
          TAG="videos-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/videos/* --title "Videos $(date -u +%d.%m.%Y)" --notes "Automatisch erzeugt von Automation #94 (Video-Fabrik)." --latest=false
          echo "BASIS=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_ENV"
          scripts/video-feed-veroeffentlichen.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: In Metricool einplanen
        continue-on-error: true
        run: node automations/94-video-fabrik.mjs --metricool "$BASIS"
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_TIMEZONE: ${{ secrets.METRICOOL_TIMEZONE }}
          METRICOOL_PROVIDERS: ${{ secrets.METRICOOL_PROVIDERS }}
      - name: Direkt posten (kostenlos, ohne Metricool)
        continue-on-error: true
        run: node automations/99-direkt-poster.mjs "${BASIS_URL}"
        env:
          BASIS_URL: ${{ env.BASIS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_SICHTBARKEIT: ${{ vars.YOUTUBE_SICHTBARKEIT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL_ID: ${{ vars.TELEGRAM_KANAL_ID }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DIREKT_POSTER_PLATTFORMEN: ${{ vars.DIREKT_POSTER_PLATTFORMEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODUS: ${{ vars.TIKTOK_MODUS }}
          TIKTOK_SICHTBARKEIT: ${{ vars.TIKTOK_SICHTBARKEIT }}

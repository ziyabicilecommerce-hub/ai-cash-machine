name: Automation Runner (shared)

on:
  workflow_call:
    inputs:
      script:
        description: 'Pfad zum Automation-Script, z.B. automations/01-gewinn-radar.mjs'
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Nur nutzbar, wenn der Aufrufer (automation-NN-*.yml) das auch selbst
      # gewährt (z.B. für #02 KI-Kundenservice, das echte GitHub-Issue-
      # Tickets erstellt) - reusable workflows können nie mehr Rechte
      # bekommen, als der Aufrufer selbst hat.
      issues: write
    concurrency:
      # Serialisiert überlappende Läufe DERSELBEN Automation (z.B. wenn ein Lauf
      # länger dauert als der Cron-Abstand) - cancel-in-progress:false, damit ein
      # bereits laufender Auftrag (z.B. eine gerade platzierte Trading-Order)
      # niemals mitten in der Ausführung abgebrochen wird, sondern der nächste
      # Lauf einfach wartet.
      group: automation-${{ inputs.script }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dependencies installieren
        run: npm ci --no-audit --no-fund

      - name: Automation ausführen
        run: node ${{ inputs.script }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOP: ${{ secrets.SHOP }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MAX_TOKENS_PRO_TAG: ${{ secrets.CLAUDE_MAX_TOKENS_PRO_TAG }}
          SHOP_NAME: ${{ secrets.SHOP_NAME }}
          SHOP_URL: ${{ secrets.SHOP_URL }}
          SHOP_NISCHE: ${{ secrets.SHOP_NISCHE }}
          ABSENDER_EMAIL: ${{ secrets.ABSENDER_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ secrets.TEST_MODE }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

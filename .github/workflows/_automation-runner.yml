          EMAILS_PAUSIERT: ${{ secrets.EMAILS_PAUSIERT }}

      - name: State-Änderungen committen
        # if: always() ist wichtig - läuft ein Skript mitten in einer Kunden-
        # Batch (E-Mails/Bestellungen/Warenkorb-Reminder) auf einen Fehler
        # (z.B. transienter Claude-/Resend-Ausfall, oder das geteilte
        # CLAUDE_MAX_TOKENS_PRO_TAG-Budget wird mitten im Lauf erreicht),
        # würde dieser Schritt sonst standardmäßig übersprungen (nur bei
        # success()) - dann geht der bereits lokal auf Platte geschriebene
        # Fortschritt (bereits kontaktierte Kunden) verloren und der nächste
        # Lauf kontaktiert dieselben Kunden nochmal, weil der alte State
        # nie committet wurde.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Jeder Pfad EINZELN, nicht in einem gemeinsamen "git add a b c" -
          # git bricht bei einem einzigen nicht-existierenden Pfad die GESAMTE
          # Kommando-Zeile ab (exit 128), auch wenn die anderen Pfade gültig
          # sind - dadurch wurde bisher STILL gar nichts committet, sobald
          # auch nur EINER der 8 Pfade noch fehlte (z.B. weil eine andere
          # Automation mangels Secrets noch nie gelaufen ist).
          for pfad in automations/state/ finance-cockpit/data.json lead-previews/ paypal-belege/ wrapped/ social-poster/ command/ cockpit/ brand-scout/data.json; do
            git add "$pfad" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update automation state [skip ci]"
            git push
          fi

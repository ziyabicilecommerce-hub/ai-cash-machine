name: diag-ultimativ
on:
  push:
    branches: [feat/mcp-ultimativ]
    paths: [.github/workflows/diag-ultimativ.yml, mcp-ultimativ/**]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >
          node scripts/mcp-ultimativ-test.mjs '[["land_info",{"land":"Japan"}],["land_info",{"land":"Germany"}],["text_generieren",{"anweisung":"Sag Hallo in einem Satz."}]]'

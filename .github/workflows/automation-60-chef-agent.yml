name: "60 · Chef-Agent"

# Läuft bewusst NICHT über den geteilten _automation-runner.yml, obwohl das
# sonst überall in diesem Repo der Standard ist: seit dem Orchestrator-Ausbau
# braucht dieses Skript zusätzlich "actions: write" (um andere Automationen
# per GitHub API sofort auszulösen), und reusable-workflow-Permissions werden
# auf den job-weiten Block in _automation-runner.yml angewendet - das hätte
# bedeutet, ALLE anderen automation-NN-*.yml-Caller müssten ebenfalls
# "actions: write" deklarieren, sonst würden sie mit startup_failure
# scheitern (exakt das gleiche Muster wie beim "issues: write"-Fallstrick,
# siehe auch #80 Agenten-Status-Sammler). Ein eigenständiger Workflow mit
# eigenen, engeren Permissions ist hier das sicherere Vorgehen - betrifft nur
# diesen einen Workflow.

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dependencies installieren
        run: npm ci --no-audit --no-fund

      # Lokales Modell statt externer API - kein Key/Account nötig (siehe
      # automations/lib/ki.mjs).
      - name: Ollama-Modell-Cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ secrets.OLLAMA_MODEL || 'llama3.2:1b' }}

      - name: Ollama installieren und starten
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull "${OLLAMA_MODEL:-llama3.2:1b}"
        env:
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}

      - name: Chef-Agent ausführen
        run: node automations/60-chef-agent.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOP: ${{ secrets.SHOP }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_MAX_TOKENS_PRO_TAG: ${{ secrets.OLLAMA_MAX_TOKENS_PRO_TAG }}
          SHOP_NAME: ${{ secrets.SHOP_NAME }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
          FULFILLMENT_VERZUG_STUNDEN: ${{ secrets.FULFILLMENT_VERZUG_STUNDEN }}
          CRM_AT_RISK_TAGE: ${{ secrets.CRM_AT_RISK_TAGE }}
          VIP_UMSATZ_SCHWELLE: ${{ secrets.VIP_UMSATZ_SCHWELLE }}

      - name: State-Änderungen committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Einzeln statt "git add a b" - ein fehlender Pfad würde sonst die
          # GESAMTE Zeile mit exit 128 abbrechen (siehe _automation-runner.yml).
          for pfad in automations/state/ command/; do
            git add "$pfad" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update automation state [skip ci]"
            git push
          fi

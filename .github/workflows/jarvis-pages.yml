name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'jarvis/**'
      - 'brand-assassin/**'
      - 'automations-dashboard/**'
      - 'finance-cockpit/**'
      - 'oracle/**'
      - 'lead-previews/**'
      - '.github/workflows/jarvis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r jarvis _site/jarvis
          cp -r brand-assassin _site/brand-assassin
          cp -r automations-dashboard _site/automations-dashboard
          cp -r finance-cockpit _site/finance-cockpit
          cp -r oracle _site/oracle
          mkdir -p lead-previews
          cp -r lead-previews _site/lead-previews

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'jarvis/**'
      - 'brand-assassin/**'
      - 'automations-dashboard/**'
      - 'finance-cockpit/**'
      - 'oracle/**'
      - 'lead-previews/**'
      - 'closer/**'
      - 'pulse/**'
      - 'trading-dashboard/**'
      - 'forecast/**'
      - 'setup/**'
      - 'paypal-belege/**'
      - 'wrapped/**'
      - 'agents/**'
      - 'pricing/**'
      - 'strategy-lab/**'
      - 'mission-control/**'
      - 'social-poster/**'
      - 'empire/**'
      - 'command/**'
      - 'cockpit/**'
      - 'brand-scout/**'
      - 'trading-bot-worker/lib/**'
      - '.github/workflows/jarvis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r jarvis _site/jarvis
          cp -r brand-assassin _site/brand-assassin
          cp -r automations-dashboard _site/automations-dashboard
          cp -r finance-cockpit _site/finance-cockpit
          cp -r oracle _site/oracle
          mkdir -p lead-previews
          cp -r lead-previews _site/lead-previews
          cp -r closer _site/closer
          cp -r pulse _site/pulse
          cp -r trading-dashboard _site/trading-dashboard
          cp -r forecast _site/forecast
          cp -r setup _site/setup
          cp -r paypal-belege _site/paypal-belege
          cp -r wrapped _site/wrapped
          cp -r agents _site/agents
          cp -r pricing _site/pricing
          cp -r strategy-lab _site/strategy-lab
          cp -r mission-control _site/mission-control
          cp -r social-poster _site/social-poster
          cp -r empire _site/empire
          cp -r command _site/command
          cp -r cockpit _site/cockpit
          cp -r brand-scout _site/brand-scout
          mkdir -p _site/trading-bot-worker
          cp -r trading-bot-worker/lib _site/trading-bot-worker/lib

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: "🧪 KI-Clip nur mit Prozessor (Versuch, postet nichts)"

# Versuch (11.11.): lässt sich ein KI-Videoclip ganz ohne Grafikkarte auf dem kostenlosen GitHub-Rechner erzeugen?
# Kleines Modell (AnimateDiff-Lightning, 4 Schritte). Misst die Zeit, legt den Clip als Vorab-Release "cpu-clip-..." ab.
# Läuft per Hand - und einmal beim Hochladen dieser Dateien auf den Arbeits-Branch.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Was im Clip zu sehen sein soll (englisch)'
        required: false
        default: 'dark apartment hallway at night, a shadow figure slowly walking towards the camera, flickering light, horror, cinematic, found footage'
  push:
    branches: [claude/softsware-230g7x]
    paths: ['scripts/ki_clip_cpu.py', '.github/workflows/ki-clip-cpu-test.yml']

permissions:
  contents: write

jobs:
  versuch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PROMPT: ${{ inputs.prompt || 'dark apartment hallway at night, a shadow figure slowly walking towards the camera, flickering light, horror, cinematic, found footage' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge (nur Prozessor-Version von PyTorch)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub imageio imageio-ffmpeg opencv-python-headless
      - name: Clip rechnen (ohne Grafikkarte)
        run: |
          mkdir -p out
          nproc; free -g | head -2
          START=$(date +%s)
          python3 scripts/ki_clip_cpu.py "$PROMPT" out/cpu-clip.mp4 | tee out/zeit.txt
          echo "### 🧪 KI-Clip nur mit Prozessor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gesamt: $(( $(date +%s) - START )) s · $(tail -1 out/zeit.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -loglevel error -y -i out/cpu-clip.mp4 -vf "select='eq(n,0)+eq(n,8)+eq(n,15)',scale=384:-1,tile=3x1" -frames:v 1 out/cpu-clip-bilder.jpg
      - name: Als Vorab-Release ablegen
        run: |
          TAG="cpu-clip-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/cpu-clip.mp4 out/cpu-clip-bilder.jpg out/zeit.txt -R "$GITHUB_REPOSITORY" --prerelease --title "KI-Clip nur mit Prozessor (Versuch)" --notes "Versuch ohne Grafikkarte, nicht gepostet. $(tail -1 out/zeit.txt)"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

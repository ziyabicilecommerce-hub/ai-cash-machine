name: "50 · Pump-Scanner"

# Kein schedule-Trigger mehr: Binance blockiert die IP-Bereiche der
# GitHub-Actions-Runner (HTTP 451) - dieser Scanner kann von hier aus nie
# erfolgreich Daten abrufen. Noch kein Cloudflare-Worker-Ersatz gebaut (im
# Gegensatz zum Trading-Bot, siehe trading-bot-worker/) - bei Bedarf gleiches
# Muster nachbauen. Bleibt hier als Referenz/manuell testbar.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/_automation-runner.yml
    with:
      script: automations/50-pump-scanner.mjs
    secrets: inherit

name: "📼 YouTube-Langvideo (wöchentlich: The Erased Files)"

# 22.11.: einmal pro Woche die englischen YouTube-Shorts der letzten Tage zu einem 6-8-Minuten-Video zusammenschneiden
# (automations/119-yt-langvideo.mjs) und auf YouTube (giyuuu) posten. Lange Videos sammeln Wiedergabezeit fürs
# Partnerprogramm. Manuell mit posten=aus: nur bauen und als Release ablegen (zum Anschauen).

on:
  schedule:
    - cron: '23 17 * * 0'  # sonntags ~18:23 Uhr Berlin
  workflow_dispatch:
    inputs:
      posten:
        description: 'Als nächste Folge ablegen (aus = nur Vorschau)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yt-langvideo
  cancel-in-progress: false

jobs:
  lang:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Werkzeug
        run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
      - name: Langvideo bauen
        run: node automations/119-yt-langvideo.mjs out
      - name: Ablegen
        # 23.11.: Buffer nimmt bei YouTube nur Shorts (max. 3 Min., hochkant) - das Langvideo plant der tägliche Check
        # (Claude) montags über Metricool ein (YouTube-Typ "video"). Hier nur bauen und mit Beschreibung ablegen.
        run: |
          [ -f out/lang.mp4 ] || { echo "Kein Langvideo gebaut."; exit 0; }
          N=$(node -e "console.log(require('./out/lang.json').folge)")
          TAG="yt-lang-$N"; [ "${{ github.event_name == 'schedule' || inputs.posten }}" = "true" ] || TAG="vorschau-yt-lang-$(date -u +%m%d%H%M)"
          gh release create "$TAG" out/lang.mp4 out/lang.json --prerelease --title "The Erased Files #$N" --notes "KI-generiertes Langvideo aus den Shorts der Woche - wird über Metricool auf YouTube gepostet."
          echo "🎬 https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/lang.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

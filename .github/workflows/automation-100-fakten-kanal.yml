name: "100 · Fakten-Kanal"

# Community-Aufbau: baut jeden Tag virale "Wusstest du...?"-Videos (ohne Shop-Bezug) mit
# fester KI-Moderatorin, legt sie als GitHub-Release ab und ergaenzt den Video-Feed
# (kanal: fakten - der Direkt-Poster schickt sie nie an die Shop-Konten).

on:
  schedule:
    # Früh starten: GitHub verschiebt geplante Läufe oft um Stunden; gepostet wird zu festen Prime-Time-Zeiten (BUFFER_ZEITEN).
    - cron: '17 4 * * *'
    # Zweiter Lauf: 2 weitere Videos, je eins pro Fakten-TikTok-Konto (Posts abends zur Prime-Time)
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Anzahl Fakten-Videos (1-12)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: fakten-kanal
  cancel-in-progress: false

# Kostenlose KI-Schlüssel (optional, machen die KI stabil - siehe Zentrale > 15 Kanäle > KI).
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
  BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
  # Echte Video-Clips statt Standbilder (kostenloser Schlüssel: pexels.com/api)
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      FAKTEN_ANZAHL: ${{ inputs.anzahl || (github.event.schedule == '17 12 * * *' && '2') || vars.FAKTEN_ANZAHL }}
      FAKTEN_KANAL: ${{ vars.FAKTEN_KANAL }}
      FAKTEN_MODERATORIN: ${{ vars.FAKTEN_MODERATORIN }}
      FAKTEN_KATEGORIEN: ${{ vars.FAKTEN_KATEGORIEN }}
      VIDEO_UNTERTITEL: ${{ vars.VIDEO_UNTERTITEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Eigene KI starten (kostenlos, ohne Schlüssel, ohne Limit)
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL_FABRIK || vars.KI_LOKAL_MODELL || 'qwen2.5:7b' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: ffmpeg, Schrift und edge-tts installieren
        uses: ./.github/actions/video-werkzeug
        with:
          pip: 'edge-tts==7.* segno opencv-python-headless'
      # KI-Moderatorin (Wav2Lip auf CPU): Modelle + Portraets werden zwischengespeichert.
      - uses: actions/cache@v4
        with:
          path: ~/wav2lip
          key: wav2lip-moderatorin-v1
      - uses: actions/cache@v4
        with:
          path: ~/w2l-venv
          key: w2l-venv-py310-torch222-v1
      - name: KI-Moderatorin einrichten
        continue-on-error: true
        run: |
          # venv kommt aus dem Cache - nur beim allerersten Mal wird PyTorch & Co. installiert.
          if [ ! -x ~/w2l-venv/bin/python ] || ! ~/w2l-venv/bin/python -c "import torch, librosa, cv2" 2>/dev/null; then
            rm -rf ~/w2l-venv && python -m venv ~/w2l-venv
            ~/w2l-venv/bin/pip install -q --upgrade pip wheel "setuptools<70"
            ~/w2l-venv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu
            ~/w2l-venv/bin/pip install -q "numpy==1.23.5" "librosa==0.10.1" "opencv-python-headless<4.10" scipy tqdm numba
          fi
          echo "W2L_PY=$HOME/w2l-venv/bin/python" >> "$GITHUB_ENV"
          scripts/moderatorin.sh einrichten
          ls ~/wav2lip/moderatorin-*.jpg >/dev/null && echo "MODERATORIN=${{ vars.MODERATORIN || '0' }}" >> "$GITHUB_ENV"
      # 3D-Kamerafahrt: Depth Anything V2 Small (CPU) schaetzt die Tiefe - die Bilder bewegen sich wie im 3D-Raum.
      # Klappt das nicht, nimmt scripts/tiefe3d.py eine einfache Tiefenschaetzung.
      - name: 3D-Tiefe (Depth Anything V2) einrichten
        continue-on-error: true
        run: |
          ~/w2l-venv/bin/pip install -q "transformers==4.46.3" pillow
          ~/w2l-venv/bin/python -c "from transformers import pipeline; pipeline('depth-estimation', model='depth-anything/Depth-Anything-V2-Small-hf', device=-1)"
          echo "TIEFE_PY=$HOME/w2l-venv/bin/python" >> "$GITHUB_ENV"
      # Lernen (#102): welches Format zieht auf TikTok besser (Sehdauer, Kommentare)? -> fakten-kanal/lernen.json
      - name: Aus TikTok-Zahlen lernen
        if: env.BUFFER_ACCESS_TOKEN != ''
        continue-on-error: true
        run: node automations/102-tiktok-lernen.mjs
      - name: Fakten-Videos bauen
        run: node automations/100-fakten-kanal.mjs
      - name: Als Release veroeffentlichen und Feed ergaenzen
        run: |
          TAG="fakten-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/videos/* --title "Fakten-Kanal $(date -u +%d.%m.%Y)" --notes "Automatisch erzeugt von Automation #100 (Fakten-Kanal)." --latest=false
          scripts/video-feed-veroeffentlichen.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" fakten-kanal/verlauf.json
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Automatisch auf alle TikTok-Kanaele in Buffer posten (je Kanal ein anderes Video). Braucht BUFFER_ACCESS_TOKEN.
      - name: Auf TikTok posten (Buffer)
        if: env.BUFFER_ACCESS_TOKEN != ''
        continue-on-error: true
        run: node automations/101-buffer-poster.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
        env:
          GH_TOKEN: ${{ github.token }}

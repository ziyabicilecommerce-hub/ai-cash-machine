name: "97 · Marathon-Fabrik"

# Schlaf-, Entspannungs- und Fokus-Videos bis 48 Stunden - komplett kostenlos
# (Pollinations-Bilder, Klang aus ffmpeg, keine Sprache = weltweit nutzbar).
# Teile von max. 8 Std. landen als GitHub-Release im Video-Feed. Damit der Speicher
# nicht endlos waechst, bleiben nur die neuesten 6 Marathon-Releases erhalten.

on:
  schedule:
    - cron: '23 1 * * 1,4'
  workflow_dispatch:
    inputs:
      stunden:
        description: 'Laenge in Stunden (bis 48, wird in Teile zu max. 8 Std. aufgeteilt)'
        required: false
        default: ''
      welt:
        description: 'regen, meer, wald, kamin, weltraum, rauschen, fokus (leer = taeglich wechselnd)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: marathon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MARATHON_STUNDEN: ${{ inputs.stunden || vars.MARATHON_STUNDEN || '8' }}
      MARATHON_WELT: ${{ inputs.welt || vars.MARATHON_WELT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg und Schrift installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: Release anlegen
        run: |
          TAG="marathon-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" --title "Marathon $(date -u +%d.%m.%Y)" --notes "Automatisch erzeugt von Automation #97 (Marathon-Fabrik): lange Klang-Videos ohne Sprache." --latest=false
          echo "MARATHON_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Video bauen und Teile hochladen
        run: node automations/97-marathon.mjs
      - name: Leeres Release bei Fehler entfernen
        if: failure()
        run: gh release delete "$MARATHON_TAG" --yes --cleanup-tag || true
      - name: Alte Marathon-Releases aufraeumen (nur die neuesten 6 bleiben)
        run: |
          ALT=$(gh release list --limit 200 --json tagName --jq '[.[].tagName | select(startswith("marathon-"))] | sort | reverse | .[6:] | join(",")')
          for t in ${ALT//,/ }; do gh release delete "$t" --yes --cleanup-tag || true; done
          echo "FEED_ENTFERNEN_TAGS=$ALT" >> "$GITHUB_ENV"
      - name: Feed ergaenzen
        run: |
          scripts/video-feed-veroeffentlichen.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${MARATHON_TAG}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run jarvis-pages.yml --ref main; fi
      - name: Direkt posten (kostenlos, ohne Metricool)
        continue-on-error: true
        run: node automations/99-direkt-poster.mjs "${BASIS_URL}"
        env:
          BASIS_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.MARATHON_TAG }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_SICHTBARKEIT: ${{ vars.YOUTUBE_SICHTBARKEIT }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL_ID: ${{ vars.TELEGRAM_KANAL_ID }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DIREKT_POSTER_PLATTFORMEN: ${{ vars.DIREKT_POSTER_PLATTFORMEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODUS: ${{ vars.TIKTOK_MODUS }}
          TIKTOK_SICHTBARKEIT: ${{ vars.TIKTOK_SICHTBARKEIT }}

name: "KI-Moderatorin · Test"

# Prueft, ob die kostenlose KI-Moderatorin (Wav2Lip auf CPU) auf den GitHub-Servern laeuft,
# und wie lange sie fuer einen Werbesatz braucht. Ergebnis als Artefakt zum Anschauen.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          pip install -q "numpy==1.23.5" "librosa==0.10.1" "opencv-python-headless<4.10" scipy tqdm numba "edge-tts==7.*"
      - name: Wav2Lip und Modelle einrichten
        run: scripts/moderatorin.sh einrichten
      - name: Testsatz sprechen lassen
        run: |
          edge-tts --voice de-DE-SeraphinaMultilingualNeural --rate=+6% --text "Hey du! Kennst du das? Dein Schreibtisch ist immer zu dunkel. Mit dieser Lampe hast du endlich warmes, klares Licht. Link in der Bio!" --write-media test.mp3
          start=$(date +%s)
          scripts/moderatorin.sh sprechen test.mp3 moderatorin.mp4
          echo "Dauer: $(( $(date +%s) - start )) s fuer $(ffprobe -v error -show_entries format=duration -of csv=p=0 test.mp3) s Audio" | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -loglevel error -y -i moderatorin.mp4 -i test.mp3 -map 0:v -map 1:a -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a aac -shortest moderatorin-mit-ton.mp4
          cp ~/wav2lip/moderatorin.jpg .
      - uses: actions/upload-artifact@v4
        with:
          name: moderatorin-test
          path: |
            moderatorin-mit-ton.mp4
            moderatorin.jpg
          retention-days: 7
      - name: Als Release zum Anschauen ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete moderatorin-test --yes --cleanup-tag 2>/dev/null || true
          gh release create moderatorin-test moderatorin-mit-ton.mp4 moderatorin.jpg --title "KI-Moderatorin Test" --notes "Automatischer Test der kostenlosen KI-Moderatorin (Wav2Lip)." --latest=false

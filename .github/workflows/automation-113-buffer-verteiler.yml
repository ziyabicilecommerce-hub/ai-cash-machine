name: "113 · Buffer-Verteiler (Instagram + YouTube, 5+ Posts am Tag)"

# Bespielt @desk.rebel, @purivelle.785 (Instagram) und giyuuu sama (YouTube) über Buffer mit eigenen Inhalten:
# DeskRebel- bzw. Purivelle-Videos der Video-Fabrik und Shorts der eigenen Anime-Serie. Pro Lauf höchstens 1 Post
# je Kanal, mindestens 90 Min. Abstand, bis zu 6 am Tag. Angestoßen von der Radar-Kette (pünktlich) und als Ersatz
# per Zeitplan. Jeder Post ist als KI-generiert gekennzeichnet.

on:
  schedule:
    - cron: '23 7,10,13,16,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-verteiler
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verteilen
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANISATION: ${{ vars.BUFFER_ORGANISATION }}
        run: node automations/113-buffer-verteiler.mjs
      - name: Stand speichern
        if: always()
        run: |
          [ -f buffer-verteiler/stand.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sicher=$(mktemp); cp buffer-verteiler/stand.json "$sicher"
          for versuch in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p buffer-verteiler; cp "$sicher" buffer-verteiler/stand.json
            git add buffer-verteiler/stand.json
            git commit -qm "chore: Buffer-Verteiler Stand [skip ci]" || exit 0
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((versuch * 5))
          done
          exit 1

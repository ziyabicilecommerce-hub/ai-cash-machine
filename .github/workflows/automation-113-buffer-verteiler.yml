name: "113 · Buffer-Verteiler (Horror IG+YT, Fakten - 5+ Posts am Tag)"

# Bespielt über Buffer ohne Shop-Werbung: @desk.rebel (Instagram) mit jedes Mal neuen KI-Horror-Geschichten,
# @purivelle.785 (Instagram) mit Fakten-Videos, giyuuu sama (YouTube) mit eigenen Horror-Shorts. Pro Lauf höchstens 1 Post
# je Kanal, mindestens 90 Min. Abstand, bis zu 6 am Tag. Angestoßen von der Radar-Kette (pünktlich) und als Ersatz
# per Zeitplan. Jeder Post ist als KI-generiert gekennzeichnet.

on:
  schedule:
    - cron: '23 7,10,13,16,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: buffer-verteiler
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eigene KI starten (kostenlos, für neue Horror-Geschichten)
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL || 'qwen2.5:7b' }}
      - name: Vorbereiten (zählen, Horror-Geschichte schreiben)
        id: verteilen
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANISATION: ${{ vars.BUFFER_ORGANISATION }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          HORROR_KI_LOKAL: ${{ vars.HORROR_KI_LOKAL }}
        run: node automations/113-buffer-verteiler.mjs --vorbereiten
      - name: Horror-Videos rendern und ablegen (je Kanal eine eigene Geschichte)
        id: horror
        if: steps.verteilen.outputs.horror == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          KANAELE: ${{ steps.verteilen.outputs.horror_kanaele }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q pillow edge-tts
          echo '{}' > out/horror-urls.json
          for K in $KANAELE; do
            SLUG=$(jq -r '._slug' "out/folge-$K.json")
            rm -rf "out/r-$K"; python3 automations/schatten/story.py "out/folge-$K.json" "out/r-$K" || continue
            TAG="horror-$K-$(date -u +%Y%m%d-%H%M)"
            cp "out/r-$K/video.mp4" "out/r-$K/$SLUG.mp4"
            gh release create "$TAG" "out/r-$K/$SLUG.mp4" "out/r-$K/cover.jpg" -R "$GITHUB_REPOSITORY" --prerelease --title "Horror-Short: $SLUG" --notes "KI-generiertes Horror-Video (frei erfundene Geschichte)." || continue
            jq --arg k "$K" --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SLUG.mp4" '.[$k]=$u' out/horror-urls.json > out/u.json && mv out/u.json out/horror-urls.json
          done
      - name: Posten
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANISATION: ${{ vars.BUFFER_ORGANISATION }}
        run: node automations/113-buffer-verteiler.mjs --posten
      - name: TikTok auf 5 Posts auffüllen
        if: steps.verteilen.outputs.tiktok_auffuellen == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run videobot-autopilot.yml --ref main -R "$GITHUB_REPOSITORY" -f erzwingen=true
      - name: Stand speichern
        if: always()
        run: |
          [ -f buffer-verteiler/stand.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sicher=$(mktemp); cp buffer-verteiler/stand.json "$sicher"
          for versuch in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p buffer-verteiler; cp "$sicher" buffer-verteiler/stand.json
            git add buffer-verteiler/stand.json
            git commit -qm "chore: Buffer-Verteiler Stand [skip ci]" || exit 0
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((versuch * 5))
          done
          exit 1

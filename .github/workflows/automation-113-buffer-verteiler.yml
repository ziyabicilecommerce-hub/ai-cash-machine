name: "113 · Buffer-Verteiler (Horror IG+YT, Fakten - 5+ Posts am Tag)"

# Bespielt über Buffer ohne Shop-Werbung: @desk.rebel (Instagram) mit jedes Mal neuen KI-Horror-Geschichten,
# @purivelle.785 (Instagram) mit Fakten-Videos, giyuuu sama (YouTube) mit eigenen Horror-Shorts. Pro Lauf höchstens 1 Post
# je Kanal, mindestens 90 Min. Abstand, bis zu 6 am Tag. Angestoßen von der Radar-Kette (pünktlich) und als Ersatz
# per Zeitplan. Jeder Post ist als KI-generiert gekennzeichnet.

on:
  schedule:
    # dazu drei Nachtläufe (UTC 23, 0, 2 = 0, 1, 3 Uhr in Berlin): nachts laufen unsere Videos am besten (Wochenbericht)
    - cron: '23 0,2,7,10,13,16,19,21,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: buffer-verteiler
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 70  # bis zu 3 Horror-Videos, mit KI-Bildern je ~3 Min. mehr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eigene KI starten (nur wenn ausdrücklich erlaubt - sonst schreibt der Skript-Bot)
        if: vars.HORROR_KI_LOKAL != ''
        uses: ./.github/actions/ki-lokal
        with:
          modell: ${{ vars.KI_LOKAL_MODELL || 'qwen2.5:7b' }}
      - name: Neuesten Stand holen
        # Der Checkout ist der Stand beim Anstoßen - ein Lauf kurz davor kann inzwischen gepostet und gespeichert haben.
        # Ohne das hier würde dieser Lauf dessen Posts nicht kennen (doppelte Posts) und beim Speichern überschreiben.
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q "origin/$GITHUB_REF_NAME" -- buffer-verteiler/ 2>/dev/null || true
      - name: Vorbereiten (zählen, Horror-Geschichte schreiben)
        id: verteilen
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANISATION: ${{ vars.BUFFER_ORGANISATION }}
          EN_KANAL: ${{ vars.EN_KANAL }}
          EN_DIENST: ${{ vars.EN_DIENST }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          HORROR_KI_LOKAL: ${{ vars.HORROR_KI_LOKAL }}
        run: node automations/113-buffer-verteiler.mjs --vorbereiten
      - name: Horror-Videos rendern und ablegen (je Kanal eine eigene Geschichte)
        id: horror
        if: steps.verteilen.outputs.horror == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          KANAELE: ${{ steps.verteilen.outputs.horror_kanaele }}
          # Einstieg als echter KI-Clip (kostenlose Hugging-Face-GPUs); HF_TOKEN optional (kostenloses Konto = mehr Kontingent)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q pillow edge-tts gradio_client
          # 3D-Kamerafahrt (tiefe.py): Tiefen-Modell auf dem Prozessor. Klappt die Installation nicht, bleibt die flache Kamerafahrt.
          (pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers numpy opencv-python-headless) || echo "3D-Kamera: Installation fehlgeschlagen - flache Kamerafahrt"
          echo '{}' > out/horror-urls.json
          for K in $KANAELE; do
            SLUG=$(jq -r '._slug' "out/folge-$K.json")
            rm -rf "out/r-$K"; python3 automations/schatten/story.py "out/folge-$K.json" "out/r-$K" || continue
            TAG="horror-$K-$(date -u +%Y%m%d-%H%M)"
            cp "out/r-$K/video.mp4" "out/r-$K/$SLUG.mp4"
            KACHELN=""
            # 2-Satz-Horror für die Instagram-Story (nur wenn geplant) - Hintergrund = Titelbild des Reels
            if [ -f "out/kurz-$K.json" ] && python3 automations/schatten/storyKachel.py "out/kurz-$K.json" "out/r-$K/cover.jpg" "out/r-$K"; then KACHELN="out/r-$K/kachel1.jpg out/r-$K/kachel2.jpg"; [ -s "out/r-$K/kachel2.mp4" ] && KACHELN="$KACHELN out/r-$K/kachel2.mp4"; fi
            gh release create "$TAG" "out/r-$K/$SLUG.mp4" "out/r-$K/cover.jpg" $KACHELN -R "$GITHUB_REPOSITORY" --prerelease --title "Horror-Short: $SLUG" --notes "KI-generiertes Horror-Video (frei erfundene Geschichte)." || continue
            B="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            jq --arg k "$K" --arg u "$B/$SLUG.mp4" --arg c "$B/cover.jpg" '.[$k]=$u | .[$k+"_cover"]=$c' out/horror-urls.json > out/u.json && mv out/u.json out/horror-urls.json
            if [ -n "$KACHELN" ]; then jq --arg k "$K" --arg a "$B/kachel1.jpg" --arg b "$B/kachel2.jpg" '.[$k+"_kachel1"]=$a | .[$k+"_kachel2"]=$b' out/horror-urls.json > out/u.json && mv out/u.json out/horror-urls.json; fi
            if [ -s "out/r-$K/kachel2.mp4" ]; then jq --arg k "$K" --arg v "$B/kachel2.mp4" '.[$k+"_kachel2v"]=$v' out/horror-urls.json > out/u.json && mv out/u.json out/horror-urls.json; fi
          done
      - name: Posten
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANISATION: ${{ vars.BUFFER_ORGANISATION }}
          EN_KANAL: ${{ vars.EN_KANAL }}
          EN_DIENST: ${{ vars.EN_DIENST }}
        run: node automations/113-buffer-verteiler.mjs --posten
      - name: TikTok auf 5 Posts auffüllen
        if: steps.verteilen.outputs.tiktok_auffuellen == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run videobot-autopilot.yml --ref main -R "$GITHUB_REPOSITORY" -f erzwingen=true
      - name: Stand speichern
        if: always()
        run: |
          [ -f buffer-verteiler/stand.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sicher=$(mktemp); cp buffer-verteiler/stand.json "$sicher"
          [ -f buffer-verteiler/varianten.json ] && cp buffer-verteiler/varianten.json "$sicher.v"
          for versuch in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p buffer-verteiler
            # zusammenführen statt überschreiben: was andere Läufe inzwischen gespeichert haben, bleibt erhalten
            if [ -f buffer-verteiler/stand.json ]; then jq -s '.[0] * .[1]' buffer-verteiler/stand.json "$sicher" > "$sicher.neu"; else cp "$sicher" "$sicher.neu"; fi
            cp "$sicher.neu" buffer-verteiler/stand.json
            if [ -f "$sicher.v" ]; then
              if [ -f buffer-verteiler/varianten.json ]; then jq -s '.[0] * .[1]' buffer-verteiler/varianten.json "$sicher.v" > "$sicher.vneu"; else cp "$sicher.v" "$sicher.vneu"; fi
              cp "$sicher.vneu" buffer-verteiler/varianten.json && git add buffer-verteiler/varianten.json
            fi
            git add buffer-verteiler/stand.json
            git commit -qm "chore: Buffer-Verteiler Stand [skip ci]" || exit 0
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((versuch * 5))
          done
          exit 1

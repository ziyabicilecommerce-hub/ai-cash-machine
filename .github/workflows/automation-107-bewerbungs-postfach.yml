name: "107 · Bewerbungs-Postfach"

on:
  schedule:
    # alle 5 Min zwischen ca. 07 und 22 Uhr deutscher Zeit (GitHub kann bei Last ein paar Minuten später starten)
    - cron: '*/5 5-20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    uses: ./.github/workflows/_automation-runner.yml
    with:
      script: automations/107-bewerbungs-postfach.mjs
    secrets: inherit

name: "49 · Trading-Bot (Krypto Spot)"

# Kein schedule-Trigger mehr: Binance blockiert die IP-Bereiche der
# GitHub-Actions-Runner (HTTP 451) - dieser Bot kann von hier aus nie
# erfolgreich handeln. Der echte Betrieb läuft über trading-bot-worker/
# (Cloudflare Worker). Dieses Skript bleibt als Referenz/manuell testbar.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    uses: ./.github/workflows/_automation-runner.yml
    with:
      script: automations/49-trading-bot.mjs
    secrets: inherit

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHMACHINE COCKPIT</title>
<meta name="description" content="Eine Tabelle mit allem: Status jeder Automation, Kosten-Trend, und was jetzt Aufmerksamkeit braucht.">
<meta property="og:title" content="CASHMACHINE COCKPIT">
<meta property="og:description" content="Alle Automationen, Kosten-Trend und Handlungsbedarf auf einen Blick.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23030512%27/%3E%3Crect%20x%3D%2716%27%20y%3D%2716%27%20width%3D%2732%27%20height%3D%2732%27%20fill%3D%27none%27%20stroke%3D%27%233ef2a0%27%20stroke-width%3D%274%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%277%27%20fill%3D%27%233ef2a0%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#030512; --panel:rgba(20,28,40,.55); --panel-solid:#0a0f1c;
    --green:#3ef2a0; --red:#ff6b81; --amber:#ffc55c; --cyan:#6fe0ff;
    --line:rgba(62,242,160,.24); --line2:rgba(255,255,255,.07);
    --txt:#eef4f2; --mut:rgba(220,235,230,.62); --mut2:rgba(220,235,230,.4);
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,sans-serif; line-height:1.6; overflow-x:hidden; }
  ::selection { background:rgba(62,242,160,.3); }

  .bg-grid { position:fixed; inset:0; z-index:-2;
    background-image:linear-gradient(rgba(62,242,160,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(62,242,160,.05) 1px,transparent 1px);
    background-size:56px 56px; mask-image:radial-gradient(ellipse 90% 70% at 50% 15%,#000 30%,transparent 78%); }

  nav { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:14px clamp(16px,4vw,48px); background:rgba(3,5,18,.85); backdrop-filter:blur(16px); border-bottom:1px solid var(--line2); }
  .logo { font-family:var(--mono); font-weight:700; letter-spacing:.06em; font-size:14px; }
  .logo b { color:var(--green); }
  .nav-links { display:flex; align-items:center; gap:16px; font-size:13px; }
  .nav-links a { color:var(--mut); text-decoration:none; }
  .nav-links a:hover { color:var(--green); }
  @media(max-width:820px){ .nav-links a { display:none; } }

  header.hero { min-height:22svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:96px 20px 16px; max-width:820px; margin:0 auto; }
  .kicker { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.2em;
    color:var(--green); border:1px solid var(--line); padding:6px 14px; border-radius:20px; margin-bottom:16px; }
  .kicker::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50%{opacity:.35;transform:scale(.75)} }
  h1 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(24px,5vw,40px); letter-spacing:2px; color:#f4fffb;
    text-shadow:0 0 24px rgba(62,242,160,.35); margin-bottom:10px; }
  .sub { font-size:13.5px; color:var(--mut); max-width:600px; }

  main { max-width:1040px; margin:0 auto; padding:10px 20px 60px; }

  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi-box { background:var(--panel); border:1px solid var(--line2); padding:16px; text-align:center; }
  .kpi-num { font-family:'Orbitron',sans-serif; font-size:22px; color:var(--green); }
  .kpi-num.warn { color:var(--amber); }
  .kpi-num.bad { color:var(--red); }
  .kpi-label { font-family:var(--mono); font-size:10.5px; color:var(--mut2); margin-top:4px; }

  .section-title { font-family:'Orbitron',sans-serif; font-size:16px; margin:26px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  /* Kosten-Trend Chart */
  .chart-card { background:var(--panel); border:1px solid var(--line2); padding:18px 18px 10px; margin-bottom:8px; }
  .chart-svg { width:100%; height:150px; display:block; overflow:visible; }
  .chart-bar { fill:var(--green); }
  .chart-bar:hover { fill:#5bffb8; }
  .chart-wrap { position:relative; }

  .urgent-row { display:flex; flex-direction:column; gap:3px; padding:12px 16px; background:rgba(255,197,92,.06); border:1px solid rgba(255,197,92,.3); margin-bottom:8px; }
  .urgent-top { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; font-weight:700; color:var(--amber); }
  .urgent-quelle { font-family:var(--mono); font-size:10px; color:var(--mut2); }
  .urgent-detail { font-size:12.5px; color:var(--mut); }

  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .search-input { flex:1; min-width:180px; background:var(--panel-solid); border:1px solid var(--line2); color:var(--txt);
    padding:9px 12px; font-family:var(--mono); font-size:12.5px; }
  .search-input:focus { outline:none; border-color:var(--green); }
  .filter-chip { font-family:var(--mono); font-size:11.5px; padding:7px 13px; background:none; border:1px solid var(--line2);
    color:var(--mut); cursor:pointer; white-space:nowrap; }
  .filter-chip.active { border-color:var(--green); color:var(--green); background:rgba(62,242,160,.08); }

  .table-wrap { overflow-x:auto; border:1px solid var(--line2); }
  table.cockpit-table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  table.cockpit-table th, table.cockpit-table td { padding:10px 12px; border-bottom:1px solid var(--line2); text-align:left; vertical-align:top; }
  table.cockpit-table th { font-family:var(--mono); font-size:10.5px; color:var(--mut2); background:var(--panel-solid); position:sticky; top:0; cursor:pointer; user-select:none; white-space:nowrap; }
  table.cockpit-table th:hover { color:var(--green); }
  table.cockpit-table th .arrow { opacity:.6; margin-left:3px; }
  table.cockpit-table td.num { font-family:var(--mono); color:var(--mut2); }
  table.cockpit-table tr:hover td { background:rgba(62,242,160,.04); }
  .status-pill { font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:20px; white-space:nowrap; display:inline-block; }
  .status-ok { color:var(--green); background:rgba(62,242,160,.1); border:1px solid rgba(62,242,160,.35); }
  .status-fehler { color:var(--red); background:rgba(255,107,129,.12); border:1px solid rgba(255,107,129,.35); }
  .status-nie-gelaufen { color:var(--amber); background:rgba(255,197,92,.1); border:1px solid rgba(255,197,92,.35); }
  .verb-tag { font-family:var(--mono); font-size:10px; color:var(--cyan); background:rgba(111,224,255,.08); border:1px solid rgba(111,224,255,.25); padding:2px 6px; border-radius:10px; margin:1px 3px 1px 0; display:inline-block; }
  .sofort-cell { color:var(--amber); font-size:12px; }
  .row-link { color:var(--mut); text-decoration:none; }
  .row-link:hover { color:var(--green); }
  .reliability { display:flex; gap:3px; }
  .reliability span { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .rel-success { background:var(--green); }
  .rel-failure { background:var(--red); }
  .rel-other { background:var(--mut2); }
  .rel-empty { color:var(--mut2); font-family:var(--mono); font-size:11px; }

  .note { font-size:11.5px; color:var(--mut2); margin-top:10px; }
  .result-count { font-family:var(--mono); font-size:11px; color:var(--mut2); }

  .empty { text-align:center; padding:40px 20px; color:var(--mut2); font-size:13px; }
  .empty .emoji { font-size:32px; margin-bottom:10px; }

  footer { border-top:1px solid var(--line2); padding:30px 20px 50px; text-align:center; color:var(--mut2); font-size:12px; font-family:var(--mono); }
  footer a { color:var(--green); text-decoration:none; margin:0 8px; }
</style>
</head>
<body>

<div class="bg-grid"></div>

<nav>
  <div class="logo">CASHMACHINE<b>&nbsp;COCKPIT</b></div>
  <div class="nav-links">
    <a href="../">Jarvis</a>
    <a href="../command/">Command</a>
    <a href="../empire/">Empire</a>
  </div>
</nav>

<header class="hero">
  <div class="kicker">ALLES · EINE TABELLE</div>
  <h1>COCKPIT</h1>
  <p class="sub">Status jeder Automation, Kosten-Trend, Zuverlässigkeit der letzten Läufe, und was JETZT Aufmerksamkeit braucht.</p>
</header>

<main>
  <div id="content">
    <div class="empty"><div class="emoji">⏳</div>Lade Daten…</div>
  </div>
</main>

<footer>
  CASHMACHINE AI
  <a href="../">Jarvis</a> · <a href="../command/">Command</a> · <a href="../agents/">Agents</a> · <a href="../empire/">Empire</a>
</footer>

<script>
let DATA = null;
let sortKey = 'status';
let sortDir = 1;
let filterStatus = 'alle';
let searchQuery = '';

function fmtDatum(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function fmtDatumKurz(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
}

function statusLabel(status) {
  if (status === 'ok') return '✅ OK';
  if (status === 'fehler') return '❌ Fehler';
  if (status === 'nie-gelaufen') return '⚠️ Nie gelaufen';
  return status;
}

function statusRang(status) {
  if (status === 'fehler') return 0;
  if (status === 'nie-gelaufen') return 1;
  return 2;
}

function renderReliability(verlauf) {
  if (!verlauf || !verlauf.length) return '<span class="rel-empty">–</span>';
  const dots = verlauf.slice(0, 5).map((c) => {
    const cls = c === 'success' ? 'rel-success' : c === 'failure' ? 'rel-failure' : 'rel-other';
    return `<span class="${cls}" title="${c || 'unbekannt'}"></span>`;
  }).join('');
  return `<div class="reliability">${dots}</div>`;
}

function renderChart(verlauf) {
  if (!verlauf || verlauf.length < 2) return '';
  const werte = verlauf.map((e) => e.tokenHeute || 0);
  const max = Math.max(...werte, 1);
  const w = 100 / verlauf.length;
  const barW = Math.min(w * 0.55, 4);
  let svg = `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 100 40" preserveAspectRatio="none" id="chartSvg">`;
  verlauf.forEach((e, i) => {
    const h = Math.max((e.tokenHeute || 0) / max * 34, 0.6);
    const x = i * w + (w - barW) / 2;
    const y = 36 - h;
    svg += `<rect class="chart-bar" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${h.toFixed(2)}" rx="0.8" data-i="${i}"><title>${fmtDatumKurz(e.datum)}: ${(e.tokenHeute || 0).toLocaleString('de-DE')} Token</title></rect>`;
  });
  svg += `</svg>`;
  svg += `<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mut2);margin-top:4px;">
    <span>${fmtDatumKurz(verlauf[0].datum)}</span><span>${fmtDatumKurz(verlauf[verlauf.length - 1].datum)}</span>
  </div></div>`;
  return svg;
}

function gefilterteAutomationen() {
  let liste = [...(DATA.automationen || [])];
  if (filterStatus !== 'alle') liste = liste.filter((a) => a.status === filterStatus);
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    liste = liste.filter((a) => a.name.toLowerCase().includes(q) || String(a.nummer).includes(q));
  }
  liste.sort((a, b) => {
    let cmp = 0;
    if (sortKey === 'status') cmp = statusRang(a.status) - statusRang(b.status);
    else if (sortKey === 'nummer') cmp = (a.nummer || 999) - (b.nummer || 999);
    else if (sortKey === 'name') cmp = a.name.localeCompare(b.name);
    else if (sortKey === 'letzterLauf') cmp = new Date(a.letzterLauf?.startedAt || 0) - new Date(b.letzterLauf?.startedAt || 0);
    if (cmp === 0) cmp = (a.nummer || 999) - (b.nummer || 999);
    return cmp * sortDir;
  });
  return liste;
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = 1; }
  renderTable();
}

function setFilter(status) {
  filterStatus = status;
  renderTable();
}

function renderTable() {
  const liste = gefilterteAutomationen();
  const tbody = document.getElementById('tableBody');
  const countEl = document.getElementById('resultCount');
  countEl.textContent = `${liste.length} von ${DATA.automationen.length}`;

  if (!liste.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty" style="padding:24px;">Keine Treffer.</div></td></tr>`;
  } else {
    tbody.innerHTML = liste.map((a) => `
      <tr>
        <td class="num">${a.nummer ?? '–'}</td>
        <td>${a.workflowUrl ? `<a class="row-link" href="${a.workflowUrl}" target="_blank" rel="noopener">${a.name}</a>` : a.name}</td>
        <td><span class="status-pill status-${a.status}">${statusLabel(a.status)}</span></td>
        <td>${renderReliability(a.verlauf)}</td>
        <td class="num">${a.letzterLauf ? fmtDatum(a.letzterLauf.startedAt) : '–'}</td>
        <td>${(a.verbindungen || []).map((v) => `<span class="verb-tag">${v}</span>`).join('') || '–'}</td>
        <td class="sofort-cell">${a.sofortNoetig || '–'}</td>
      </tr>`).join('');
  }

  document.querySelectorAll('th[data-sort]').forEach((th) => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === sortKey) arrow.textContent = sortDir === 1 ? '▲' : '▼';
    else arrow.textContent = '';
  });
  document.querySelectorAll('.filter-chip').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.status === filterStatus);
  });
}

function render(data) {
  DATA = data;
  const el = document.getElementById('content');
  if (!data || !data.automationen || !data.automationen.length) {
    el.innerHTML = '<div class="empty"><div class="emoji">🛰️</div><b>Noch keine Daten</b><br>Erscheint, sobald der Agenten-Status-Sammler (#80) und das Kosten-Cockpit (#81) einmal gelaufen sind.</div>';
    return;
  }

  const anzahlHandlungsbedarf = data.automationen.filter((a) => a.status !== 'ok').length;
  const anzahlFehler = data.automationen.filter((a) => a.status === 'fehler').length;
  const anzahlNieGelaufen = data.automationen.filter((a) => a.status === 'nie-gelaufen').length;
  const kosten = data.kosten || {};

  let html = '<div class="kpi-grid">';
  html += `<div class="kpi-box"><div class="kpi-num">${data.automationen.length}</div><div class="kpi-label">AUTOMATIONEN GESAMT</div></div>`;
  html += `<div class="kpi-box"><div class="kpi-num ${anzahlHandlungsbedarf > 0 ? 'warn' : ''}">${anzahlHandlungsbedarf}</div><div class="kpi-label">BRAUCHEN AUFMERKSAMKEIT</div></div>`;
  const tokenLimitAnteil = kosten.limit > 0 ? Math.min(100, Math.round(((kosten.tokenHeute || 0) / kosten.limit) * 100)) : null;
  html += `<div class="kpi-box"><div class="kpi-num">${(kosten.tokenHeute || 0).toLocaleString('de-DE')}</div><div class="kpi-label">LOKALE KI-TOKEN HEUTE (KOSTENLOS)</div></div>`;
  if (tokenLimitAnteil !== null) {
    html += `<div class="kpi-box"><div class="kpi-num">${tokenLimitAnteil}%</div><div class="kpi-label">TAGES-SICHERHEITSLIMIT AUSGESCHÖPFT</div></div>`;
  }
  html += '</div>';

  if (kosten.verlauf && kosten.verlauf.length >= 2) {
    html += '<div class="section-title">📈 Token-Verbrauch-Trend</div>';
    html += `<div class="chart-card">${renderChart(kosten.verlauf)}</div>`;
  }

  html += '<div class="section-title">🚨 Sofort nötig</div>';
  if (data.sofortNoetig && data.sofortNoetig.length) {
    html += data.sofortNoetig.map((s) => `
      <div class="urgent-row">
        <div class="urgent-top"><span>${s.titel}</span><span class="urgent-quelle">${s.quelle}</span></div>
        <div class="urgent-detail">${s.detail || ''}</div>
      </div>`).join('');
  } else {
    html += '<div class="empty" style="padding:20px;"><div class="emoji">✅</div>Alles im grünen Bereich.</div>';
  }

  html += `<div class="section-title">📋 Alle Automationen <span class="result-count" id="resultCount"></span></div>`;
  html += `<div class="controls">
    <input class="search-input" id="searchInput" type="text" placeholder="Suche nach Name oder Nummer…">
    <button class="filter-chip" data-status="alle">Alle (${data.automationen.length})</button>
    <button class="filter-chip" data-status="fehler">❌ Fehler (${anzahlFehler})</button>
    <button class="filter-chip" data-status="nie-gelaufen">⚠️ Nie gelaufen (${anzahlNieGelaufen})</button>
    <button class="filter-chip" data-status="ok">✅ OK (${data.automationen.length - anzahlHandlungsbedarf})</button>
  </div>`;

  html += '<div class="table-wrap"><table class="cockpit-table"><thead><tr>' +
    '<th data-sort="nummer">#<span class="arrow"></span></th>' +
    '<th data-sort="name">Name<span class="arrow"></span></th>' +
    '<th data-sort="status">Status<span class="arrow"></span></th>' +
    '<th>Letzte 5 Läufe</th>' +
    '<th data-sort="letzterLauf">Zuletzt<span class="arrow"></span></th>' +
    '<th>Verbindungen</th><th>Sofort nötig</th>' +
    '</tr></thead><tbody id="tableBody"></tbody></table></div>';

  html += '<p class="note">Gemini läuft über die kostenlose API-Stufe — kein Euro-Betrag, nur wie nah der Tokenverbrauch am eigenen Sicherheitslimit liegt. "OK" heißt, der letzte Lauf ist ohne Absturz durchgelaufen — das sagt nicht zwingend, dass alle nötigen Secrets gesetzt sind, nur "nie gelaufen"/"Fehler" ist ein sicheres Signal. Die 5 Punkte zeigen die letzten Läufe (grün = OK, rot = Fehler).</p>';
  html += `<p class="note">Stand: ${fmtDatum(data.updatedAt)}</p>`;

  el.innerHTML = html;

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderTable();
  });
  document.querySelectorAll('.filter-chip').forEach((btn) => {
    btn.addEventListener('click', () => setFilter(btn.dataset.status));
  });
  document.querySelectorAll('th[data-sort]').forEach((th) => {
    th.addEventListener('click', () => setSort(th.dataset.sort));
  });

  renderTable();
}

function ladeDaten() {
  fetch('./data.json', { cache: 'no-store' })
    .then((res) => { if (!res.ok) throw new Error('no data'); return res.json(); })
    .then(render)
    .catch(() => {
      document.getElementById('content').innerHTML = '<div class="empty"><div class="emoji">🛰️</div><b>Noch keine Daten</b><br>Erscheint, sobald der Agenten-Status-Sammler (#80) und das Kosten-Cockpit (#81) einmal gelaufen sind.</div>';
    });
}

ladeDaten();
setInterval(ladeDaten, 60000);
</script>

</body>
</html>

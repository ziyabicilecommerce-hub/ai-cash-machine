name = "cashmachine-customer-agent"
main = "worker.js"
compatibility_date = "2025-01-01"

# State pro Besucher (Rate-Limit) und global (Tages-Token-Budget). Nach dem
# Erstellen via `wrangler kv namespace create CHAT_STATE` die zurückgegebene
# id hier eintragen.
[[kv_namespaces]]
binding = "CHAT_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Nicht-geheime Konfiguration - kann hier direkt stehen (kein Secret).
[vars]
SHOP_NAME = "Mein Shop"
SHOP_NISCHE = ""
VERSANDZEIT = "2-4 Werktage"
RETOURE_TAGE = "14"
SUPPORT_EMAIL = ""
# Komma-getrennte Liste exakter Origins, die den Chat einbetten dürfen -
# ohne Eintrag hier lehnt der Worker JEDE Anfrage mit 403 ab (siehe worker.js).
ALLOWED_ORIGINS = "https://deinshop.myshopify.com"
RATE_LIMIT_PRO_STUNDE = "20"
MAX_TOKENS_PRO_TAG = "200000"
# Gemini-Modell für die kostenlose API-Stufe - bei Bedarf anpassen.
GEMINI_MODEL = "gemini-2.0-flash"

# Optional: echter Produktkatalog für den Chat (Verkaufsberater-Modus).
# Ohne diese beiden Werte antwortet der Chat weiter wie bisher als reiner
# Support-Assistent, nur ohne Produktempfehlungen.
# SHOPIFY_STORE_DOMAIN = deine *.myshopify.com-Domain (nicht die Custom-Domain).
# SHOPIFY_STOREFRONT_TOKEN = Storefront-API-Token (Shopify Admin → Apps →
#   eigene App → Storefront-API-Berechtigungen → "unauthenticated_read_product_listings").
# Dieser Token ist von Shopify bewusst für client-seitige Nutzung freigegeben,
# also KEIN Secret wie ANTHROPIC_API_KEY - trotzdem läuft er hier serverseitig
# im Worker, damit der Katalog gecacht werden kann.
SHOPIFY_STORE_DOMAIN = ""
SHOPIFY_STOREFRONT_TOKEN = ""
# Basis-URL für Produktlinks im Chat, falls abweichend von SHOPIFY_STORE_DOMAIN
# (z.B. eigene Domain statt *.myshopify.com). Leer = SHOPIFY_STORE_DOMAIN.
SHOP_PUBLIC_URL = ""
KATALOG_MAX_PRODUKTE = "25"
KATALOG_CACHE_TTL_SEKUNDEN = "1800"

# Secret NICHT hier eintragen - per `wrangler secret put GEMINI_API_KEY` setzen.
# Kostenloser Key unter aistudio.google.com/apikey. Wird NIE an den Browser
# ausgeliefert - der Browser spricht nur mit diesem Worker, der Worker
# spricht mit Google Gemini.

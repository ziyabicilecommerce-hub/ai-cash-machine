name = "cashmachine-trading-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

# Läuft alle 15 Minuten - wie der GitHub-Actions-Bot vorher, nur eben von
# Cloudflares Edge-Netzwerk aus statt aus einem von Binance blockierten
# GitHub-Actions-IP-Bereich.
[triggers]
crons = ["*/15 * * * *"]

# State pro Symbol (Kapital, offene Position, Kill-Switch). Nach dem Erstellen
# via `wrangler kv namespace create TRADING_STATE` die zurückgegebene id hier
# eintragen.
[[kv_namespaces]]
binding = "TRADING_STATE"
id = "055d3b2d0a514437aec11e888e81c242"

# Nicht-geheime Konfiguration - kann hier direkt stehen (kein Secret).
[vars]
TRADING_EXCHANGE = "kraken"
TRADING_SYMBOLS = "XBTUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,DOTUSDT,LTCUSDT"
TRADING_PAPER_MODE = "ja"
TRADING_KAPITAL_USDT = "100"
TRADING_MAX_POSITION_PROZENT = "25"
TRADING_MAX_TAGESVERLUST_PROZENT = "5"
TRADING_MAX_GESAMTVERLUST_PROZENT = "20"
TRADING_STOP_LOSS_PROZENT = "3"
TRADING_TAKE_PROFIT_PROZENT = "5"
TRADING_EMA_SCHNELL = "9"
TRADING_EMA_LANGSAM = "21"

# Neue Risiko-/Strategie-Features - alle standardmäßig AUS bzw. verhaltensneutral
# (0 = deaktiviert), damit dieses Update ein bereits laufendes Setup nicht
# ungefragt anders handeln lässt. Siehe README für die genaue Wirkung jedes Werts.
TRADING_RSI_PERIODE = "14"
TRADING_RSI_UEBERKAUFT = "0"
TRADING_MIN_VOLATILITAET_PROZENT = "0"
TRADING_TRAILING_STOP_AB_PROZENT = "2"
TRADING_VOLA_SIZING = "nein"
TRADING_VOLA_SIZING_REFERENZ_PROZENT = "2"
TRADING_VOLA_SIZING_MIN_FAKTOR = "0.25"
# Leer = keine Grenze (so viele gleichzeitig wie Symbole konfiguriert sind).
# TRADING_MAX_GLEICHZEITIGE_POSITIONEN = "2"

# 24h-Preisbestätigung (kein API-Key nötig, alles öffentliche APIs): verwirft
# ein Kaufsignal, wenn der Coin im Schnitt aus bis zu 5 unabhängigen Quellen
# (CoinGecko, CoinPaprika, OKX, Gate.io, Bitstamp) in den letzten 24h im
# Minus steht - unabhängige Zweitbestätigung neben den Kraken-Kursdaten, die
# den Kauf tatsächlich auslösen.
TRADING_COINGECKO_FILTER = "ja"
TRADING_COINGECKO_MIN_24H_PROZENT = "0"

# Fear & Greed Index-Filter (kein API-Key nötig, öffentliche API): verwirft
# ein Kaufsignal, wenn der Gesamtmarkt laut Index "Extreme Greed" zeigt
# (Wert >= 80) - Kontra-Signal gegen Euphorie-Käufe. Markweiter Wert, gilt
# für alle Coins gleich, nur einmal pro Lauf abgefragt.
TRADING_FNG_FILTER = "ja"
TRADING_FNG_MAX_WERT = "80"

# Mehrfach-Zeitrahmen-Bestätigung: verwirft ein Kaufsignal, wenn der
# übergeordnete Trend (Default 4h = 240 Minuten, EMA9 vs. EMA21) abwärts
# zeigt - vermeidet Käufe gegen einen größeren Abwärtstrend, nur weil das
# kurzfristige 15m-Signal gerade anspringt.
TRADING_MTF_FILTER = "ja"
TRADING_MTF_INTERVAL_MINUTEN = "240"

# BTC-Dominanz-Filter (kein API-Key nötig, öffentliche API): verwirft ein
# Kaufsignal für ALTCOINS (nicht für BTC selbst), wenn BTCs Anteil an der
# gesamten Krypto-Marktkapitalisierung über der Schwelle liegt - Kapital
# fließt dann bevorzugt in Bitcoin statt Altcoins.
TRADING_BTC_DOMINANZ_FILTER = "ja"
TRADING_BTC_DOMINANZ_MAX_PROZENT = "60"

# Performance-basierte Positionsgröße (kein externer API-Call, nutzt nur die
# eigene Trade-Historie): reduziert die Positionsgröße für ein Symbol, das
# zuletzt schlecht lief (Win-Rate < 50%, ab TRADING_PERFORMANCE_SIZING_MIN_TRADES
# abgeschlossenen Trades) - kann die konfigurierte Positionsgröße NIE
# überschreiten, nur nach unten anpassen.
TRADING_PERFORMANCE_SIZING = "ja"
TRADING_PERFORMANCE_SIZING_MIN_FAKTOR = "0.5"
TRADING_PERFORMANCE_SIZING_MIN_TRADES = "5"

# Flash-Crash-Schutz (kein API-Call, nutzt dieselben Kerzen wie die
# Strategie): pausiert Käufe für ein Symbol, wenn der Kurs innerhalb der
# letzten TRADING_FLASH_CRASH_FENSTER_KERZEN-Kerzen (Default 4 = 1h bei
# 15m) bereits um mehr als TRADING_FLASH_CRASH_MAX_DROP_PROZENT gefallen ist -
# eher ein Flash-Crash/Börsenfehler als eine normale Kaufgelegenheit.
TRADING_FLASH_CRASH_FILTER = "ja"
TRADING_FLASH_CRASH_FENSTER_KERZEN = "4"
TRADING_FLASH_CRASH_MAX_DROP_PROZENT = "8"

# Spread-Filter (kein extra API-Key, nutzt die ohnehin verbundene Börse):
# verwirft einen Kauf, wenn der Bid/Ask-Spread gerade ungewöhnlich breit ist -
# oft ein Begleitsymptom eines Flash-Crashs oder Börsenproblems.
TRADING_SPREAD_FILTER = "ja"
TRADING_SPREAD_MAX_PROZENT = "1"

# Drei Strategien zur Wahl (Default "ema-crossover" = unverändertes Verhalten):
# "bollinger-mean-reversion": kauft, wenn der Kurs unter das untere
# Bollinger-Band fällt (überverkauft), verkauft beim Rücksprung zum
# Mittelwert - eher für seitwärts laufende statt trendende Märkte geeignet.
# "donchian-breakout": kauft, wenn der Kurs über das höchste Hoch der
# letzten TRADING_DONCHIAN_ENTRY_PERIODE-Kerzen ausbricht (klassischer
# "Turtle Trader"-Breakout), verkauft über einen kürzeren Ausstiegs-Kanal
# (TRADING_DONCHIAN_EXIT_PERIODE) - eher für neue, gerade erst startende
# Trends geeignet, nicht für seitwärts laufende Märkte.
# VOR dem Umschalten unbedingt alle drei mit `node backtest.mjs SYMBOL TAGE
# --vergleiche` gegeneinander testen, siehe README - oder interaktiv im
# CASHMACHINE STRATEGY LAB (strategy-lab/ im Hauptrepo).
TRADING_STRATEGIE = "bollinger-mean-reversion"
TRADING_BOLLINGER_PERIODE = "20"
# 1.5 statt 2 Standardabweichungen = engeres Band = löst öfter aus. Per
# Backtest (90 Tage, alle 8 Coins) geprüft: deutlich mehr Trades bei
# gleicher oder besserer Win-Rate ggü. 2 (z.B. ETH: 12→18 Trades, Win-Rate
# 66,7%→77,8%; BTC: 11→15 Trades, Win-Rate 81,8%→80,0%).
TRADING_BOLLINGER_STDDEV = "1.5"
TRADING_DONCHIAN_ENTRY_PERIODE = "20"
TRADING_DONCHIAN_EXIT_PERIODE = "10"

# War früher ein Live-Vergleich (jede Dreiergruppe eine andere Strategie).
# Per Backtest (90 Tage, alle 8 Coins) klar entschieden: bollinger-mean-
# reversion schlägt donchian-breakout/ema-crossover auf 7 von 8 Coins
# deutlich (z.B. XRP: -0,5% Return/18,2% Win-Rate mit donchian vs. +0,6%/85%
# mit bollinger; ADA: -1,9%/28,6% vs. +1,67%/85%; LTC: -0,54%/17,6% mit ema
# vs. +0,31%/84,2% mit bollinger). Deshalb jetzt leer - alle Coins nutzen
# den Fallback TRADING_STRATEGIE (oben) statt einer schlechter laufenden
# Alternative. Format zum späteren Wiederaktivieren: "XBTUSDT:donchian-breakout,...".
TRADING_STRATEGIE_PRO_SYMBOL = ""

# Secrets NICHT hier eintragen - per `wrangler secret put <NAME>` setzen:
#   BINANCE_API_KEY       (nur Spot-Trading-Rechte, NIEMALS Auszahlungsrechte aktivieren)
#   BINANCE_API_SECRET
#   KRAKEN_API_KEY         (nur falls TRADING_EXCHANGE = "kraken")
#   KRAKEN_API_SECRET
#   WHATSAPP_ACCESS_TOKEN  (gleicher Wert wie bei den anderen Automationen, optional)
#   WHATSAPP_PHONE_NUMBER_ID
#   WHATSAPP_TO_NUMBER
#   TRIGGER_SECRET         (frei erfundener String, schützt den manuellen Test-Aufruf)
#   STATUS_READ_KEY        (frei erfundener String, schützt den rein lesenden
#                            /status-Endpoint fürs Trading-Dashboard - ANDERER
#                            Wert als TRIGGER_SECRET, da dieser weiterverteilt
#                            werden könnte, ohne dass damit Trades ausgelöst werden können)

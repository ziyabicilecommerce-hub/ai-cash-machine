<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CASHMACHINE WRAPPED</title>
<meta name="description" content="Dein wöchentlicher Shop-Rückblick im Story-Format — Umsatz, bester Tag, Top-Produkt, Wachstum.">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0612; --txt: #fff; --mut: rgba(255,255,255,.72); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--txt); }

  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

  .stage { position:relative; width:min(460px, 100vw); height:100vh; overflow:hidden; }

  .dots { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; z-index:20;
    display:flex; gap:5px; }
  .dot { flex:1; height:3px; background:rgba(255,255,255,.28); border-radius:3px; overflow:hidden; }
  .dot-fill { height:100%; width:0%; background:#fff; border-radius:3px; }
  .dot.done .dot-fill { width:100%; transition:none; }
  .dot.active .dot-fill { transition:width linear; }

  .brand { position:absolute; top:calc(24px + env(safe-area-inset-top)); left:16px; right:16px; z-index:20;
    display:flex; justify-content:space-between; align-items:center; font-family:'Orbitron',sans-serif;
    font-size:12px; letter-spacing:.12em; color:rgba(255,255,255,.85); }
  .brand a { color:rgba(255,255,255,.7); text-decoration:none; font-family:'Inter',sans-serif; font-weight:600; font-size:12px; }

  .tapzones { position:absolute; inset:0; z-index:15; display:flex; }
  .tapzones div { flex:1; }

  .slides { position:relative; width:100%; height:100%; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:80px 30px; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .slide.show { opacity:1; pointer-events:auto; }

  .eyebrow { font-family:'Inter',sans-serif; font-weight:800; font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.75); margin-bottom:18px; }
  .emoji { font-size:52px; margin-bottom:14px; filter:drop-shadow(0 4px 20px rgba(0,0,0,.25)); }
  .big-number { font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(40px,13vw,64px); line-height:1.05;
    text-shadow:0 6px 30px rgba(0,0,0,.25); }
  .label { font-size:16px; font-weight:600; color:rgba(255,255,255,.9); margin-top:10px; }
  .sub { font-size:13.5px; color:rgba(255,255,255,.72); margin-top:16px; max-width:320px; line-height:1.55; }
  .headline { font-family:'Inter',sans-serif; font-weight:800; font-size:clamp(22px,7vw,32px); line-height:1.25; max-width:340px; }
  .growth-badge { display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:8px 18px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:30px;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:15px; }

  .cta { position:absolute; bottom:calc(34px + env(safe-area-inset-bottom)); left:0; right:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cta button, .cta a.btn { background:rgba(255,255,255,.95); color:#1a1030; border:none; font-family:'Inter',sans-serif;
    font-weight:800; font-size:13.5px; padding:12px 26px; border-radius:30px; cursor:pointer; text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .cta .hint { font-size:11.5px; color:rgba(255,255,255,.6); }

  .empty-wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:30px;
    background:linear-gradient(160deg,#1a0f2e,#0a0612); text-align:center; }
  .empty-box { max-width:380px; }
  .empty-box .emoji { font-size:44px; margin-bottom:16px; }
  .empty-box h1 { font-family:'Orbitron',sans-serif; font-size:18px; letter-spacing:.06em; margin-bottom:12px; }
  .empty-box p { font-size:13.5px; color:var(--mut); line-height:1.7; }
  .empty-box a { color:#fff; }
</style>
</head>
<body>

<div id="app"></div>

<script>
  const GRADIENTS = [
    'linear-gradient(160deg,#ff5f6d,#ffc371)',
    'linear-gradient(160deg,#7f00ff,#e100ff)',
    'linear-gradient(160deg,#00c6ff,#0072ff)',
    'linear-gradient(160deg,#11998e,#38ef7d)',
    'linear-gradient(160deg,#f857a6,#ff5858)',
    'linear-gradient(160deg,#fc4a1a,#f7b733)',
    'linear-gradient(160deg,#654ea3,#eaafc8)',
    'linear-gradient(160deg,#1a0f2e,#3d1e5c)',
  ];
  const SLIDE_MS = 5000;
  const fmtGeld = (n, w) => Number(n || 0).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' ' + (w || 'EUR');
  const fmtDatum = (iso) => { try { return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: 'long' }); } catch { return iso; } };

  function bauSlides(w) {
    const slides = [];

    slides.push({
      emoji: '🎉',
      eyebrow: `Wöchentlicher Rückblick`,
      headline: `Deine Woche bei ${w.shopName}`,
      sub: `${fmtDatum(w.zeitraumVon)} – ${fmtDatum(w.zeitraumBis)}`,
    });

    slides.push({
      eyebrow: 'Gesamtumsatz',
      big: fmtGeld(w.umsatz, w.waehrung),
      sub: `Über ${w.bestellungen} Bestellung${w.bestellungen === 1 ? '' : 'en'} verteilt.`,
    });

    slides.push({
      eyebrow: 'Durchschnittlicher Bestellwert',
      big: fmtGeld(w.aov, w.waehrung),
      sub: 'Pro Bestellung im Schnitt.',
    });

    if (w.bestTag) {
      slides.push({
        emoji: '🏆',
        eyebrow: 'Dein bester Tag',
        big: fmtGeld(w.bestTag.umsatz, w.waehrung),
        label: fmtDatum(w.bestTag.datum),
      });
    }

    if (w.topProdukt) {
      slides.push({
        emoji: '⭐',
        eyebrow: 'Top-Produkt der Woche',
        headline: w.topProdukt.name,
        sub: `${w.topProdukt.menge}x verkauft.`,
      });
    }

    slides.push({
      emoji: '💰',
      eyebrow: 'Geschätzter Nettogewinn',
      big: fmtGeld(w.nettoGewinn, w.waehrung),
      sub: 'Nach Werbekosten, Gebühren und Steuer-Anteil.',
    });

    if (w.wachstumProzent !== null && w.wachstumProzent !== undefined) {
      const hoch = w.wachstumProzent >= 0;
      slides.push({
        emoji: hoch ? '📈' : '📉',
        eyebrow: 'Wachstum ggü. der Vorwoche',
        badge: `${hoch ? '+' : ''}${w.wachstumProzent}%`,
        sub: hoch ? 'Stärker als letzte Woche - weiter so!' : 'Etwas schwächer als letzte Woche - schau in Forecast/Oracle nach Ideen.',
      });
    }

    slides.push({
      emoji: '🚀',
      headline: 'Bis nächste Woche!',
      sub: `Erstellt von der CASHMACHINE AI Suite für ${w.shopName}.`,
      cta: true,
    });

    return slides;
  }

  function render(w) {
    const slides = bauSlides(w);
    let current = 0;
    let timer = null;
    let paused = false;

    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="stage">
        <div class="dots" id="dots"></div>
        <div class="brand"><span>CASHMACHINE WRAPPED</span><a href="../">Jarvis →</a></div>
        <div class="tapzones"><div id="zonePrev"></div><div id="zoneNext"></div></div>
        <div class="slides" id="slides"></div>
      </div>`;

    const dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = slides.map(() => `<div class="dot"><div class="dot-fill"></div></div>`).join('');

    const slidesEl = document.getElementById('slides');
    slidesEl.innerHTML = slides.map((s, i) => {
      const bg = GRADIENTS[i % GRADIENTS.length];
      return `<div class="slide" data-i="${i}" style="background:${bg}">
        ${s.emoji ? `<div class="emoji">${s.emoji}</div>` : ''}
        ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
        ${s.big ? `<div class="big-number">${s.big}</div>` : ''}
        ${s.headline ? `<div class="headline">${s.headline}</div>` : ''}
        ${s.badge ? `<div class="growth-badge">${s.badge}</div>` : ''}
        ${s.label ? `<div class="label">${s.label}</div>` : ''}
        ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
        ${s.cta ? `<div class="cta"><a class="btn" href="../">Zurück zu Jarvis</a><span class="hint">Tippe zum Wiederholen ↺</span></div>` : ''}
      </div>`;
    }).join('');

    function goTo(i, autoplay = true) {
      if (i < 0) i = 0;
      if (i >= slides.length) { i = 0; }
      current = i;
      document.querySelectorAll('.slide').forEach((el) => el.classList.toggle('show', +el.dataset.i === i));
      document.querySelectorAll('.dot').forEach((el, idx) => {
        el.classList.toggle('done', idx < i);
        el.classList.toggle('active', idx === i);
        const fill = el.querySelector('.dot-fill');
        if (idx === i) { fill.style.transition = 'none'; fill.style.width = '0%'; }
      });
      clearTimeout(timer);
      if (autoplay) startFill();
    }

    function startFill() {
      const activeDot = document.querySelector('.dot.active .dot-fill');
      if (!activeDot) return;
      requestAnimationFrame(() => {
        activeDot.style.transition = `width ${SLIDE_MS}ms linear`;
        activeDot.style.width = '100%';
      });
      timer = setTimeout(() => { if (!paused) goTo(current + 1); }, SLIDE_MS);
    }

    document.getElementById('zonePrev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('zoneNext').addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goTo(current + 1);
      if (e.key === 'ArrowLeft') goTo(current - 1);
    });

    let touchStartX = null;
    app.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    app.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });

    goTo(0);
  }

  function zeigeEmptyState() {
    document.getElementById('app').outerHTML = `
      <div class="empty-wrap">
        <div class="empty-box">
          <div class="emoji">🎬</div>
          <h1>NOCH KEIN RÜCKBLICK</h1>
          <p>Der erste Wrapped-Rückblick erscheint hier, sobald der Gewinn-Radar (#01) mindestens 2 Tage lang gelaufen ist und der Wrapped-Generator (#79) seinen ersten wöchentlichen Lauf hatte (montags).<br><br><a href="../">← Zurück zu Jarvis</a></p>
        </div>
      </div>`;
  }

  fetch('./data.json', { cache: 'no-store' })
    .then((res) => { if (!res.ok) throw new Error('no data'); return res.json(); })
    .then((w) => render(w))
    .catch(() => zeigeEmptyState());
</script>
</body>
</html>

name = "cashmachine-stocks-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

# Alle 5 Minuten, wie der Krypto-Bot - läuft aber nur wirklich, wenn die
# Börse laut Alpaca gerade offen ist (siehe worker.js runAll). Außerhalb der
# Handelszeiten ist der Lauf ein einzelner, billiger /v2/clock-Check und
# beendet sich sofort.
[triggers]
crons = ["*/5 * * * *"]

# State pro Symbol (Kapital, offene Position, Kill-Switch) - eigener,
# unabhängiger KV-Namespace vom Krypto-Bot.
[[kv_namespaces]]
binding = "STOCKS_STATE"
id = "1e78744a331c4e7c812e31c4532da003"

# Nicht-geheime Konfiguration - kann hier direkt stehen (kein Secret).
[vars]
STOCKS_SYMBOLS = "AAPL,MSFT,NVDA,AMZN,GOOGL"
STOCKS_KAPITAL_USD = "50"
STOCKS_MAX_POSITION_PROZENT = "25"
STOCKS_MAX_TAGESVERLUST_PROZENT = "5"
STOCKS_MAX_GESAMTVERLUST_PROZENT = "20"
STOCKS_STOP_LOSS_PROZENT = "3"
STOCKS_TAKE_PROFIT_PROZENT = "0"
STOCKS_EMA_SCHNELL = "9"
STOCKS_EMA_LANGSAM = "21"
STOCKS_RSI_PERIODE = "14"
STOCKS_RSI_UEBERKAUFT = "0"

# Strategie identisch zum Krypto-Bot gewählt (dort per Backtest gegen alle
# 8 Coins klar am besten) - für Aktien noch NICHT per Backtest verifiziert,
# da backtest.mjs bisher nur Kraken-Kerzen lädt. Vor dem Live-Umstieg
# unbedingt zuerst ein paar Wochen im Paper-Modus beobachten.
STOCKS_STRATEGIE = "bollinger-mean-reversion"
STOCKS_BOLLINGER_PERIODE = "20"
STOCKS_BOLLINGER_STDDEV = "2"
STOCKS_DONCHIAN_ENTRY_PERIODE = "20"
STOCKS_DONCHIAN_EXIT_PERIODE = "10"

STOCKS_FLASH_CRASH_FILTER = "ja"
STOCKS_FLASH_CRASH_FENSTER_KERZEN = "4"
STOCKS_FLASH_CRASH_MAX_DROP_PROZENT = "8"
STOCKS_SPREAD_FILTER = "ja"
STOCKS_SPREAD_MAX_PROZENT = "1"
STOCKS_COOLDOWN_NACH_VERLUST_MINUTEN = "60"

STOCKS_PERFORMANCE_SIZING = "ja"
STOCKS_PERFORMANCE_SIZING_MIN_FAKTOR = "0.5"
STOCKS_PERFORMANCE_SIZING_MIN_TRADES = "5"

# Wirtschaftskalender-Filter (kein API-Key nötig, öffentliche Gratis-Quelle
# nfs.faireconomy.media) - gerade für Aktien besonders relevant: pausiert
# Käufe rund um FOMC/CPI/NFP-Termine. Gemeinsames Modul mit
# trading-bot-worker (Krypto) - EIN Abruf pro Cron-Lauf, Rate-Limit der
# Quelle beachten (max. 2 Abrufe/5 Min insgesamt für diese URL).
STOCKS_NEWS_EVENT_FILTER = "ja"
STOCKS_NEWS_EVENT_FENSTER_MINUTEN = "30"

# Marktweiter Crash-Schutz (Pendant zum Krypto-Bot, dort BTC als Signal) -
# crasht SPY (S&P-500-ETF, breiter Marktindikator) hart, werden Käufe für
# ALLE Aktien in diesem Lauf pausiert. SPY selbst wird nicht gehandelt, nur
# als Signal abgefragt (ein zusätzlicher Klines-Abruf pro Lauf). Etwas
# engere Schwelle als beim Krypto-Bot (5% statt 10%) - der breite
# Aktienmarkt ist strukturell weniger volatil als BTC, ein 5%-Einbruch
# innerhalb einer Stunde ist bei SPY bereits ein extrem seltenes,
# gewichtiges Ereignis (Flash-Crash-Territorium).
STOCKS_MARKTWEITER_CRASH_FILTER = "ja"
STOCKS_MARKTWEITER_CRASH_SYMBOL = "SPY"
STOCKS_MARKTWEITER_CRASH_FENSTER_KERZEN = "4"
STOCKS_MARKTWEITER_CRASH_MAX_DROP_PROZENT = "5"

# Insider-Kauf-Bestätigung (kein API-Key, öffentliche SEC-EDGAR-Daten,
# siehe lib/insiderbuys.mjs) - EINZIGER nicht-blockierender Filter hier:
# meldete SEC Form 4 (offener Markt-Kauf, kein Options-/Zuteilungscode)
# echte Insider-Käufe über der Mindestsumme in den letzten Tagen, wird die
# Positionsgröße leicht erhöht statt der Kauf blockiert. SEC verlangt einen
# aussagekräftigen User-Agent mit echtem Kontakt - bitte unten anpassen.
STOCKS_INSIDER_BUY_FILTER = "ja"
STOCKS_INSIDER_SEC_USER_AGENT = "CashMachineStocksBot/1.0 (dein-kontakt@example.com)"
STOCKS_INSIDER_LOOKBACK_TAGE = "7"
STOCKS_INSIDER_MIN_KAUFWERT_USD = "100000"
STOCKS_INSIDER_BOOST_FAKTOR = "1.2"

# Adaptives Lernen (Pendant zum Krypto-Bot, siehe lib/learning.mjs) - Default AUS.
STOCKS_ADAPTIVES_LERNEN = "nein"
STOCKS_ADAPTIVES_LERNEN_MIN_TRADES = "10"

# Multi-Timeframe-Filter (Pendant zum Krypto-Bot, siehe lib/multitimeframe.mjs) - Default AUS.
STOCKS_MTF_FILTER = "nein"
STOCKS_MTF_INTERVAL_MINUTEN = "240"

# Leer = keine Grenze (so viele gleichzeitig wie Symbole konfiguriert sind).
# STOCKS_MAX_GLEICHZEITIGE_POSITIONEN = "2"

# Secrets NICHT hier eintragen - per `wrangler secret put <NAME>` setzen:
#   ALPACA_API_KEY         (kostenloser Paper-Trading-Key von alpaca.markets,
#                            KEINE Kreditkarte/Einzahlung nötig)
#   ALPACA_API_SECRET
#   WHATSAPP_ACCESS_TOKEN  (optional, gleicher Wert wie beim Krypto-Bot möglich)
#   WHATSAPP_PHONE_NUMBER_ID
#   WHATSAPP_TO_NUMBER
#   TELEGRAM_BOT_TOKEN     (optional, zweiter/alternativer Kanal)
#   TELEGRAM_CHAT_ID
#   TRIGGER_SECRET         (frei erfundener String, schützt den manuellen Test-Aufruf)
#   STATUS_READ_KEY        (frei erfundener String, schützt den rein lesenden
#                            /status-Endpoint fürs Dashboard - ANDERER Wert
#                            als TRIGGER_SECRET)

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Eigenständiges NEULAND-Werkzeug: lokale Eingaben und sichtbare Ergebnisse ohne Installation."><title>NEULAND</title><style>*{box-sizing:border-box}:root{color-scheme:light}body{margin:0;background:#f3f4f7;color:#1d273a;font:15px/1.5 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #dde1e8;background:white;display:flex;justify-content:space-between;gap:16px;color:#60708a;font-size:12px;letter-spacing:.08em}header b{color:#1d273a}main{max-width:1360px;margin:0 auto;padding:24px}h1{font-size:32px;letter-spacing:-1px;line-height:1.1;margin:0 0 10px}h2{font-size:20px;margin:0 0 20px}h3{font-size:14px;margin:0}p{margin:8px 0}.intro{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.intro p{color:#5f6d81;max-width:76ch}.actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}button{background:white;color:#20304a;border:1px solid #cad1dd;font:inherit;font-size:13px;padding:10px 14px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){border-color:#2858ec}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94b3ff;outline-offset:2px}.primary{background:#2858ec;color:white;border-color:#2858ec}.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}.panel{background:white;border:1px solid #dde1e8;border-radius:12px;padding:24px;min-width:0}.input-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#4c5b72;min-width:0}.field input,.field select{font:15px system-ui,sans-serif;color:#24344f;border:1px solid #cbd2df;border-radius:5px;padding:10px;width:100%;min-width:0;background:white}.field.boolean{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e0e5ec;padding:8px;border-radius:5px}.field input[type=checkbox]{width:20px;height:20px;flex-shrink:0}.input-group>.input-group,.input-group>.array{grid-column:1/-1}.array{border:1px solid #dde2ea;padding:14px;border-radius:8px;margin:2px 0}.array-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.array-item{background:#f7f8fb;border:1px solid #e4e8ef;padding:14px;margin-top:10px;border-radius:6px}.array-item .remove{margin-top:10px;padding:5px 9px;color:#a54545;font-size:11px}.add{padding:6px 10px;font-size:11px}.panel-bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{border:1px solid #ccdbfb;background:#eef4ff;padding:12px;margin-bottom:16px;border-radius:7px;color:#284d8c;overflow-wrap:anywhere}.notice.bad{background:#fff2ed;border-color:#efccbb;color:#9a4625}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f1f5ff;border:1px solid #d8e2fb;padding:16px;border-radius:8px;min-width:0}.metric-label{font-size:12px;color:#5e6d85;display:block}.metric-value{font-size:23px;letter-spacing:-.6px;margin-top:7px;display:block;overflow-wrap:anywhere}.table-scroll{overflow:auto;margin-top:20px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:11px 10px;border-bottom:1px solid #e0e5ee;text-align:left;min-width:85px;overflow-wrap:anywhere}th{color:#5b6981;background:#f7f8fb;font-size:11px}#notes{font-size:12px;color:#5d6d82;margin-top:18px;overflow-wrap:anywhere}footer{font-size:12px;color:#6b788a;margin:22px 0}#storage-note{font-size:12px;color:#5c708f;margin-top:14px}[hidden]{display:none!important}@media(max-width:800px){header{padding:16px;font-size:10px}main{padding:18px 14px}.intro{display:block}h1{font-size:28px}.actions{margin-top:14px}.workspace{grid-template-columns:1fr}.panel{padding:18px}.metric-value{font-size:21px}.input-group{gap:10px}.array{padding:10px}. </style></head><body data-tool="ExperimentSamplePlanner"><header><b>NEULAND / EINZELWERKZEUG</b><span>LOKAL AUF DEINEM GERÄT</span></header><main><div class="intro"><div><h1 id="title"></h1><p id="description"></p></div><div class="actions"><button id="demo" type="button">Beispiel laden</button><button id="import" type="button">JSON öffnen</button><button id="export" type="button" disabled>JSON exportieren</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><div class="workspace"><section class="panel editor"><h2>Deine Eingaben</h2><div id="fields"></div><div class="panel-bottom"><button class="primary" id="calculate" type="button">Neu berechnen</button><button id="save" type="button" hidden>Journal speichern</button></div><p id="storage-note"></p></section><section class="panel"><h2>Dein Ergebnis</h2><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="results" hidden><div id="metrics"></div><div class="table-scroll" id="rows"></div><div id="notes"></div></div></section></div><footer>Beispieldaten sind synthetisch. Ersetze sie durch eigene Werte. Der JSON-Export sichert Eingaben und Ergebnis; diese Datei ist unabhängig vom Datenbankbestand des Hauptdashboards.</footer></main><script>(() => {
'use strict';const T=window.NeulandTools||={};const z=1.959963984540054,MAX=1e12;
const labels={experiments:'Versuche',name:'Bezeichnung',control_visitors:'Besucher Kontrolle',control_conversions:'Abschlüsse Kontrolle',variant_visitors:'Besucher Variante',variant_conversions:'Abschlüsse Variante',priorities:'Vorhaben',impact:'Wirkung (Punkte)',confidence:'Vertrauen (0–1)',effort:'Aufwand (gleiche Einheit)',decisions:'Entscheidungen',title:'Titel',hypothesis:'Hypothese',action:'Maßnahme',expected_result:'Erwartetes Ergebnis',outcome:'Beobachtetes Ergebnis',status:'Status'};
function num(x,label,{positive=false,integer=false,upper=MAX}={}){if(typeof x!=='number'||!Number.isFinite(x)||x<0||x>upper||(positive&&x<1e-9)||(integer&&!Number.isInteger(x)))throw Error(label+': gültige '+(integer?'ganze ':'')+'Zahl '+(positive?'ab 0,000000001':'ab 0')+' bis '+upper+' erforderlich.');return x;}
function text(x,label,{empty=true,limit=2000}={}){if(typeof x!=='string'||x.length>limit||(!empty&&!x.trim()))throw Error(label+': '+(empty?'':'nicht leerer ')+'Text mit höchstens '+limit+' Zeichen erforderlich.');return x.trim();}
function list(input,key){if(!input||typeof input!=='object'||!Array.isArray(input[key])||input[key].length>100)throw Error(key+': Liste mit höchstens 100 Einträgen erforderlich.');input[key].forEach(x=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Jeder Eintrag muss ein Objekt sein.');});return input[key];}
const round=(x,p=4)=>x===null?null:Number(x.toFixed(p));
function wilson(c,n){if(!n)return[null,null];const p=c/n,z2=z*z,d=1+z2/n,center=(p+z2/(2*n))/d,half=z*Math.sqrt(p*(1-p)/n+z2/(4*n*n))/d;return[Math.max(0,center-half),Math.min(1,center+half)];}
const interval=x=>x[0]===null?'Unbekannt (keine Besucher)':`${(x[0]*100).toFixed(2)}–${(x[1]*100).toFixed(2)} %`;
function arm(row,key){const n=num(row[key+'_visitors'],labels[key+'_visitors'],{integer:true}),c=num(row[key+'_conversions'],labels[key+'_conversions'],{integer:true});if(c>n)throw Error('Abschlüsse dürfen Besucher nicht übersteigen.');return{n,c,rate:n?c/n:null,ci:wilson(c,n)};}
T.ExperimentLab={name:'Versuchsfeld',description:'Vergleicht beobachtete Abschlussquoten mit 95-%-Wilson-Intervallen je Gruppe.',labels,example:{experiments:[{name:'Angebotsseite',control_visitors:1000,control_conversions:100,variant_visitors:1000,variant_conversions:150}]},run(input){let lowCount=0;const notes=['Beobachtete Veränderung, keine bewiesene Ursache. Zufällige und unabhängige Zuteilung bleibt Voraussetzung.','Getrennte Wilson-Intervalle sind ein konservatives Signal, kein direkter Signifikanztest und keine Korrektur für wiederholtes Nachschauen.'];const rows=list(input,'experiments').map(row=>{const name=text(row.name,'Bezeichnung',{empty:false,limit:200}),a=arm(row,'control'),b=arm(row,'variant'),available=a.n>0&&b.n>0,low=[a,b].some(x=>x.n<100||x.c<20),overlap=available?Math.max(a.ci[0],b.ci[0])<=Math.min(a.ci[1],b.ci[1]):null,change=available?(b.rate-a.rate)*100:null,lift=available&&a.rate>0?(b.rate/a.rate-1)*100:null;if(low){lowCount++;notes.push(name+': Weniger als 100 Besucher oder 20 Abschlüsse je Gruppe; mehr Daten nötig.');}return{Versuch:name,'Kontrolle (%)':round(a.rate===null?null:a.rate*100),'95-%-Intervall Kontrolle':interval(a.ci),'Variante (%)':round(b.rate===null?null:b.rate*100),'95-%-Intervall Variante':interval(b.ci),'Veränderung (Prozentpunkte)':round(change),'Relativer Lift (%)':round(lift),Einschätzung:low?'Mehr Daten nötig':overlap?'Kein belastbarer Unterschied':change>0?'Variante aussichtsreich':'Kontrolle aussichtsreich'};});return{metrics:[{label:'Versuche',value:rows.length},{label:'Versuche mit wenig Daten',value:lowCount}],rows,notes};}};
T.ValueMap={name:'Vorhabenwaage',description:'Ordnet Vorhaben nach eingeschätzter Wirkung × Vertrauen ÷ Aufwand.',labels,example:{priorities:[{name:'Onboarding vereinfachen',impact:8,confidence:.8,effort:4},{name:'Handbuch ergänzen',impact:5,confidence:.9,effort:2}]},run(input){const a=list(input,'priorities').map(row=>{const name=text(row.name,'Bezeichnung',{empty:false,limit:200}),impact=num(row.impact,'Wirkung'),confidence=num(row.confidence,'Vertrauen',{upper:1}),effort=num(row.effort,'Aufwand',{positive:true}),score=impact*confidence/effort;if(!Number.isFinite(score))throw Error('Bewertung überschreitet den Rechenbereich.');return{name,impact,confidence,effort,score};}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));return{metrics:[{label:'Vorhaben',value:a.length},{label:'Höchste Bewertung',value:a.length?round(a[0].score):null}],rows:a.map((r,i)=>({Rang:i+1,Vorhaben:r.name,Wirkung:r.impact,Vertrauen:r.confidence,Aufwand:r.effort,Bewertung:round(r.score)})),notes:['Formel: Wirkung × Vertrauen ÷ Aufwand. Wirkung und Aufwand müssen vergleichbar bewertet werden.','Subjektive Einschätzungen, keine Umsatzprognose. Vertrauen 0–1, Aufwand mindestens 0,000000001.']};}};
T.ExperimentSamplePlanner={name:'Testkompass',description:'Plant die Gruppengröße eines Tests für angenommene 20 % relative Verbesserung.',labels,example:{experiments:[{name:'Angebotsseite',control_visitors:1000,control_conversions:100}]},run(input){const samples=[];const rows=list(input,'experiments').map(row=>{const name=text(row.name,'Bezeichnung',{empty:false,limit:200}),a=arm(row,'control'),p=a.rate,target=p===null?null:p*1.2;if(!(p>0&&p<target&&target<1))return{Versuch:name,'Basisrate (%)':p===null?null:round(p*100),'Zielrate (%)':null,'Besucher je Gruppe':null,Gesamtbesucher:null,Hinweis:'Basisrate zwischen 0 % und 83,33 % erforderlich.'};const mean=(p+target)/2,n=Math.ceil(((1.959964*Math.sqrt(2*mean*(1-mean))+.841621*Math.sqrt(p*(1-p)+target*(1-target)))/(target-p))**2);if(!Number.isSafeInteger(n)||!Number.isSafeInteger(n*2))throw Error('Besucherplanung übersteigt den Rechenbereich.');samples.push(n);return{Versuch:name,'Basisrate (%)':round(p*100),'Zielrate (%)':round(target*100),'Besucher je Gruppe':n,Gesamtbesucher:n*2,Hinweis:'Ungefähre Planung für zwei gleich große Gruppen.'};});return{metrics:[{label:'Planbare Versuche',value:samples.length},{label:'Größtes Ziel je Gruppe',value:samples.length?Math.max(...samples):null,unit:'Besucher'}],rows,notes:['Normalapproximation: zwei unabhängige Anteile, zweiseitiges α = 5 %, Power = 80 %, gleiche Gruppen, angenommener relativer Lift 20 %.','Die beobachtete Basisrate ist unsicher. Planung ist eine Größenordnung, keine Erfolgsgarantie; keine Korrektur für mehrere Tests oder wiederholtes Nachschauen.']};}};
T.DecisionJournal={name:'Entscheidungsbuch',journal:true,description:'Hält Hypothesen, Maßnahmen, Erwartungen und beobachtete Ergebnisse fest.',labels,example:{decisions:[{title:'Onboarding kürzen',hypothesis:'Weniger Schritte erhöhen den Abschlussanteil.',action:'Zwei Schritte zusammenlegen.',expected_result:'Mehr Abschlüsse bei gleicher Besucherzahl.',outcome:'',status:'open'}]},run(input){const statuses={open:'Offen',learned:'Ausgewertet',discarded:'Verworfen'},count={open:0,learned:0,discarded:0};const rows=list(input,'decisions').map(row=>{const title=text(row.title,'Titel',{empty:false,limit:160});if(!Object.hasOwn(statuses,row.status))throw Error('Status muss open, learned oder discarded sein.');count[row.status]++;return{Titel:title,Hypothese:text(row.hypothesis,'Hypothese'),Maßnahme:text(row.action,'Maßnahme'),'Erwartetes Ergebnis':text(row.expected_result,'Erwartetes Ergebnis'),'Beobachtetes Ergebnis':text(row.outcome,'Beobachtetes Ergebnis'),Status:statuses[row.status]};});return{metrics:[{label:'Entscheidungen',value:rows.length},{label:'Offen',value:count.open},{label:'Ausgewertet',value:count.learned},{label:'Verworfen',value:count.discarded}],rows,notes:['Dieses eigenständige Journal ist vom SQLite-Journal der Hauptanwendung getrennt.','Änderungen speichern und regelmäßig als JSON exportieren. Browserdaten können gelöscht werden.','Statuswerte: open = offen, learned = ausgewertet, discarded = verworfen. Ergebnisse werden nicht automatisch bewertet.']};}};
})();
</script><script>(() => {
  'use strict';
  const id=document.body.dataset.tool;
  const tool=window.NeulandTools[id];
  const $=x=>document.getElementById(x);
  const copy=x=>JSON.parse(JSON.stringify(x));
  let data=copy(tool.example), readForm, receipt=null, timer;
  const common={orders:'Bestellungen',product:'Produkt',name:'Name',id:'Kennung',revenue:'Umsatz (€)',cost:'Direkte Kosten (€)',refund:'Erstattungen (€)',fees:'Gebühren (€)',quantity:'Stückzahl',cashflow:'Liquidität',cash:'Kassenbestand (€)',monthly_fixed_cost:'Monatliche Fixkosten (€)',monthly_revenue:'Monatlicher Umsatz (€)',variable_cost_rate:'Variable Kostenquote (0–1)',capacity:'Kapazität',hours_available:'Verfügbare Stunden',hours_per_order:'Stunden je Auftrag',orders_expected:'Erwartete Aufträge',experiments:'Versuche',control_visitors:'Versuche A',control_conversions:'Erfolge A',variant_visitors:'Versuche B',variant_conversions:'Erfolge B',initiatives:'Vorhaben',impact:'Wirkung',confidence:'Zuversicht (0–1)',effort:'Aufwand',claims:'Behauptungen',text:'Text',evidence_url:'Beleg-URL',verified:'Selbst geprüft',assets:'Assets',license:'Nutzungsgrundlage / Lizenz',permission:'Freigabe erfasst',expires:'Ablaufdatum (optional)',analysis_date:'Stichtag',decisions:'Entscheidungen',title:'Titel',hypothesis:'Hypothese',action:'Handlung',expected_result:'Erwartetes Ergebnis',outcome:'Beobachtetes Ergebnis',status:'Status',score:'Score',contribution:'Deckungsbeitrag',margin:'Quote',date:'Datum'};
  function label(key){return (tool.labels||{})[key]||common[key]||key.replaceAll('_',' ');}
  function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n;}
  function inform(text,bad=false){$('notice').textContent=text;$('notice').className=bad?'notice bad':'notice';$('notice').hidden=!text;}
  function invalidate(){receipt=null;$('export').disabled=true;$('results').hidden=true;}
  function control(value,key,template,level=0){
    if(level>10)throw new Error('Zu viele verschachtelte Eingaben.');
    if(Array.isArray(value)){
      const box=el('section','array');const head=el('div','array-head');head.append(el('h3','',label(key)+' · '+value.length));const list=el('div','array-list');const readers=[];
      value.forEach((item,i)=>{const row=el('div','array-item');const itemTemplate=Array.isArray(template)?template[0]:item;const widget=control(item,key,itemTemplate,level+1);row.append(widget.node);const remove=el('button','remove','Eintrag entfernen');remove.type='button';remove.onclick=()=>{try{data=readForm();let target=findArray(data,box.dataset.path);target.splice(i,1);renderForm(data);calculate();}catch(e){inform(e.message,true);}};row.append(remove);list.append(row);readers.push(widget.read);});
      const add=el('button','add','+ '+label(key)+' ergänzen');add.type='button';add.disabled=value.length>=100;add.onclick=()=>{try{data=readForm();const arr=findArray(data,box.dataset.path);const base=Array.isArray(template)&&template.length?template[0]:value[0];if(base===undefined)throw new Error('Für diesen Bereich gibt es keine Vorlage.');const fresh=copy(base);if(fresh&&typeof fresh==='object'&&typeof fresh.id==='string'){let serial=1;while(arr.some(item=>item.id===fresh.id))fresh.id='eintrag-'+serial++;}arr.push(fresh);renderForm(data);calculate();}catch(e){inform(e.message,true);}};
      head.append(add);box.append(head,list);return{node:box,read:()=>readers.map(fn=>fn()),arrayBox:box};
    }
    if(value&&typeof value==='object'){
      const group=el('div','input-group');const readers={};
      for(const[k,v]of Object.entries(value)){const widget=control(v,k,template?.[k],level+1);widget.node.dataset.field=k;group.append(widget.node);readers[k]=widget.read;}
      return{node:group,read:()=>Object.fromEntries(Object.entries(readers).map(([k,fn])=>[k,fn()]))};
    }
    const wrap=el('label','field',label(key));let input;
    if(key==='status'&&tool.journal){input=el('select');[['open','Offen'],['learned','Gelernt'],['discarded','Verworfen']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;input.append(o);});input.value=value;}
    else {input=el('input');if(typeof value==='boolean'){input.type='checkbox';input.checked=value;wrap.classList.add('boolean');}else if(typeof value==='number'){input.type='number';input.step='any';input.value=String(value);}else{input.type='text';input.value=value??'';input.maxLength=4000;}}
    input.dataset.key=key;wrap.append(input);
    return{node:wrap,read:()=>{if(input.type==='checkbox')return input.checked;if(input.type==='number'){if(input.value.trim()===''||!Number.isFinite(input.valueAsNumber))throw new Error(label(key)+': Eine gültige Zahl eingeben.');return input.valueAsNumber;}return input.value;}};
  }
  function findArray(obj,path){return JSON.parse(path).reduce((x,k)=>x[k],obj);}
  function assignPaths(node,path=[]){for(const child of node.children){if(child.classList.contains('array')){const field=child.dataset.field;const p=field===undefined?path:path.concat(field);child.dataset.path=JSON.stringify(p);const list=child.querySelector(':scope > .array-list');[...list.children].forEach((row,i)=>assignPaths(row,p.concat(i)));}else if(child.dataset.field!==undefined)assignPaths(child,path.concat(child.dataset.field));else assignPaths(child,path);}}
  function renderForm(input){const widget=control(input,'input',tool.example);$('fields').replaceChildren(widget.node);readForm=widget.read;assignPaths($('fields'));}
  function format(value,unit){if(value===null||value===undefined)return 'Nicht berechenbar';if(typeof value==='boolean')return value?'Ja':'Nein';if(typeof value==='number'){if(!Number.isFinite(value))return 'Nicht berechenbar';if(unit==='EUR'||unit==='€')return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(value);return new Intl.NumberFormat('de-DE',{maximumFractionDigits:3}).format(value)+(unit?' '+unit:'');}return String(value)+(unit?' '+unit:'');}
  function show(result){
    const metrics=el('div','metrics');for(const item of result.metrics||[]){const card=el('div','metric');card.append(el('span','metric-label',item.label),el('strong','metric-value',format(item.value,item.unit)));metrics.append(card);}$('metrics').replaceChildren(metrics);
    $('rows').replaceChildren();if(Array.isArray(result.rows)&&result.rows.length){const keys=[...new Set(result.rows.flatMap(row=>Object.keys(row)))];const table=el('table');const head=el('thead');const tr=el('tr');keys.forEach(k=>tr.append(el('th','',label(k))));head.append(tr);const tbody=el('tbody');result.rows.forEach(row=>{const r=el('tr');keys.forEach(k=>{const value=row[k];r.append(el('td','',value&&typeof value==='object'?JSON.stringify(value):format(value)));});tbody.append(r);});table.append(head,tbody);$('rows').append(table);}
    $('notes').replaceChildren();for(const text of result.notes||[])$('notes').append(el('p','',text));$('results').hidden=false;
  }
  function calculate(){clearTimeout(timer);invalidate();try{const input=readForm();const result=tool.run(input);JSON.stringify(result,(k,v)=>{if(typeof v==='number'&&!Number.isFinite(v))throw new Error('Das Ergebnis überschreitet den darstellbaren Zahlenbereich.');return v;});data=input;show(result);receipt={schema:'neuland.offline.'+id,schema_version:1,created_at:new Date().toISOString(),input:copy(input),result};$('export').disabled=false;inform('');return true;}catch(e){inform(e.message||'Eingaben prüfen.',true);return false;}}
  $('title').textContent=tool.name;document.title=tool.name+' · NEULAND';$('description').textContent=tool.description;
  $('fields').addEventListener('input',()=>{invalidate();clearTimeout(timer);timer=setTimeout(calculate,220);});$('calculate').onclick=calculate;
  $('demo').onclick=()=>{data=copy(tool.example);renderForm(data);calculate();};
  $('export').onclick=()=>{if(!receipt)return;const url=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='NEULAND_'+id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  $('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>256*1024)throw new Error('Datei zu groß: höchstens 256 KB.');const raw=JSON.parse(await file.text());if(raw.schema&&raw.schema!=='neuland.offline.'+id)throw new Error('Dieser Beleg gehört zu einem anderen Werkzeug.');const input=raw.input??raw;tool.run(input);data=copy(input);renderForm(data);calculate();inform('Datei geladen und neu berechnet.');}catch(e){inform(e.message||'Datei ungültig.',true);}finally{$('file').value='';}};
  const journalKey='neuland.offline.journal.v1';if(tool.journal){$('save').hidden=false;$('storage-note').textContent='Eigenständiges Journal. Es ist getrennt vom SQLite-Journal im Hauptdashboard.';try{const saved=localStorage.getItem(journalKey);if(saved){const input=JSON.parse(saved);tool.run(input);data=input;}}catch(e){$('storage-note').textContent+=' Browser-Speicherung nicht verfügbar; nutze JSON-Export.';}$('save').onclick=()=>{if(!calculate())return;try{localStorage.setItem(journalKey,JSON.stringify(data));inform('Journal in diesem Browser gespeichert. Zusätzlich als JSON sichern.');}catch(e){inform('Browser-Speicherung nicht verfügbar. Sichere das Journal mit JSON exportieren.',true);}};}
  renderForm(data);calculate();
})();
</script><script src="../zentrale/rueckweg.js"></script>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Eigenständiges NEULAND-Werkzeug: lokale Eingaben und sichtbare Ergebnisse ohne Installation."><title>NEULAND</title><style>*{box-sizing:border-box}:root{color-scheme:light}body{margin:0;background:#f3f4f7;color:#1d273a;font:15px/1.5 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #dde1e8;background:white;display:flex;justify-content:space-between;gap:16px;color:#60708a;font-size:12px;letter-spacing:.08em}header b{color:#1d273a}main{max-width:1360px;margin:0 auto;padding:24px}h1{font-size:32px;letter-spacing:-1px;line-height:1.1;margin:0 0 10px}h2{font-size:20px;margin:0 0 20px}h3{font-size:14px;margin:0}p{margin:8px 0}.intro{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.intro p{color:#5f6d81;max-width:76ch}.actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}button{background:white;color:#20304a;border:1px solid #cad1dd;font:inherit;font-size:13px;padding:10px 14px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){border-color:#2858ec}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94b3ff;outline-offset:2px}.primary{background:#2858ec;color:white;border-color:#2858ec}.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}.panel{background:white;border:1px solid #dde1e8;border-radius:12px;padding:24px;min-width:0}.input-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#4c5b72;min-width:0}.field input,.field select{font:15px system-ui,sans-serif;color:#24344f;border:1px solid #cbd2df;border-radius:5px;padding:10px;width:100%;min-width:0;background:white}.field.boolean{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e0e5ec;padding:8px;border-radius:5px}.field input[type=checkbox]{width:20px;height:20px;flex-shrink:0}.input-group>.input-group,.input-group>.array{grid-column:1/-1}.array{border:1px solid #dde2ea;padding:14px;border-radius:8px;margin:2px 0}.array-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.array-item{background:#f7f8fb;border:1px solid #e4e8ef;padding:14px;margin-top:10px;border-radius:6px}.array-item .remove{margin-top:10px;padding:5px 9px;color:#a54545;font-size:11px}.add{padding:6px 10px;font-size:11px}.panel-bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{border:1px solid #ccdbfb;background:#eef4ff;padding:12px;margin-bottom:16px;border-radius:7px;color:#284d8c;overflow-wrap:anywhere}.notice.bad{background:#fff2ed;border-color:#efccbb;color:#9a4625}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f1f5ff;border:1px solid #d8e2fb;padding:16px;border-radius:8px;min-width:0}.metric-label{font-size:12px;color:#5e6d85;display:block}.metric-value{font-size:23px;letter-spacing:-.6px;margin-top:7px;display:block;overflow-wrap:anywhere}.table-scroll{overflow:auto;margin-top:20px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:11px 10px;border-bottom:1px solid #e0e5ee;text-align:left;min-width:85px;overflow-wrap:anywhere}th{color:#5b6981;background:#f7f8fb;font-size:11px}#notes{font-size:12px;color:#5d6d82;margin-top:18px;overflow-wrap:anywhere}footer{font-size:12px;color:#6b788a;margin:22px 0}#storage-note{font-size:12px;color:#5c708f;margin-top:14px}[hidden]{display:none!important}@media(max-width:800px){header{padding:16px;font-size:10px}main{padding:18px 14px}.intro{display:block}h1{font-size:28px}.actions{margin-top:14px}.workspace{grid-template-columns:1fr}.panel{padding:18px}.metric-value{font-size:21px}.input-group{gap:10px}.array{padding:10px}.array-item{padding:10px}.array-head{align-items:start}.table-scroll{max-width:calc(100vw - 66px)}}@media print{body{background:white}.editor,.actions,.panel-bottom,header{display:none}.workspace{display:block}.panel{border:0}main{padding:0}.table-scroll{overflow:visible}}
</style></head><body data-tool="FeeDetective"><header><b>NEULAND / EINZELWERKZEUG</b><span>LOKAL AUF DEINEM GERÄT</span></header><main><div class="intro"><div><h1 id="title"></h1><p id="description"></p></div><div class="actions"><button id="demo" type="button">Beispiel laden</button><button id="import" type="button">JSON öffnen</button><button id="export" type="button" disabled>JSON exportieren</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><div class="workspace"><section class="panel editor"><h2>Deine Eingaben</h2><div id="fields"></div><div class="panel-bottom"><button class="primary" id="calculate" type="button">Neu berechnen</button><button id="save" type="button" hidden>Journal speichern</button></div><p id="storage-note"></p></section><section class="panel"><h2>Dein Ergebnis</h2><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="results" hidden><div id="metrics"></div><div class="table-scroll" id="rows"></div><div id="notes"></div></div></section></div><footer>Beispieldaten sind synthetisch. Ersetze sie durch eigene Werte. Der JSON-Export sichert Eingaben und Ergebnis; diese Datei ist unabhängig vom Datenbankbestand des Hauptdashboards.</footer></main><script>(() => {
'use strict';const T=window.NeulandTools||={};const MAX=1e12;
const obj=x=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Ein Objekt ist erforderlich.');return x;};
function num(x,label,{max=MAX,positive=false,integer=false,min=0}={}){if(typeof x!=='number'||!Number.isFinite(x)||x<min||x>max||(positive&&x<=0)||(integer&&!Number.isInteger(x)))throw Error(label+': Endliche '+(integer?'ganze ':'')+'Zahl zwischen '+min+' und '+max+(positive?', größer als 0':'')+' erforderlich.');return x;}
const round=(x,p=2)=>x===null||!Number.isFinite(x)?null:Number(x.toFixed(p));const ratio=(a,b,f=1)=>b>0?round(a/b*f):null;const m=(label,value,unit='')=>({label,value,unit});
function orders(input,fields){obj(input);if(!Array.isArray(input.orders)||input.orders.length>100)throw Error('Aufträge: Liste mit höchstens 100 Einträgen erforderlich.');return input.orders.map(raw=>{obj(raw);if(typeof raw.product!=='string'||!raw.product.trim()||raw.product.length>200)throw Error('Produkt: Name mit 1 bis 200 Zeichen erforderlich.');const r={product:raw.product.trim()};fields.forEach(k=>r[k]=num(raw[k],k,{integer:k==='quantity',positive:k==='quantity'}));return r;});}
function flow(input){obj(input);return{cash:num(input.cash,'Geldbestand'),monthly_fixed_cost:num(input.monthly_fixed_cost,'Fixkosten'),monthly_revenue:num(input.monthly_revenue,'Umsatz'),variable_cost_rate:num(input.variable_cost_rate,'Variabler Kostenanteil',{max:1})};}
const cash={cash:6000,monthly_fixed_cost:2500,monthly_revenue:2000,variable_cost_rate:.25};
const labels={cash:'Geldbestand (€)',monthly_fixed_cost:'Monatliche Fixkosten (€)',monthly_revenue:'Monatlicher Umsatz (€)',variable_cost_rate:'Variabler Kostenanteil (0–1)',orders:'Aufträge',product:'Produkt',revenue:'Gesamter Auftragsumsatz (€)',cost:'Gesamte Auftragskosten (€)',fees:'Auftragsgebühren (€)',refund:'Auftragserstattungen (€)',quantity:'Stückzahl'};
const sample=[{product:'Werkzeugpaket',revenue:100,cost:30,fees:5,refund:10,quantity:2},{product:'Beratung',revenue:200,cost:100,fees:10,refund:0,quantity:1}];
const cashNotes=['Ein gemeinsamer Zeitraum; Umsatz wird als Zahlungseingang behandelt. Fixkosten und variabler Kostenanteil bleiben konstant.','Szenariorechnung: Zahlungstermine, Finanzierung und weitere Kosten sind nur enthalten, wenn sie erfasst wurden.','Ohne Geldabfluss gibt es keine endliche Reichweite. Unbekannt ist keine gemessene Null.'];
T.ProfitLeaks={name:'Gewinnspur',description:'Berechnet Deckungsbeiträge aus deinen Auftragssummen und zeigt Verlustaufträge.',labels,example:{orders:sample},run(input){const a=orders(input,['revenue','cost','fees','refund','quantity']);const sums={revenue:0,cost:0,fees:0,refund:0,quantity:0};let loss=0,negative=0;const products=new Map();a.forEach(x=>{Object.keys(sums).forEach(k=>sums[k]+=x[k]);const db=x.revenue-x.refund-x.cost-x.fees;if(db<0){negative++;loss-=db;}if(!products.has(x.product))products.set(x.product,{product:x.product,revenue:0,cost:0,fees:0,refund:0,quantity:0,count:0});const p=products.get(x.product);p.count++;Object.keys(sums).forEach(k=>p[k]+=x[k]);});const net=sums.revenue-sums.refund,db=net-sums.cost-sums.fees;const rows=[...products.values()].map(p=>({Produkt:p.product,Aufträge:p.count,Stückzahl:p.quantity,'Umsatz €':round(p.revenue),'Erstattung €':round(p.refund),'Kosten €':round(p.cost),'Gebühren €':round(p.fees),'Deckungsbeitrag €':round(p.revenue-p.refund-p.cost-p.fees),'Marge %':ratio(p.revenue-p.refund-p.cost-p.fees,p.revenue-p.refund,100)}));return{metrics:[m('Aufträge',a.length),m('Stückzahl',sums.quantity),m('Umsatz',round(sums.revenue),'EUR'),m('Nettoumsatz',round(net),'EUR'),m('Deckungsbeitrag',round(db),'EUR'),m('Gewichtete Marge',ratio(db,net,100),'%'),m('Verlustsumme negativer Aufträge',round(loss),'EUR'),m('Verlustaufträge',negative)],rows,notes:['Deckungsbeitrag = Umsatz − Erstattungen − Kosten − Gebühren. Stückzahlen multiplizieren keine Auftragssummen.','Marge aus Gesamtsummen, bei Nettoumsatz ≤ 0 nicht berechenbar. Fixkosten sind nicht separat enthalten.',...(a.some(x=>x.refund>x.revenue)?['Eine Erstattung übersteigt den Auftragsumsatz; Zuordnung prüfen.']:[]),...(!a.length?['Keine Aufträge: Summen der leeren Liste sind 0; kein Nachweis für ein Geschäft ohne Kosten.']:[])]};}};
T.RunwayRadar={name:'PufferPilot',description:'Vergleicht Geldabfluss und rechnerische Reichweite in drei Umsatzszenarien.',labels,example:cash,run(input){const x=flow(input);const rows=[.8,1,1.2].map(f=>{const revenue=x.monthly_revenue*f,change=revenue*(1-x.variable_cost_rate)-x.monthly_fixed_cost,burn=Math.max(0,-change);return{Szenario:f===1?'Basis':f===.8?'Umsatz −20 %':'Umsatz +20 %','Umsatz €/Monat':round(revenue),'Geldänderung €/Monat':round(change),'Abfluss €/Monat':round(burn),'Reichweite Monate':burn>0?ratio(x.cash,burn):null,'Geld nach 12 Monaten €':round(x.cash+12*change),Einordnung:burn>0?'Geldabfluss':'Kein laufender Geldabfluss im Modell'};});const b=rows[1];return{metrics:[m('Verfügbares Geld',x.cash,'EUR'),m('Geldänderung pro Monat',b['Geldänderung €/Monat'],'EUR'),m('Monatlicher Abfluss',b['Abfluss €/Monat'],'EUR'),m('Reichweite im Basismodell',b['Reichweite Monate'],'Monate'),m('Geld nach 12 Monaten',b['Geld nach 12 Monaten €'],'EUR')],rows,notes:cashNotes};}};
function fraction(n){const parts=String(n).toLowerCase().split('e'),exp=parts[1]?Number(parts[1]):0,point=parts[0].indexOf('.'),decimals=point<0?0:parts[0].length-point-1,digits=BigInt(parts[0].replace('.','')),power=exp-decimals;return power>=0?[digits*10n**BigInt(power),1n]:[digits,10n**BigInt(-power)];}
function whole(h,d){const[hn,hd]=fraction(h),[dn,dd]=fraction(d);return Number(hn*dd/(hd*dn));}
T.CapacityTwin={name:'Kapazitätszwilling',description:'Vergleicht verfügbare Arbeitszeit mit dem Zeitbedarf deiner Aufträge.',labels,example:{hours_available:80,hours_per_order:2,orders_expected:50},run(input){obj(input);const h=num(input.hours_available,'Verfügbare Stunden'),d=num(input.hours_per_order,'Stunden je Auftrag',{min:1e-9,positive:true}),q=num(input.orders_expected,'Aufträge',{integer:true}),capacity=whole(h,d),required=q*d;return{metrics:[m('Ganze Aufträge möglich',capacity),m('Benötigte Stunden',round(required),'h'),m('Freie Stunden',round(Math.max(0,h-required)),'h'),m('Fehlende Stunden',round(Math.max(0,required-h)),'h'),m('Fehlende Auftragskapazität',Math.max(0,q-capacity)),m('Auslastung',ratio(required,h,100),'%')],rows:[['Basis',h,d],['20 % mehr Zeit',h*1.2,d],['20 % weniger Zeit je Auftrag',h,d*.8]].map(([Szenario,Stunden,Zeit])=>({Szenario,Stunden:round(Stunden),'Stunden je Auftrag':round(Zeit,10),'Ganze Aufträge':whole(Stunden,Zeit),'Fehlende Auftragskapazität':Math.max(0,q-whole(Stunden,Zeit))})),notes:['Kapazität = verfügbare Stunden / Stunden je Auftrag, abgerundet. Auslastung = benötigte / verfügbare Stunden.','Gleichartige Aufträge und verfügbare Arbeitszeit angenommen. Material, Rüstzeiten und Qualifikationen fehlen.',...(capacity>Number.MAX_SAFE_INTEGER?['Extrem große Kapazität wird gerundet dargestellt; praktisch nutzbare Zeiteinheiten verwenden.']:[])]};}};
T.BreakEvenMap={name:'Schwellenkarte',description:'Berechnet den Monatsumsatz, der deine Fixkosten im Modell deckt.',labels,example:{monthly_fixed_cost:3000,monthly_revenue:5000,variable_cost_rate:.4},run(input){obj(input);const f=num(input.monthly_fixed_cost,'Fixkosten'),r=num(input.monthly_revenue,'Umsatz'),v=num(input.variable_cost_rate,'Variabler Kostenanteil',{max:1}),share=1-v,threshold=share>0?ratio(f,share):f===0?0:null;return{metrics:[m('Deckungsbeitragsanteil',round(share*100),'%'),m('Umsatzschwelle pro Monat',threshold,'EUR'),m('Abstand zur Schwelle',threshold===null?null:round(r-threshold),'EUR'),m('Modellüberschuss pro Monat',round(r*share-f),'EUR')],notes:['Umsatzschwelle = Fixkosten / (1 − variabler Kostenanteil).','Bei 100 % variablen Kosten und positiven Fixkosten gibt es keine endliche Schwelle; bei 0 Fixkosten beträgt sie 0 €.','Kostenrechnung, keine Umsatzprognose. Weitere Kosten müssen in den Eingaben enthalten sein.']};}};
T.ConcentrationWatch={name:'Abhängigkeitslupe',description:'Zeigt, wie stark sich erfasster Umsatz auf einzelne Produkte konzentriert.',labels,example:{orders:[{product:'Produkt A',revenue:75},{product:'Produkt B',revenue:25}]},run(input){const a=orders(input,['revenue']),p=new Map();let total=0;a.forEach(x=>{total+=x.revenue;p.set(x.product,(p.get(x.product)||0)+x.revenue);});const sorted=[...p].sort((a,b)=>b[1]-a[1]);return{metrics:[m('Produkte',p.size),m('Erfasster Umsatz',round(total),'EUR'),m('Größter Umsatzanteil',sorted.length?ratio(sorted[0][1],total,100):null,'%'),m('Konzentrationsindex HHI',total>0?round(sorted.reduce((s,x)=>s+(x[1]/total)**2,0)*10000):null,'Punkte')],rows:sorted.map(([Produkt,Umsatz])=>({Produkt,'Umsatz €':round(Umsatz),'Umsatzanteil %':ratio(Umsatz,total,100)})),notes:['HHI = Summe quadrierter Produkt-Umsatzanteile × 10.000. Ein Produkt ergibt 10.000 Punkte.','Bei Gesamtumsatz 0 sind Anteile und HHI unbekannt. Der Index beschreibt deinen Produktbestand, keine gesamten Märkte oder Kundenkonzentration.']};}};
T.FeeDetective={name:'Gebührenspur',description:'Berechnet die gewichtete Gebührenquote deiner Aufträge.',labels,example:{orders:[{product:'Produkt A',revenue:100,fees:10},{product:'Produkt B',revenue:900,fees:0}]},run(input){const a=orders(input,['revenue','fees']),r=a.reduce((s,x)=>s+x.revenue,0),f=a.reduce((s,x)=>s+x.fees,0);return{metrics:[m('Gebühren gesamt',round(f),'EUR'),m('Gewichtete Gebührenquote',ratio(f,r,100),'%'),m('Aufträge mit Gebühren',a.filter(x=>x.fees>0).length)],rows:a.map((x,i)=>({Auftrag:i+1,Produkt:x.product,'Umsatz €':x.revenue,'Gebühren €':x.fees,'Gebührenquote %':ratio(x.fees,x.revenue,100)})),notes:['Gewichtete Quote = Gebühren gesamt / Umsatz gesamt × 100. Einzelquoten werden nicht gemittelt.','Bei Umsatz 0 ist die Quote nicht berechenbar. Anbieterpreise werden nicht abgerufen.']};}};
T.ReturnPatternMap={name:'Rückflusskarte',description:'Zeigt den erfassten Erstattungsanteil und die höchsten Erstattungsbeträge.',labels,example:{orders:[{product:'Produkt A',revenue:100,refund:20},{product:'Produkt B',revenue:900,refund:0}]},run(input){const a=orders(input,['revenue','refund']),r=a.reduce((s,x)=>s+x.revenue,0),f=a.reduce((s,x)=>s+x.refund,0),returned=a.map((x,i)=>({...x,order:i+1})).filter(x=>x.refund>0).sort((a,b)=>b.refund-a.refund);return{metrics:[m('Erstattungen gesamt',round(f),'EUR'),m('Erstattungsanteil am Umsatz',ratio(f,r,100),'%'),m('Aufträge mit Erstattung',returned.length)],rows:returned.map(x=>({Auftrag:x.order,Produkt:x.product,'Umsatz €':x.revenue,'Erstattung €':x.refund,'Erstattungsanteil %':ratio(x.refund,x.revenue,100)})),notes:['Quote = Erstattungen / ursprünglicher Auftragsumsatz × 100. Bei Umsatz 0 nicht berechenbar.','Ohne Erstattungsgründe lassen sich Ursachen nicht ableiten. Es werden keine Rückzahlungen ausgeführt.',...(a.some(x=>x.refund>x.revenue)?['Eine Erstattung übersteigt den Umsatz; Zuordnung prüfen.']:[])]};}};
T.StressMatrix={name:'Stresstableau',description:'Vergleicht neun Umsatz- und Fixkostenszenarien.',labels,example:cash,run(input){const x=flow(input),rows=[];for(const r of [.8,1,1.2])for(const f of [.9,1,1.1]){const change=x.monthly_revenue*r*(1-x.variable_cost_rate)-x.monthly_fixed_cost*f;rows.push({'Umsatzniveau %':round(r*100),'Fixkostenniveau %':round(f*100),'Geldänderung €/Monat':round(change),'Reichweite Monate':change<0?ratio(x.cash,-change):null,Einordnung:change<0?'Geldabfluss':'Kein laufender Geldabfluss im Modell'});}return{metrics:[m('Szenarien',9),m('Niedrigster Modellüberschuss',round(x.monthly_revenue*.8*(1-x.variable_cost_rate)-x.monthly_fixed_cost*1.1),'EUR'),m('Höchster Modellüberschuss',round(x.monthly_revenue*1.2*(1-x.variable_cost_rate)-x.monthly_fixed_cost*.9),'EUR')],rows,notes:['Umsatz 80/100/120 %, Fixkosten 90/100/110 %. Der variable Kostenanteil bleibt gleich.','Was-wäre-wenn-Rechnung, keine Vorhersage. Ohne Abfluss gibt es keine endliche Reichweite.']};}};
})();
</script><script>(() => {
  'use strict';
  const id=document.body.dataset.tool;
  const tool=window.NeulandTools[id];
  const $=x=>document.getElementById(x);
  const copy=x=>JSON.parse(JSON.stringify(x));
  let data=copy(tool.example), readForm, receipt=null, timer;
  const common={orders:'Bestellungen',product:'Produkt',name:'Name',id:'Kennung',revenue:'Umsatz (€)',cost:'Direkte Kosten (€)',refund:'Erstattungen (€)',fees:'Gebühren (€)',quantity:'Stückzahl',cashflow:'Liquidität',cash:'Kassenbestand (€)',monthly_fixed_cost:'Monatliche Fixkosten (€)',monthly_revenue:'Monatlicher Umsatz (€)',variable_cost_rate:'Variable Kostenquote (0–1)',capacity:'Kapazität',hours_available:'Verfügbare Stunden',hours_per_order:'Stunden je Auftrag',orders_expected:'Erwartete Aufträge',experiments:'Versuche',control_visitors:'Versuche A',control_conversions:'Erfolge A',variant_visitors:'Versuche B',variant_conversions:'Erfolge B',initiatives:'Vorhaben',impact:'Wirkung',confidence:'Zuversicht (0–1)',effort:'Aufwand',claims:'Behauptungen',text:'Text',evidence_url:'Beleg-URL',verified:'Selbst geprüft',assets:'Assets',license:'Nutzungsgrundlage / Lizenz',permission:'Freigabe erfasst',expires:'Ablaufdatum (optional)',analysis_date:'Stichtag',decisions:'Entscheidungen',title:'Titel',hypothesis:'Hypothese',action:'Handlung',expected_result:'Erwartetes Ergebnis',outcome:'Beobachtetes Ergebnis',status:'Status',score:'Score',contribution:'Deckungsbeitrag',margin:'Quote',date:'Datum'};
  function label(key){return (tool.labels||{})[key]||common[key]||key.replaceAll('_',' ');}
  function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n;}
  function inform(text,bad=false){$('notice').textContent=text;$('notice').className=bad?'notice bad':'notice';$('notice').hidden=!text;}
  function invalidate(){receipt=null;$('export').disabled=true;$('results').hidden=true;}
  function control(value,key,template,level=0){
    if(level>10)throw new Error('Zu viele verschachtelte Eingaben.');
    if(Array.isArray(value)){
      const box=el('section','array');const head=el('div','array-head');head.append(el('h3','',label(key)+' · '+value.length));const list=el('div','array-list');const readers=[];
      value.forEach((item,i)=>{const row=el('div','array-item');const itemTemplate=Array.isArray(template)?template[0]:item;const widget=control(item,key,itemTemplate,level+1);row.append(widget.node);const remove=el('button','remove','Eintrag entfernen');remove.type='button';remove.onclick=()=>{try{data=readForm();let target=findArray(data,box.dataset.path);target.splice(i,1);renderForm(data);calculate();}catch(e){inform(e.message,true);}};row.append(remove);list.append(row);readers.push(widget.read);});
      const add=el('button','add','+ '+label(key)+' ergänzen');add.type='button';add.disabled=value.length>=100;add.onclick=()=>{try{data=readForm();const arr=findArray(data,box.dataset.path);const base=Array.isArray(template)&&template.length?template[0]:value[0];if(base===undefined)throw new Error('Für diesen Bereich gibt es keine Vorlage.');const fresh=copy(base);if(fresh&&typeof fresh==='object'&&typeof fresh.id==='string'){let serial=1;while(arr.some(item=>item.id===fresh.id))fresh.id='eintrag-'+serial++;}arr.push(fresh);renderForm(data);calculate();}catch(e){inform(e.message,true);}};
      head.append(add);box.append(head,list);return{node:box,read:()=>readers.map(fn=>fn()),arrayBox:box};
    }
    if(value&&typeof value==='object'){
      const group=el('div','input-group');const readers={};
      for(const[k,v]of Object.entries(value)){const widget=control(v,k,template?.[k],level+1);widget.node.dataset.field=k;group.append(widget.node);readers[k]=widget.read;}
      return{node:group,read:()=>Object.fromEntries(Object.entries(readers).map(([k,fn])=>[k,fn()]))};
    }
    const wrap=el('label','field',label(key));let input;
    if(key==='status'&&tool.journal){input=el('select');[['open','Offen'],['learned','Gelernt'],['discarded','Verworfen']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;input.append(o);});input.value=value;}
    else {input=el('input');if(typeof value==='boolean'){input.type='checkbox';input.checked=value;wrap.classList.add('boolean');}else if(typeof value==='number'){input.type='number';input.step='any';input.value=String(value);}else{input.type='text';input.value=value??'';input.maxLength=4000;}}
    input.dataset.key=key;wrap.append(input);
    return{node:wrap,read:()=>{if(input.type==='checkbox')return input.checked;if(input.type==='number'){if(input.value.trim()===''||!Number.isFinite(input.valueAsNumber))throw new Error(label(key)+': Eine gültige Zahl eingeben.');return input.valueAsNumber;}return input.value;}};
  }
  function findArray(obj,path){return JSON.parse(path).reduce((x,k)=>x[k],obj);}
  function assignPaths(node,path=[]){for(const child of node.children){if(child.classList.contains('array')){const field=child.dataset.field;const p=field===undefined?path:path.concat(field);child.dataset.path=JSON.stringify(p);const list=child.querySelector(':scope > .array-list');[...list.children].forEach((row,i)=>assignPaths(row,p.concat(i)));}else if(child.dataset.field!==undefined)assignPaths(child,path.concat(child.dataset.field));else assignPaths(child,path);}}
  function renderForm(input){const widget=control(input,'input',tool.example);$('fields').replaceChildren(widget.node);readForm=widget.read;assignPaths($('fields'));}
  function format(value,unit){if(value===null||value===undefined)return 'Nicht berechenbar';if(typeof value==='boolean')return value?'Ja':'Nein';if(typeof value==='number'){if(!Number.isFinite(value))return 'Nicht berechenbar';if(unit==='EUR'||unit==='€')return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(value);return new Intl.NumberFormat('de-DE',{maximumFractionDigits:3}).format(value)+(unit?' '+unit:'');}return String(value)+(unit?' '+unit:'');}
  function show(result){
    const metrics=el('div','metrics');for(const item of result.metrics||[]){const card=el('div','metric');card.append(el('span','metric-label',item.label),el('strong','metric-value',format(item.value,item.unit)));metrics.append(card);}$('metrics').replaceChildren(metrics);
    $('rows').replaceChildren();if(Array.isArray(result.rows)&&result.rows.length){const keys=[...new Set(result.rows.flatMap(row=>Object.keys(row)))];const table=el('table');const head=el('thead');const tr=el('tr');keys.forEach(k=>tr.append(el('th','',label(k))));head.append(tr);const tbody=el('tbody');result.rows.forEach(row=>{const r=el('tr');keys.forEach(k=>{const value=row[k];r.append(el('td','',value&&typeof value==='object'?JSON.stringify(value):format(value)));});tbody.append(r);});table.append(head,tbody);$('rows').append(table);}
    $('notes').replaceChildren();for(const text of result.notes||[])$('notes').append(el('p','',text));$('results').hidden=false;
  }
  function calculate(){clearTimeout(timer);invalidate();try{const input=readForm();const result=tool.run(input);JSON.stringify(result,(k,v)=>{if(typeof v==='number'&&!Number.isFinite(v))throw new Error('Das Ergebnis überschreitet den darstellbaren Zahlenbereich.');return v;});data=input;show(result);receipt={schema:'neuland.offline.'+id,schema_version:1,created_at:new Date().toISOString(),input:copy(input),result};$('export').disabled=false;inform('');return true;}catch(e){inform(e.message||'Eingaben prüfen.',true);return false;}}
  $('title').textContent=tool.name;document.title=tool.name+' · NEULAND';$('description').textContent=tool.description;
  $('fields').addEventListener('input',()=>{invalidate();clearTimeout(timer);timer=setTimeout(calculate,220);});$('calculate').onclick=calculate;
  $('demo').onclick=()=>{data=copy(tool.example);renderForm(data);calculate();};
  $('export').onclick=()=>{if(!receipt)return;const url=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='NEULAND_'+id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  $('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>256*1024)throw new Error('Datei zu groß: höchstens 256 KB.');const raw=JSON.parse(await file.text());if(raw.schema&&raw.schema!=='neuland.offline.'+id)throw new Error('Dieser Beleg gehört zu einem anderen Werkzeug.');const input=raw.input??raw;tool.run(input);data=copy(input);renderForm(data);calculate();inform('Datei geladen und neu berechnet.');}catch(e){inform(e.message||'Datei ungültig.',true);}finally{$('file').value='';}};
  const journalKey='neuland.offline.journal.v1';if(tool.journal){$('save').hidden=false;$('storage-note').textContent='Eigenständiges Journal. Es ist getrennt vom SQLite-Journal im Hauptdashboard.';try{const saved=localStorage.getItem(journalKey);if(saved){const input=JSON.parse(saved);tool.run(input);data=input;}}catch(e){$('storage-note').textContent+=' Browser-Speicherung nicht verfügbar; nutze JSON-Export.';}$('save').onclick=()=>{if(!calculate())return;try{localStorage.setItem(journalKey,JSON.stringify(data));inform('Journal in diesem Browser gespeichert. Zusätzlich als JSON sichern.');}catch(e){inform('Browser-Speicherung nicht verfügbar. Sichere das Journal mit JSON exportieren.',true);}};}
  renderForm(data);calculate();
})();
</script><script src="../zentrale/rueckweg.js"></script>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Eigenständiges NEULAND-Werkzeug: lokale Eingaben und sichtbare Ergebnisse ohne Installation."><title>NEULAND</title><style>*{box-sizing:border-box}:root{color-scheme:light}body{margin:0;background:#f3f4f7;color:#1d273a;font:15px/1.5 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #dde1e8;background:white;display:flex;justify-content:space-between;gap:16px;color:#60708a;font-size:12px;letter-spacing:.08em}header b{color:#1d273a}main{max-width:1360px;margin:0 auto;padding:24px}h1{font-size:32px;letter-spacing:-1px;line-height:1.1;margin:0 0 10px}h2{font-size:20px;margin:0 0 20px}h3{font-size:14px;margin:0}p{margin:8px 0}.intro{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.intro p{color:#5f6d81;max-width:76ch}.actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}button{background:white;color:#20304a;border:1px solid #cad1dd;font:inherit;font-size:13px;padding:10px 14px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){border-color:#2858ec}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94b3ff;outline-offset:2px}.primary{background:#2858ec;color:white;border-color:#2858ec}.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}.panel{background:white;border:1px solid #dde1e8;border-radius:12px;padding:24px;min-width:0}.input-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#4c5b72;min-width:0}.field input,.field select{font:15px system-ui,sans-serif;color:#24344f;border:1px solid #cbd2df;border-radius:5px;padding:10px;width:100%;min-width:0;background:white}.field.boolean{flex-direction:row;align-items </style></head><body data-tool="EvidenceDebt"><header><b>NEULAND / EINZELWERKZEUG</b><span>LOKAL AUF DEINEM GERÄT</span></header><main><div class="intro"><div><h1 id="title"></h1><p id="description"></p></div><div class="actions"><button id="demo" type="button">Beispiel laden</button><button id="import" type="button">JSON öffnen</button><button id="export" type="button" disabled>JSON exportieren</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><div class="workspace"><section class="panel editor"><h2>Deine Eingaben</h2><div id="fields"></div><div class="panel-bottom"><button class="primary" id="calculate" type="button">Neu berechnen</button><button id="save" type="button" hidden>Journal speichern</button></div><p id="storage-note"></p></section><section class="panel"><h2>Dein Ergebnis</h2><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="results" hidden><div id="metrics"></div><div class="table-scroll" id="rows"></div><div id="notes"></div></div></section></div><footer>Beispieldaten sind synthetisch. Ersetze sie durch eigene Werte. Der JSON-Export sichert Eingaben und Ergebnis; diese Datei ist unabhängig vom Datenbankbestand des Hauptdashboards.</footer></main><script>(() => {
'use strict';const T=window.NeulandTools||={};const MAX=1e12;
const labels={claims:'Aussagen',text:'Aussage',evidence_url:'Beleglink (optional)',verified:'Von dir geprüft',assets:'Verwendete Inhalte',name:'Name',license:'Lizenz / Nutzungsgrundlage',permission:'Freigabe dokumentiert',expires:'Ablaufdatum (JJJJ-MM-TT, optional)',analysis_date:'Prüftag (JJJJ-MM-TT)'};
const error=s=>{throw Error(s);};function object(x,label='Eingabe'){if(!x||typeof x!=='object'||Array.isArray(x))error(label+': Objekt erwartet.');return x;}
function guard(x,path='Eingabe',depth=0){if(depth>12)error('Zu tief verschachtelt.');if(typeof x==='number'&&(!Number.isFinite(x)||Math.abs(x)>MAX))error(path+': Endliche Zahl bis 1 Billion erforderlich.');if(typeof x==='string'&&(x.length>2048||/[\u0000-\u001f\u007f-\u009f]/.test(x)))error(path+': Text ist zu lang oder enthält Steuerzeichen.');if(Array.isArray(x)){if(x.length>100)error(path+': Höchstens 100 Einträge erlaubt.');x.forEach((v,i)=>guard(v,path+'['+i+']',depth+1));}else if(x&&typeof x==='object'){if(Object.keys(x).length>100)error('Zu viele Felder.');Object.keys(x).forEach(k=>guard(x[k],path+'.'+k,depth+1));}}
function input(x){object(x);guard(x);return x;}function rows(x,key){if(x[key]==null)return[];if(!Array.isArray(x[key]))error(key+': Liste erwartet.');return x[key].map(v=>object(v,key));}
function text(x,label){if(x==null)return'';if(typeof x!=='string')error(label+': Text erwartet.');return x.trim();}function bool(x,label){if(x==null)return false;if(typeof x!=='boolean')error(label+': Ja/Nein erwartet.');return x;}
function urlValid(x){if(!x||/\s/.test(x)||!/^https?:\/\//i.test(x))return false;try{const u=new URL(x);return['http:','https:'].includes(u.protocol)&&!!u.hostname&&!u.username&&!u.password;}catch(e){return false;}}
function day(x,label){if(typeof x!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x))error(label+': Gültiges Datum JJJJ-MM-TT erforderlich.');const[y,m,d]=x.split('-').map(Number),v=new Date(0);v.setUTCFullYear(y,m-1,d);v.setUTCHours(0,0,0,0);if(y<1||v.getUTCFullYear()!==y||v.getUTCMonth()!==m-1||v.getUTCDate()!==d)error(label+': Gültiges Kalenderdatum erforderlich.');return v.getTime()/86400000;}
const pct=(a,b)=>b?Math.round(a/b*10000)/100:null;const metric=(label,value,unit='')=>({label,value,unit});
function claims(x){const a=rows(x,'claims').map((r,i)=>{const statement=text(r.text,'Aussage'),evidence=text(r.evidence_url,'Beleglink'),verified=bool(r.verified,'Prüfmarkierung'),quality=statement?[]:['Aussage fehlt.'],issues=[...quality];if(!evidence)issues.push('Beleglink fehlt.');else if(!urlValid(evidence))issues.push('Gültige HTTP-/HTTPS-Adresse ohne Zugangsdaten erforderlich.');if(!verified)issues.push('Menschliche Prüfung ausstehend.');return{text:statement,evidence_url:evidence,verified,quality,issues,ready:!issues.length,index:i+1};});return{list:a,ready:a.filter(x=>x.ready).length};}
function assets(x){const today=day(x.analysis_date,'Prüftag'),a=rows(x,'assets').map((r,i)=>{const name=text(r.name,'Name')||'Asset '+(i+1),license=text(r.license,'Lizenz'),permission=bool(r.permission,'Freigabe'),expires=text(r.expires,'Ablaufdatum'),remaining=expires?day(expires,'Ablaufdatum')-today:null,issues=[];if(!license||['unknown','unbekannt','tbd','?'].includes(license.toLowerCase()))issues.push('Nutzungsgrundlage fehlt.');if(!permission)issues.push('Freigabe nicht dokumentiert.');let status;if(remaining!==null&&remaining<0){issues.push('Freigabe abgelaufen.');status='Abgelaufen';}else if(remaining!==null&&remaining<=30){status=issues.length?'Prüfung offen':'Läuft bald ab';issues.push('Läuft in '+remaining+' Tagen ab; Verlängerung prüfen.');}else status=issues.length?'Prüfung offen':'Dokumentation vollständig';return{name,license,permission,expires,remaining,issues,status,ready:!issues.length};});return{list:a,ready:a.filter(x=>x.ready).length};}
const claimExample={claims:[{text:'Das Paket enthält 30 Checklisten.',evidence_url:'https://example.com/umfang',verified:true},{text:'Alle Kunden verdoppeln ihren Umsatz.',evidence_url:'',verified:false}]};
const assetExample={analysis_date:'2026-10-02',assets:[{name:'Teamfoto',license:'Freigabe für eigene Website',permission:true,expires:'2026-12-31'},{name:'Kampagnenmusik',license:'Befristete Lizenz',permission:true,expires:'2026-10-20'},{name:'Stockbild',license:'',permission:false,expires:''}]};
T.PromiseCheck={name:'Belegprobe',description:'Findet fehlende Beleglinks und offene eigene Prüfmarkierungen.',labels,example:claimExample,run(raw){const r=claims(input(raw));return{metrics:[metric('Aussagen',r.list.length),metric('Prüfung offen',r.list.length-r.ready),metric('Prüfliste erfüllt',r.ready)],rows:r.list.map(x=>({Aussage:x.text,Beleglink:x.evidence_url||'Fehlt','Von dir geprüft':x.verified?'Ja':'Nein',Status:x.ready?'Prüfliste erfüllt':'Prüfung offen',Hinweise:x.issues.join(' ')||'Keine offenen Prüfpunkte.'})),notes:['Beleglinks werden nicht abgerufen. Die Markierung dokumentiert deine eigene Prüfung; Inhalt und Rechtswirksamkeit werden nicht bestätigt.']};}};
T.RightsLedger={name:'Rechtebuch',description:'Findet offene Nutzungsgrundlagen, fehlende Freigaben und erfasste Ablauffristen.',labels,example:assetExample,run(raw){const r=assets(input(raw));return{metrics:[metric('Inhalte',r.list.length),metric('Prüfung offen',r.list.length-r.ready),metric('Dokumentation vollständig',r.ready)],rows:r.list.map(x=>({Inhalt:x.name,Lizenz:x.license||'Fehlt',Freigabe:x.permission?'Erfasst':'Fehlt',Ablauf:x.expires||'Keine Frist erfasst',Resttage:x.remaining,Status:x.status,Hinweise:x.issues.join(' ')||'Keine offenen Prüfpunkte.'})),notes:['Dokumentationsprüfung: Bedingungen, Einsatzgebiet und Belege müssen menschlich geprüft werden. Keine Frist bedeutet keine unbefristete Berechtigung.']};}};
T.EvidenceDebt={name:'Belegschulden',description:'Zeigt Quellenabdeckung und Prüfmarkierungen ohne Quellenverweis.',labels,example:claimExample,run(raw){const r=claims(input(raw)),s=r.list.filter(x=>!!x.evidence_url),u=r.list.filter(x=>x.verified&&!x.evidence_url);return{metrics:[metric('Aussagen mit Quellenverweis',s.length),metric('Quellenabdeckung',pct(s.length,r.list.length),'%'),metric('Als geprüft markiert ohne Quelle',u.length)],rows:r.list.map(x=>({Aussage:x.text,Quellenverweis:x.evidence_url||'Fehlt','Prüfmarkierung ohne Quelle':x.verified&&!x.evidence_url?'Ja':'Nein',Linkformat:!x.evidence_url?'Fehlt':urlValid(x.evidence_url)?'HTTP/HTTPS ohne Zugangsdaten':'Ungültig — prüfen'})),notes:['Abdeckung zählt jeden nichtleeren Verweis. Format, Inhalt und Richtigkeit werden getrennt geprüft; kein Quellenabruf.']};}};
T.RenewalCalendar={name:'Rechtekalender',description:'Zeigt vergangene Ablauffristen und Fälligkeiten innerhalb von 30 Tagen.',labels,example:assetExample,run(raw){const r=assets(input(raw)),expired=r.list.filter(x=>x.remaining!==null&&x.remaining<0),soon=r.list.filter(x=>x.remaining!==null&&x.remaining>=0&&x.remaining<=30);return{metrics:[metric('Abgelaufen',expired.length),metric('Fällig in 30 Tagen',soon.length),metric('Prüftag',raw.analysis_date)],rows:[...expired,...soon].map(x=>({Inhalt:x.name,Ablaufdatum:x.expires,Resttage:x.remaining,Status:x.remaining<0?'Abgelaufen':'Fällig innerhalb 30 Tagen'})),notes:['Heute und der 30. Folgetag zählen zum Fenster. Keine Lizenzverifikation; fehlende Fristen bedeuten keine unbefristete Berechtigung.']};}};
function qualityNumber(row,key,w,o={}){let v=row[key];if(v===undefined){if(o.default!==undefined)v=o.default;else{w.push(key+': Wert fehlt; vorläufig 0.');v=0;}}if(typeof v!=='number'||!Number.isFinite(v)||v<0||v>MAX)error(key+': Endliche Zahl von 0 bis 1 Billion erforderlich.');if(o.max!==undefined&&v>o.max){w.push(key+': Obergrenze überschritten.');v=o.max;}if(o.positive&&v<=0)w.push(key+': Muss größer als 0 sein.');else if(o.positive&&v<1e-9){v=1e-9;w.push(key+': Untergrenze unterschritten.');}if(o.integer&&!Number.isInteger(v)){w.push(key+': Ganze Zahl erforderlich; vorläufig abgerundet.');v=Math.floor(v);}return v;}
function launch(raw){input(raw);day(raw.analysis_date,'Prüftag');const sections=[];function add(key,label,records,evidence=false){const count=records.length,ready=records.filter(x=>x.ready).length;sections.push({key,label,count,ready,evidence,score:count?ready/count*100:0,warnings:records.flatMap(x=>x.warnings||[])});}
add('profit','Deckungsbeitrag',rows(raw,'orders').map(r=>{const w=[],revenue=qualityNumber(r,'revenue',w);qualityNumber(r,'cost',w);const refund=qualityNumber(r,'refund',w,{default:0});qualityNumber(r,'fees',w,{default:0});qualityNumber(r,'quantity',w,{default:1,positive:true,integer:true});if(!text(r.product,'Produkt')||text(r.product,'Produkt')==='Unbenannt')w.push('Produktname fehlt.');if(refund>revenue)w.push('Erstattung übersteigt Umsatz; Zuordnung prüfen.');return{ready:!w.length,warnings:w};}));
const flow=raw.cashflow==null?{}:object(raw.cashflow),fw=[];if(Object.keys(flow).length){const w=[];['cash','monthly_fixed_cost','monthly_revenue'].forEach(k=>qualityNumber(flow,k,w));qualityNumber(flow,'variable_cost_rate',w,{max:1});fw.push({ready:!w.length,warnings:w});}add('runway','Liquidität',fw);
const cap=raw.capacity==null?{}:object(raw.capacity),cw=[];if(Object.keys(cap).length){const w=[];qualityNumber(cap,'hours_available',w);qualityNumber(cap,'hours_per_order',w,{positive:true});qualityNumber(cap,'orders_expected',w,{integer:true});cw.push({ready:!w.length,warnings:w});}add('capacity','Kapazität',cw);
add('experiments','Experimente',rows(raw,'experiments').map(r=>{const w=[];let low=false;['control','variant'].forEach(group=>{const n=qualityNumber(r,group+'_visitors',w,{integer:true});let c=qualityNumber(r,group+'_conversions',w,{integer:true});if(c>n){w.push(group+': Abschlüsse übersteigen Besucher.');c=n;}if(n<100||c<20)low=true;});return{ready:!w.length&&!low,warnings:w};}),true);
add('priorities','Prioritäten',rows(raw,'initiatives').map(r=>{const w=[];qualityNumber(r,'impact',w);qualityNumber(r,'confidence',w,{max:1});qualityNumber(r,'effort',w,{positive:true});return{ready:!w.length,warnings:w};}));const cl=claims(raw),as=assets(raw);add('promises','Aussagen',cl.list.map(x=>({ready:x.ready,warnings:x.quality})),true);add('rights','Nutzungsrechte',as.list.map(x=>({ready:x.ready,warnings:[]})),true);const evidence=sections.filter(x=>x.evidence);return{sections,complete:sections.filter(x=>x.count).length,allReady:sections.every(x=>x.count&&x.ready===x.count&&!x.warnings.length),evidenceCount:evidence.reduce((s,x)=>s+x.count,0),evidenceReady:evidence.reduce((s,x)=>s+x.ready,0),quality:Math.round(sections.reduce((s,x)=>s+x.score,0)/7*100)/100};}
T.LaunchCompass={name:'Startkompass',description:'Prüft Vollständigkeit und Eingabequalität in sieben Geschäftsbereichen.',labels,example:{analysis_date:'2026-10-02',orders:[{product:'Workshop',revenue:490,cost:200,refund:0,fees:18,quantity:1}],cashflow:{cash:12000,monthly_fixed_cost:4800,monthly_revenue:5200,variable_cost_rate:.35},capacity:{hours_available:120,hours_per_order:2,orders_expected:45},experiments:[{name:'Einstiegsseite',control_visitors:1200,control_conversions:48,variant_visitors:1200,variant_conversions:78}],initiatives:[{name:'Onboarding verbessern',impact:8,confidence:.85,effort:2}],claims:[{text:'Der Workshop dauert drei Stunden.',evidence_url:'https://example.com/workshop',verified:true}],assets:[{name:'Eigenes Symbol',license:'Eigene Erstellung',permission:true,expires:''}]},run(raw){const r=launch(raw);return{metrics:[metric('Bereiche mit Daten',r.complete,'/ 7'),metric('Vollständigkeit',pct(r.complete,7),'%'),metric('Mittlere Bereichsqualität',r.quality,'%'),metric('Beleg- und Experimentprüfpunkte erfüllt',pct(r.evidenceReady,r.evidenceCount),'%')],rows:r.sections.map(x=>({Bereich:x.label,Datensätze:x.count,'Erfüllte Prüfpunkte':x.ready,'Bereichsqualität (%)':pct(x.ready,x.count)??0,Status:!x.count?'Daten fehlen':x.ready===x.count&&!x.warnings.length?'Prüfliste erfüllt':'Offene Daten- oder Belegprüfung',Hinweise:x.warnings.join(' ')||(!x.count?'Daten ergänzen.':x.ready<x.count?'Eigene Prüfung oder Experimentdaten ergänzen.':'Keine offenen Prüfpunkte.')})),notes:[r.allReady?'Prüfliste vollständig.':'Offene Punkte bearbeiten.','Vollständigkeit = vorhandene Bereiche / 7. Qualität = Mittel von sieben Prüfanteilen; fehlende Bereiche zählen als 0 %.','Experimente benötigen mindestens 100 Besucher und 20 Abschlüsse je Gruppe. Verlustaufträge und Kapazitätslücken sind keine Eingabefehler.','Keine Bestätigung von Nachfrage, Rechtskonformität oder Produktionsreife. Keine Quellen oder Bedingungen werden abgerufen.']};}};
})();
</script><script>(() => {
  'use strict';
  const id=document.body.dataset.tool;
  const tool=window.NeulandTools[id];
  const $=x=>document.getElementById(x);
  const copy=x=>JSON.parse(JSON.stringify(x));
  let data=copy(tool.example), readForm, receipt=null, timer;
  const common={orders:'Bestellungen',product:'Produkt',name:'Name',id:'Kennung',revenue:'Umsatz (€)',cost:'Direkte Kosten (€)',refund:'Erstattungen (€)',fees:'Gebühren (€)',quantity:'Stückzahl',cashflow:'Liquidität',cash:'Kassenbestand (€)',monthly_fixed_cost:'Monatliche Fixkosten (€)',monthly_revenue:'Monatlicher Umsatz (€)',variable_cost_rate:'Variable Kostenquote (0–1)',capacity:'Kapazität',hours_available:'Verfügbare Stunden',hours_per_order:'Stunden je Auftrag',orders_expected:'Erwartete Aufträge',experiments:'Versuche',control_visitors:'Versuche A',control_conversions:'Erfolge A',variant_visitors:'Versuche B',variant_conversions:'Erfolge B',initiatives:'Vorhaben',impact:'Wirkung',confidence:'Zuversicht (0–1)',effort:'Aufwand',claims:'Behauptungen',text:'Text',evidence_url:'Beleg-URL',verified:'Selbst geprüft',assets:'Assets',license:'Nutzungsgrundlage / Lizenz',permission:'Freigabe erfasst',expires:'Ablaufdatum (optional)',analysis_date:'Stichtag',decisions:'Entscheidungen',title:'Titel',hypothesis:'Hypothese',action:'Handlung',expected_result:'Erwartetes Ergebnis',outcome:'Beobachtetes Ergebnis',status:'Status',score:'Score',contribution:'Deckungsbeitrag',margin:'Quote',date:'Datum'};
  function label(key){return (tool.labels||{})[key]||common[key]||key.replaceAll('_',' ');}
  function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n;}
  function inform(text,bad=false){$('notice').textContent=text;$('notice').className=bad?'notice bad':'notice';$('notice').hidden=!text;}
  function invalidate(){receipt=null;$('export').disabled=true;$('results').hidden=true;}
  function control(value,key,template,level=0){
    if(level>10)throw new Error('Zu viele verschachtelte Eingaben.');
    if(Array.isArray(value)){
      const box=el('section','array');const head=el('div','array-head');head.append(el('h3','',label(key)+' · '+value.length));const list=el('div','array-list');const readers=[];
      value.forEach((item,i)=>{const row=el('div','array-item');const itemTemplate=Array.isArray(template)?template[0]:item;const widget=control(item,key,itemTemplate,level+1);row.append(widget.node);const remove=el('button','remove','Eintrag entfernen');remove.type='button';remove.onclick=()=>{try{data=readForm();let target=findArray(data,box.dataset.path);target.splice(i,1);renderForm(data);calculate();}catch(e){inform(e.message,true);}};row.append(remove);list.append(row);readers.push(widget.read);});
      const add=el('button','add','+ '+label(key)+' ergänzen');add.type='button';add.disabled=value.length>=100;add.onclick=()=>{try{data=readForm();const arr=findArray(data,box.dataset.path);const base=Array.isArray(template)&&template.length?template[0]:value[0];if(base===undefined)throw new Error('Für diesen Bereich gibt es keine Vorlage.');const fresh=copy(base);if(fresh&&typeof fresh==='object'&&typeof fresh.id==='string'){let serial=1;while(arr.some(item=>item.id===fresh.id))fresh.id='eintrag-'+serial++;}arr.push(fresh);renderForm(data);calculate();}catch(e){inform(e.message,true);}};
      head.append(add);box.append(head,list);return{node:box,read:()=>readers.map(fn=>fn()),arrayBox:box};
    }
    if(value&&typeof value==='object'){
      const group=el('div','input-group');const readers={};
      for(const[k,v]of Object.entries(value)){const widget=control(v,k,template?.[k],level+1);widget.node.dataset.field=k;group.append(widget.node);readers[k]=widget.read;}
      return{node:group,read:()=>Object.fromEntries(Object.entries(readers).map(([k,fn])=>[k,fn()]))};
    }
    const wrap=el('label','field',label(key));let input;
    if(key==='status'&&tool.journal){input=el('select');[['open','Offen'],['learned','Gelernt'],['discarded','Verworfen']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;input.append(o);});input.value=value;}
    else {input=el('input');if(typeof value==='boolean'){input.type='checkbox';input.checked=value;wrap.classList.add('boolean');}else if(typeof value==='number'){input.type='number';input.step='any';input.value=String(value);}else{input.type='text';input.value=value??'';input.maxLength=4000;}}
    input.dataset.key=key;wrap.append(input);
    return{node:wrap,read:()=>{if(input.type==='checkbox')return input.checked;if(input.type==='number'){if(input.value.trim()===''||!Number.isFinite(input.valueAsNumber))throw new Error(label(key)+': Eine gültige Zahl eingeben.');return input.valueAsNumber;}return input.value;}};
  }
  function findArray(obj,path){return JSON.parse(path).reduce((x,k)=>x[k],obj);}
  function assignPaths(node,path=[]){for(const child of node.children){if(child.classList.contains('array')){const field=child.dataset.field;const p=field===undefined?path:path.concat(field);child.dataset.path=JSON.stringify(p);const list=child.querySelector(':scope > .array-list');[...list.children].forEach((row,i)=>assignPaths(row,p.concat(i)));}else if(child.dataset.field!==undefined)assignPaths(child,path.concat(child.dataset.field));else assignPaths(child,path);}}
  function renderForm(input){const widget=control(input,'input',tool.example);$('fields').replaceChildren(widget.node);readForm=widget.read;assignPaths($('fields'));}
  function format(value,unit){if(value===null||value===undefined)return 'Nicht berechenbar';if(typeof value==='boolean')return value?'Ja':'Nein';if(typeof value==='number'){if(!Number.isFinite(value))return 'Nicht berechenbar';if(unit==='EUR'||unit==='€')return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(value);return new Intl.NumberFormat('de-DE',{maximumFractionDigits:3}).format(value)+(unit?' '+unit:'');}return String(value)+(unit?' '+unit:'');}
  function show(result){
    const metrics=el('div','metrics');for(const item of result.metrics||[]){const card=el('div','metric');card.append(el('span','metric-label',item.label),el('strong','metric-value',format(item.value,item.unit)));metrics.append(card);}$('metrics').replaceChildren(metrics);
    $('rows').replaceChildren();if(Array.isArray(result.rows)&&result.rows.length){const keys=[...new Set(result.rows.flatMap(row=>Object.keys(row)))];const table=el('table');const head=el('thead');const tr=el('tr');keys.forEach(k=>tr.append(el('th','',label(k))));head.append(tr);const tbody=el('tbody');result.rows.forEach(row=>{const r=el('tr');keys.forEach(k=>{const value=row[k];r.append(el('td','',value&&typeof value==='object'?JSON.stringify(value):format(value)));});tbody.append(r);});table.append(head,tbody);$('rows').append(table);}
    $('notes').replaceChildren();for(const text of result.notes||[])$('notes').append(el('p','',text));$('results').hidden=false;
  }
  function calculate(){clearTimeout(timer);invalidate();try{const input=readForm();const result=tool.run(input);JSON.stringify(result,(k,v)=>{if(typeof v==='number'&&!Number.isFinite(v))throw new Error('Das Ergebnis überschreitet den darstellbaren Zahlenbereich.');return v;});data=input;show(result);receipt={schema:'neuland.offline.'+id,schema_version:1,created_at:new Date().toISOString(),input:copy(input),result};$('export').disabled=false;inform('');return true;}catch(e){inform(e.message||'Eingaben prüfen.',true);return false;}}
  $('title').textContent=tool.name;document.title=tool.name+' · NEULAND';$('description').textContent=tool.description;
  $('fields').addEventListener('input',()=>{invalidate();clearTimeout(timer);timer=setTimeout(calculate,220);});$('calculate').onclick=calculate;
  $('demo').onclick=()=>{data=copy(tool.example);renderForm(data);calculate();};
  $('export').onclick=()=>{if(!receipt)return;const url=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='NEULAND_'+id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  $('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>256*1024)throw new Error('Datei zu groß: höchstens 256 KB.');const raw=JSON.parse(await file.text());if(raw.schema&&raw.schema!=='neuland.offline.'+id)throw new Error('Dieser Beleg gehört zu einem anderen Werkzeug.');const input=raw.input??raw;tool.run(input);data=copy(input);renderForm(data);calculate();inform('Datei geladen und neu berechnet.');}catch(e){inform(e.message||'Datei ungültig.',true);}finally{$('file').value='';}};
  const journalKey='neuland.offline.journal.v1';if(tool.journal){$('save').hidden=false;$('storage-note').textContent='Eigenständiges Journal. Es ist getrennt vom SQLite-Journal im Hauptdashboard.';try{const saved=localStorage.getItem(journalKey);if(saved){const input=JSON.parse(saved);tool.run(input);data=input;}}catch(e){$('storage-note').textContent+=' Browser-Speicherung nicht verfügbar; nutze JSON-Export.';}$('save').onclick=()=>{if(!calculate())return;try{localStorage.setItem(journalKey,JSON.stringify(data));inform('Journal in diesem Browser gespeichert. Zusätzlich als JSON sichern.');}catch(e){inform('Browser-Speicherung nicht verfügbar. Sichere das Journal mit JSON exportieren.',true);}};}
  renderForm(data);calculate();
})();
</script><script src="../zentrale/rueckweg.js"></script>
